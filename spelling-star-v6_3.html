}
// ---------- Spot the Spelling (recognition mini-game) ----------
//
// Every distractor has to pass one test: READ IT ALOUD AND IT SAYS THE WORD.
//
// The generator this replaces transposed adjacent letters and doubled them at
// random, which produced "levae", "ehlp", "ztay", "naother" — slips of the
// fingers, not errors of the ear. A child rejects those on shape without ever
// reading them, so the round is won at a glance and teaches nothing.
//
// Nothing below rearranges letters. Each rule respells a sound the way English
// legitimately spells that same sound in some other word: ea->ee (leave /
// leeve), ay->ai (stay / stai), ch->tch (much / mutch), x->ks (next / nekst),
// ould->ood (should / shood). The candidate is wrong but pronounceable, so
// rejecting it takes knowing what the word looks like — which is the thing
// being practiced.
//
// Distractors come from three places, best first:
//   1. the child's own recorded misspelling of this word (resultRow.missedAs)
//   2. a curated alternative on the word (the CSV's `misspellings` column)
//   3. this generator
//
// A regular word like `swim` has no interesting error to make, and still gets
// a fair round ("swym"): easy rounds are worth keeping for the confidence, they
// just must not be junk rounds. Difficulty comes from the word, not from how
// mangled the distractor is.

// Words the child is separately studying. A generated or curated distractor is
// never allowed to be one of them — offering a word off their own list invites
// them to file it away as a misspelling. Their *own* recorded errors are
// exempt: if they really wrote it, it is the most honest round available.
// The `misspellings` column: wrong spellings a parent wants Spot the Spelling
// to offer for this word, pipe-separated ("beleeve|beleive"). Curation exists
// for words the generator cannot reach — "said" is irregular enough that no
// rule derives "sed" from it — and to let a parent pin the error their own
// child actually makes.
function parseMisspellings(raw) {
  if (Array.isArray(raw)) raw = raw.join("|");
  return String(raw || "")
    .split(/[|;]/).map(s => s.trim().toLowerCase()).filter(Boolean)
    .filter((s, i, a) => a.indexOf(s) === i);
}

function realWordSet() {
  const set = new Set();
  data.lists.forEach(l => { l.words.forEach(w => set.add(w.word)); l.bonus.forEach(w => set.add(w.word)); });
  data.reviewWords.forEach(w => set.add(w.word));
  data.graduated.forEach(w => set.add(w.word));
  return set;
}

const VOWELS = "aeiou";
const isVowel = ch => !!ch && VOWELS.includes(ch);

// [pattern, replacement, rank]. Lower rank = more plausible as a real child's
// spelling, and the lowest rank that produces anything wins — so a word with a
// genuine vowel-team trap never falls through to a merely legal consonant swap.
//
// The anchors carry the weight. Unanchored `c`->`k` gives "kity" for city and
// `s`->`z` gives "ztay" for stay: both change how the letters read, which is
// exactly the junk this is replacing. `c`->`k` fires only before a, o, u; `s`
// becomes `z` only where s already says /z/.
const RESPELLINGS = [
  // 1 — opaque spellings. Nothing in the sound tells you these, so a child
  //     spelling by ear lands somewhere else and stays there. Best rounds.
  [/ould$/, "ood", 1], [/ould$/, "ud", 1],
  [/ough$/, "uff", 1], [/augh/, "aff", 1],
  [/ove$/, "oov", 1], [/ove$/, "uve", 1],
  [/ight$/, "ite", 1], [/ight$/, "yte", 1],
  [/eigh/, "ay", 1],
  [/ave$/, "av", 1], [/ive$/, "iv", 1], [/ove$/, "uv", 1],
  [/^al(?=[a-z])/, "all", 1], [/uel$/, "ule", 1], [/uel$/, "ewl", 1],
  [/ft(?=en$)/, "ff", 1], [/st(?=en$|le$)/, "s", 1],
  // `kn` only loses its k before a, e, i, u: dropping it from "know" leaves
  // "now", which reads as a different word entirely.
  [/^wh/, "w", 1], [/^kn(?=[aeiu])/, "n", 1], [/^wr/, "r", 1], [/mb$/, "m", 1],
  // Contractions. Nothing in the sound of "don't" says where the apostrophe
  // goes, or that there is one at all, so these two are what children write:
  // dropping it ("dont") and sliding it one letter left ("does'nt", "do'nt").
  // Every other rule here is anchored to letters and leaves a contraction
  // untouched, which is why an apostrophe word would otherwise fall all the
  // way through to rank 6 and be shown against "don'tt".
  [/'/, "", 1], [/([a-z])'/, "'$1", 1],

  // 2 — vowel teams. English spells one long vowel several ways; picking the
  //     wrong one is the commonest spelling error there is.
  [/ea/, "ee", 2], [/ea/, "e", 2], [/ee/, "ea", 2], [/ee/, "ie", 2], [/ee/, "e", 2],
  [/ie/, "ee", 2], [/ie/, "ei", 2], [/ei/, "ie", 2],
  [/ay$/, "ai", 2], [/ay$/, "ey", 2], [/ai/, "ay", 2],
  [/oa/, "o", 2], [/old$/, "oald", 2], [/ost$/, "oast", 2], [/ow$/, "oe", 2],
  [/ou/, "oo", 2], [/ou/, "u", 2], [/oo/, "u", 2], [/oo/, "ou", 2],
  [/ew$/, "ue", 2], [/ue$/, "ew", 2],
  [/a([bcdfglmnprstvz])e$/, "ai$1e", 2], [/o([bcdfglmnprstvz])e$/, "oa$1e", 2],

  // 3 — schwa. An unstressed vowel sounds like nothing in particular, so which
  //     letter spells it is a coin toss for any speller.
  [/it$/, "et", 3], [/et$/, "it", 3], [/en$/, "in", 3], [/in$/, "en", 3],
  [/on$/, "en", 3], [/er$/, "ur", 3], [/er$/, "or", 3], [/or$/, "er", 3],
  [/ar$/, "er", 3], [/le$/, "el", 3],

  // 5 — consonants: the same sound, spelled another of the ways English spells
  //     it. Legal and readable, but usually easy to reject. (Rank 4 is the
  //     short-vowel swaps below, which matter more than these.)
  [/y$/, "ee", 5], [/u([bcdfglmnprstvz])e$/, "oo$1e", 5],
  [/tch/, "ch", 5], [/ch$/, "tch", 5],
  [/ck/, "k", 5], [/ck/, "cc", 5], [/k$/, "ck", 5],
  [/c(?=[aou])/, "k", 5], [/k(?=[aou])/, "c", 5],
  [/nk$/, "ngk", 5], [/x/, "ks", 5],
  [/ph/, "f", 5], [/f/, "ph", 5],
  [/([aeiou])s([aeiou])/, "$1z$2", 5], [/se$/, "ze", 5], [/ce$/, "se", 5],
];

// Rank 4, and the one tier that does not respell the same sound: it swaps a
// short vowel for its neighbour. catch/cetch, help/halp, many/meny,
// habit/hebit. These are what a child who spells by ear actually writes,
// because /ae/ and /e/ are genuinely hard to tell apart by sound alone — and
// most of English's opaque vowels resolve to exactly this confusion. Skips any
// vowel belonging to a team or doing silent-e duty, since those are not short.
function shortVowelSwaps(w) {
  const NEIGHBOURS = { a: ["e", "o"], e: ["a", "i"], i: ["e", "u"], o: ["u", "a"], u: ["o", "i"] };
  const out = [];
  for (let i = 0; i < w.length; i++) {
    if (!NEIGHBOURS[w[i]]) continue;
    if (isVowel(w[i - 1]) || isVowel(w[i + 1])) continue; // part of a vowel team
    if (i === w.length - 1) continue;                     // a final vowel is not short
    if (w[i + 2] === "e" && i + 3 === w.length) continue;  // silent e: the vowel is long
    for (const alt of NEIGHBOURS[w[i]]) out.push(w.slice(0, i) + alt + w.slice(i + 1));
  }
  return out;
}

// Rank 6, and the reason no word ever has to be skipped for want of a
// distractor. Doubling a consonant and adding a silent e are both ordinary
// English spellings that leave the word readable — "stande" is wrong the way a
// child is wrong, "stnad" is wrong the way a keyboard is wrong.
function structuralVariants(w) {
  const out = [];
  const last = w[w.length - 1];
  if (last && !isVowel(last)) out.push(w + last);
  if (last !== "e") out.push(w + "e");
  return out;
}

function plausibleDistractor(cand, word, banned) {
  if (!cand || cand === word) return false;
  if (cand.length < 2) return false;
  if (/(.)\1\1/.test(cand)) return false;   // no triple letters — nothing reads that way
  if (!/[aeiouy]/.test(cand)) return false; // a rule ate the only vowel
  return !banned.has(cand);
}

// Shared generator: reusable by future recognition games.
function generateMisspelling(word, banned) {
  const w = (word || "").toLowerCase();
  const ban = banned || realWordSet();
  const byRank = new Map();
  const offer = (cand, rank) => {
    if (!plausibleDistractor(cand, w, ban)) return;
    if (!byRank.has(rank)) byRank.set(rank, []);
    if (!byRank.get(rank).includes(cand)) byRank.get(rank).push(cand);
  };
  for (const [pat, repl, rank] of RESPELLINGS) {
    if (pat.test(w)) { try { offer(w.replace(pat, repl), rank); } catch (e) { /* skip */ } }
  }
  shortVowelSwaps(w).forEach(c => offer(c, 4));
  structuralVariants(w).forEach(c => offer(c, 6));

  // The best rank that produced anything, then a free choice inside it, so the
  // same word is not always shown against the same misspelling.
  const ranks = [...byRank.keys()].sort((a, b) => a - b);
  for (const r of ranks) {
    const pool = byRank.get(r);
    if (pool.length) return pool[Math.floor(Math.random() * pool.length)];
  }
  return w + (w[w.length - 1] || "e"); // guaranteed non-empty, and still readable
}

// Every misspelling this child has actually written for this word, commonest
// first — a spelling they have produced three times is more truly theirs than
// a one-off slip. Read straight out of session history; nothing extra stored.
function observedErrorsFor(word) {
  const w = String(word || "").toLowerCase();
  const counts = new Map();
  for (const s of (data.sessions || [])) {
    for (const r of (s.results || [])) {
      if (String(r.word || "").toLowerCase() !== w) continue;
      for (const m of (r.missedAs || [])) {
        const t = String(m || "").toLowerCase();
        if (t && t !== w) counts.set(t, (counts.get(t) || 0) + 1);
      }
    }
  }
  return [...counts.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
}

// The three sources, best first. Returns at least one.
function distractorsFor(wordObj) {
  const word = String(wordObj.word || "").toLowerCase();
  const banned = realWordSet();
  const out = [];
  const push = v => {
    const t = String(v || "").trim().toLowerCase();
    if (t && t !== word && !out.includes(t)) out.push(t);
  };
  observedErrorsFor(word).forEach(push);                       // exempt from `banned` (see realWordSet)
  (wordObj.misspellings || []).forEach(c => {
    if (plausibleDistractor(String(c || "").trim().toLowerCase(), word, banned)) push(c);
  });
  if (!out.length) push(generateMisspelling(word, banned));
  if (!out.length) push(word + (word[word.length - 1] || "e"));
  return out;
}

let SP = null;
function startSpotIt() {
  const lists = practiceLists();
  const list = lists[0];
  // Whole word objects, not just the spellings: the round needs the hint (so a
  // homophone is answerable) and any curated misspellings the parent supplied.
  const seen = new Set();
  const candidates = [];
  const add = w => { if (w && w.word && !seen.has(w.word)) { seen.add(w.word); candidates.push(w); } };
  lists.forEach(l => l.words.forEach(add));
  data.reviewWords.forEach(add);
  const pool = shuffle(candidates);
  if (!pool.length) {
    SP = null; // no round started — don't leave a stale round from a previous game in memory
    app.innerHTML = `<div class="card">No words to play with yet! Ask a parent to add some words in the parent dashboard.</div>
      <div class="center" style="margin-top:6px"><button class="big outline" onclick="go('games')">Back</button></div>`;
    return;
  }
  const targetCount = Math.min(pool.length, 8 + Math.floor(Math.random() * 3)); // burst of 8-10, capped by pool size
  const rounds = pool.slice(0, targetCount).map(w => {
    const options = distractorsFor(w);
    return {
      word: w.word,
      hint: w.hint || "",
      misspelled: options[Math.floor(Math.random() * options.length)],
      correctSide: Math.random() < 0.5 ? "left" : "right",
    };
  });
  SP = { rounds, idx: 0, results: [], ...listStamp(list), coverIds: lists.map(l => l.id), locked: false, pickedSide: null };
  app.innerHTML = `
    <div class="card center" style="padding:40px">
      <div style="font-size:14px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:8px">&#128269; Spot the Spelling</div>
      <h2 style="margin:0 0 6px;font-weight:800;font-size:26px">${lists.length > 1 ? lists.map(l => esc(l.name)).join(" + ") : esc(SP.listName)}</h2>
      <div class="muted" style="margin-bottom:20px">${SP.rounds.length} rounds &mdash; tap the word that's spelled correctly!</div>
      <div style="background:var(--soft);border-radius:14px;padding:16px 20px;font-size:19px;font-weight:600;margin-bottom:26px">Quick eyes, quick tap &mdash; just for fun!</div>
      <button class="big green" onclick="renderSpotItRound()">Let's play! &rarr;</button>
    </div>`;
}
function renderSpotItRound(fb) {
  if (!SP) return;
  const r = SP.rounds[SP.idx];
  const locked = !!fb;
  const leftWord = r.correctSide === "left" ? r.word : r.misspelled;
  const rightWord = r.correctSide === "right" ? r.word : r.misspelled;
  const cls = side => {
    if (!locked) return "";
    if (side === r.correctSide) return "ok";
    if (side === SP.pickedSide) return "bad";
    return "";
  };
  app.innerHTML = `
    <div class="card" style="padding:32px">
      <div style="font-size:14px;color:var(--muted);margin-bottom:20px">&#128269; Spot the Spelling &middot; round ${SP.idx+1} of ${SP.rounds.length}</div>
      <div class="muted center" style="margin-bottom:18px">Which one is spelled correctly?</div>
      ${r.hint ? `<div class="hint">&#128161; ${esc(r.hint)}</div>` : ""}
      <div class="row" style="gap:14px;justify-content:center">
        <button ${locked?"disabled":""} class="spot-choice ${cls("left")}" style="font-size:24px;letter-spacing:.06em;padding:22px 20px;flex:1;max-width:220px" onclick="submitSpot('left')">${esc(leftWord)}</button>
        <button ${locked?"disabled":""} class="spot-choice ${cls("right")}" style="font-size:24px;letter-spacing:.06em;padding:22px 20px;flex:1;max-width:220px" onclick="submitSpot('right')">${esc(rightWord)}</button>
      </div>
      <div class="feedback center" id="fb" style="margin-top:18px">${
        fb === "correct" ? `<span style="color:var(--green)">&#9989; Yes! <strong>${esc(r.word)}</strong> is the one!</span>` :
        fb === "wrong" ? `<span style="color:var(--danger)">Not quite &mdash; <strong>${esc(r.word)}</strong> is the real spelling.</span>` : ""
      }</div>
    </div>`;
}
function submitSpot(side) {
  if (!SP || SP.locked) return;
  const r = SP.rounds[SP.idx];
  const correct = side === r.correctSide;
  SP.locked = true; SP.pickedSide = side;
  SP.results.push({ word: r.word, correct });
  renderSpotItRound(correct ? "correct" : "wrong");
  setTimeout(nextSpot, 1000);
}
function nextSpot() {
  if (!SP) return; // navigated away before the timer fired — nothing to advance
  SP.idx++; SP.locked = false; SP.pickedSide = null;
  if (SP.idx >= SP.rounds.length) return finishSpotIt();
  renderSpotItRound();
}
function finishSpotIt() {
  if (!SP) return;
  const session = {
    id: Date.now(), date: new Date().toISOString(), mode: "spotit", ...carryListStamp(SP), ...coverStamp(SP),
    results: SP.results, score: 0, total: 0,
  };
  data.sessions.push(session);
  const saved = persist();
  syncPush();
  const right = SP.results.filter(r => r.correct).length;
  const total = SP.results.length;
  app.innerHTML = `
    ${saved ? "" : saveFailedBannerHtml("history-only")}
    <div class="card center" style="padding:40px">
      <div style="font-size:46px;margin-bottom:8px">&#127919;</div>
      <h2 style="margin:0 0 8px;font-weight:800">Nice spotting, ${esc(data.childName)}!</h2>
      <div class="muted">You got ${right} of ${total} right. Sharp eyes make better spellers!</div>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="big outline" onclick="go('games')">Play again</button>
        <button class="big" onclick="go('home')">Done</button>
      </div>
    </div>`;
}

// ---------- The slot board (shared primitive) ----------
//
// A row of per-letter slots filled by tapping a source. Missing Letters is the
// first configuration; Unscramble is the same board with nothing given and a
// consumable letter bank as its source (docs/spelling-star-games.md §5.0).
// Nothing below knows what the source is, which is the point of building it
// once: the board owns slots, selection, auto-advance, lift-to-correct and
// assemble-and-compare, so the second game configures it rather than
// reimplementing it.
//
// A slot is { ch, fixed }. A `fixed` slot is given to the child — the letters
// still showing in "bel__ve", and the pre-placed apostrophe in "o'clock". It
// is never selectable and never cleared, so the assembled string always has
// the right length and the child only ever moves what is theirs to move.
function makeBoard(word, blanks) {
  const blank = new Set(blanks);
  const slots = [...word].map((ch, i) => blank.has(i) ? { ch: "", fixed: false } : { ch, fixed: true });
  const board = { slots, sel: -1 };
  board.sel = nextOpenSlot(board, -1);
  return board;
}
// Wraps, so filling the last blank sends selection back to the first still
// empty one rather than stranding it at the end of the word.
function nextOpenSlot(board, from) {
  const n = board.slots.length;
  for (let k = 1; k <= n; k++) {
    const i = (from + k + n) % n;
    if (!board.slots[i].fixed && !board.slots[i].ch) return i;
  }
  return -1; // every blank is filled
}
function boardSelect(board, i) { if (board && !board.slots[i].fixed) board.sel = i; }
// Place from whatever the source is, then move on. Straightforward
// left-to-right filling is therefore just tap-tap with no slot-selecting at
// all, while a child who wants to anchor the hard part first can tap that slot
// and get it — the out-of-order path costs the child who doesn't want it
// nothing.
function boardPlace(board, ch) {
  if (!board || board.sel < 0) return;
  board.slots[board.sel].ch = ch;
  const next = nextOpenSlot(board, board.sel);
  if (next !== -1) board.sel = next; // last blank filled: selection stays put
}
// Tapping a filled blank lifts its letter out and leaves that slot selected.
// One rule covers correction, and it is the rule Unscramble needs too (there
// it also returns the letter to the bank).
function boardLift(board, i) {
  if (!board || board.slots[i].fixed) return;
  board.slots[i].ch = "";
  board.sel = i;
}
function boardComplete(board) { return board.slots.every(s => s.fixed || s.ch); }
function boardString(board) { return board.slots.map(s => s.ch || " ").join(""); }

// ---------- Missing Letters: choosing the blanks ----------
//
// The whole idea of the game (docs/spelling-star-games.md §5.2) is that the
// blanks are not random. Every misspelling this child has actually written is
// already in session history as `missedAs`, so diff their spelling against the
// real one and blank exactly where they went wrong: a child who has written
// "beleive" gets "bel__ve" and drills the trap itself rather than a random
// hole. That is also what makes this a production game rather than a
// recognition one — Spot the Spelling can show them the trap, this makes them
// produce their way out of it.
//
// Trim the matching head and the matching tail; what is left in the middle of
// the REAL word is the part their spelling disagreed with. Length differences
// fall out of this for free — "wich" against "which" leaves just the `h`.
function errorSpan(word, miss) {
  if (!miss || word === miss) return null;
  let p = 0;
  while (p < word.length && p < miss.length && word[p] === miss[p]) p++;
  let s = 0;
  while (s < word.length - p && s < miss.length - p &&
         word[word.length - 1 - s] === miss[miss.length - 1 - s]) s++;
  const from = p, to = word.length - s;
  if (to > from) return { from, to };
  // Their spelling is the real word with something INSERTED — "untill" for
  // "until", "runing" the other way round. No position in the real word is
  // itself wrong, so there is nothing for the trim to leave behind. Blank the
  // letter beside the insertion instead, which for a doubled consonant is
  // exactly the "one l or two" question — the thing the games doc (§5.0) says
  // Unscramble structurally cannot ask and this game can.
  const i = Math.max(0, Math.min(p, word.length - 1));
  return { from: i, to: i + 1 };
}

function letterCount(word) { return [...foldApos(word)].filter(ch => ch !== "'").length; }

// Two blanks for a short word, three once there is room to spare. Never every
// letter: a board with nothing given is Practice with extra steps.
function blankTarget(word) { return letterCount(word) >= 7 ? 3 : 2; }

function pickBlanks(word) {
  const w = foldApos(word).toLowerCase();
  const target = blankTarget(w);
  // An apostrophe is never blanked. Same posture as the keypad's apostrophe
  // key, which is always present so it never signals which words need one:
  // here it is always given, so a blank never gives away that a contraction is
  // coming.
  const blankable = [];
  for (let i = 0; i < w.length; i++) if (w[i] !== "'") blankable.push(i);
  if (blankable.length <= target) return []; // too short to be a puzzle; caller filters

  const chosen = [];
  const take = (i, cap) => {
    if (chosen.length < cap && blankable.includes(i) && !chosen.includes(i)) chosen.push(i);
  };

  // 1. Where this child has actually gone wrong, commonest error first, since
  //    a spelling they have produced three times is more truly theirs than a
  //    one-off slip (observedErrorsFor already orders them that way).
  for (const miss of observedErrorsFor(w)) {
    const span = errorSpan(w, miss);
    if (!span) continue;
    for (let i = span.from; i < span.to; i++) take(i, 3); // at most three, however wide the disagreement
    if (chosen.length) break;
  }
  if (chosen.length) {
    // Their error IS the board, and it does not get padded out to a quota. An
    // earlier version topped a two-letter span up to three with a random
    // vowel, which turned "bel__ve" — the exact trap — into "bel__v_" and put
    // a meaningless hole next to a meaningful one.
    //
    // A single-letter span is the one case worth widening, because a lone
    // blank barely reads as a puzzle. Take the letter beside it, so the trap
    // stays covered rather than a second hole opening elsewhere in the word.
    if (chosen.length === 1) {
      const i = chosen[0];
      [i + 1, i - 1].some(j => { take(j, 2); return chosen.length === 2; });
    }
    return chosen.sort((a, b) => a - b);
  }
  // 2. No usable history: vowels and vowel teams, which is where English keeps
  //    most of its traps anyway.
  shuffle(blankable.filter(i => "aeiouy".includes(w[i]))).forEach(i => take(i, target));
  // 3. A word with too few vowels to go round ("rhythm", "strength").
  if (chosen.length < target) shuffle(blankable).forEach(i => take(i, target));
  return chosen.sort((a, b) => a - b);
}

// ---------- Missing Letters (production mini-game) ----------
//
// Ungraded and unlosable, like every game (§2): `score: 0, total: 0`, a wrong
// board costs nothing and the letters stay put for another go.
//
// One thing this deliberately does NOT do: write `missedAs`. A wrong board is
// a real misspelling the child produced, and it is tempting to feed it back
// into the same history that picks the blanks — but the blanks constrain what
// they could possibly have typed, so it would be a loop rather than evidence:
// blank the position they get wrong, record that they got it wrong, blank it
// again forever. Free-typed errors from Practice and Test stay the only
// source. Whether a game should surface anything to the parent at all is the
// open question in the games doc §7, and it is theirs to answer, not this
// file's.
let ML = null;
function startMissing() {
  const lists = practiceLists();
  const list = lists[0];
  // Whole word objects: the round needs the hint and the sentence, same as
  // Practice, because a board with two holes and no clue is a guess.
  const seen = new Set();
  const candidates = [];
  const add = w => { if (w && w.word && !seen.has(w.word)) { seen.add(w.word); candidates.push(w); } };
  lists.forEach(l => l.words.forEach(add));
  data.reviewWords.forEach(add);
  // Blanking two letters of a three-letter word is not a puzzle, it is a coin
  // toss — and 36 of the corpus's 855 words are that short.
  const pool = shuffle(candidates.filter(w => letterCount(w.word) >= 4));
  const targetCount = Math.min(pool.length, 6 + Math.floor(Math.random() * 3)); // burst of 6-8
  // The length filter above already guarantees pickBlanks() finds room, so the
  // filter here is belt-and-braces — but an empty round list would be a blank
  // screen on a child's tablet, so it gets the same courteous exit as no words.
  const rounds = pool.slice(0, targetCount).map(w => {
    const word = foldApos(w.word).toLowerCase();
    return { word, hint: w.hint || "", sentence: w.sentence || "", blanks: pickBlanks(word) };
  }).filter(r => r.blanks.length);
  if (!rounds.length) {
    ML = null; // no round started — don't leave a stale board from a previous game in memory
    app.innerHTML = `<div class="card">No words long enough to play with yet! Ask a parent to add some longer words in the parent dashboard.</div>
      <div class="center" style="margin-top:6px"><button class="big outline" onclick="go('games')">Back</button></div>`;
    return;
  }
  ML = {
    rounds, idx: 0, results: [], attempts: 0, locked: false,
    board: makeBoard(rounds[0].word, rounds[0].blanks),
    ...listStamp(list), coverIds: lists.map(l => l.id),
  };
  app.innerHTML = `
    <div class="card center" style="padding:40px">
      <div style="font-size:14px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:8px">&#129513; Missing Letters</div>
      <h2 style="margin:0 0 6px;font-weight:800;font-size:26px">${lists.length > 1 ? lists.map(l => esc(l.name)).join(" + ") : esc(ML.listName)}</h2>
      <div class="muted" style="margin-bottom:20px">${ML.rounds.length} words &mdash; fill in the letters that ran away!</div>
      <div style="background:var(--soft);border-radius:14px;padding:16px 20px;font-size:19px;font-weight:600;margin-bottom:26px">Some letters are hiding. Can you put them back?</div>
      <button class="big green" onclick="renderMissingRound()">Let's play! &rarr;</button>
    </div>`;
}

function slotHtml(board, i, done) {
  const slot = board.slots[i];
  if (slot.fixed) {
    return slot.ch === "'"
      ? `<div class="slot punct">&#39;</div>`
      : `<div class="slot given">${esc(slot.ch)}</div>`;
  }
  const cls = ["slot", "open"];
  if (slot.ch) cls.push("filled");
  if (done) cls.push("ok");
  else if (i === board.sel) cls.push("sel");
  return `<button class="${cls.join(" ")}" ${done ? "disabled" : ""} onclick="mlTapSlot(${i})">${slot.ch ? esc(slot.ch) : "&nbsp;"}</button>`;
}

function renderMissingRound(fb) {
  if (!ML) return;
  const r = ML.rounds[ML.idx];
  const board = ML.board;
  // A wrong board does not lock: the letters stay where the child put them and
  // there is another go, which is the difference between a game and a test.
  const done = fb === "correct" || fb === "reveal";
  const ready = boardComplete(board);
  app.innerHTML = `
    <div class="card" style="padding:32px">
      <div style="font-size:14px;color:var(--muted);margin-bottom:20px">&#129513; Missing Letters &middot; word ${ML.idx+1} of ${ML.rounds.length}</div>
      <div class="row" style="margin-bottom:20px">
        <button onclick="speak(ML.rounds[ML.idx].word)">&#128266; Hear the word</button>
        <button class="outline" onclick="speak(ML.rounds[ML.idx].word,true)">&#128034; Say it slowly</button>
        ${r.sentence ? `<button class="outline" onclick="speak(ML.rounds[ML.idx].sentence)">&#128214; Hear a sentence</button>` : ""}
      </div>
      ${r.hint ? `<div class="hint">&#128161; ${esc(r.hint)}</div>` : ""}
      <div class="board">${board.slots.map((_, i) => slotHtml(board, i, done)).join("")}</div>
      <div class="kb" id="kb">
        ${kbRows().map((row,ri) => `<div class="kb-row">
          ${row.split("").map(ch => `<button class="${ch === "'" ? "kb-punct" : ""}" ${done?"disabled":""} onclick="mlType(&quot;${ch.toLowerCase()}&quot;)">${ch}</button>`).join("")}
          ${ri===2 ? `<button class="kb-back" ${done?"disabled":""} onclick="mlErase()">&#9003; erase</button>` : ""}
        </div>`).join("")}
      </div>
      <div class="feedback center" id="fb">${
        fb === "correct" ? `<span style="color:var(--green)">&#9989; Yes! <strong>${esc(r.word)}</strong> &mdash; you found them!</span>` :
        fb === "wrong" ? `<span style="color:var(--accent)">Not quite &mdash; have another look. Tap a letter you want to change.</span>` :
        fb === "reveal" ? `<span style="color:var(--accent);letter-spacing:.2em;font-size:26px">${esc(r.word.toUpperCase())}</span>` : ""
      }</div>
      <div class="row" style="margin-top:10px;justify-content:center">
        ${done
          ? (fb === "reveal" ? '<button class="big green" onclick="nextMissing()">Next word &rarr;</button>' : "")
          : `<button class="big" ${ready?"":"disabled"} onclick="submitMissing()">Check it</button>
             ${ML.attempts >= 2 ? '<button class="outline" onclick="revealMissing()">Show me the word</button>' : ""}`}
      </div>
    </div>`;
}

function mlTapSlot(i) {
  if (!ML || ML.locked) return;
  const slot = ML.board.slots[i];
  if (slot.fixed) return;
  if (slot.ch) boardLift(ML.board, i); else boardSelect(ML.board, i);
  renderMissingRound();
}
// The keypad is the tap source. The apostrophe key is live like everywhere
// else — it can be placed and lifted back out like any letter — because a key
// that greys out only in this game would be telling the child something about
// the word, which is exactly what the always-present key exists to avoid.
function mlType(ch) {
  if (!ML || ML.locked) return;
  boardPlace(ML.board, ch);
  renderMissingRound();
}
// Erase clears the selected blank if it holds a letter, otherwise the last
// filled one, so the key does the obvious thing whichever way the child got here.
function mlErase() {
  if (!ML || ML.locked) return;
  const b = ML.board;
  if (b.sel >= 0 && !b.slots[b.sel].fixed && b.slots[b.sel].ch) { boardLift(b, b.sel); }
  else {
    for (let i = b.slots.length - 1; i >= 0; i--) {
      if (!b.slots[i].fixed && b.slots[i].ch) { boardLift(b, i); break; }
    }
  }
  renderMissingRound();
}
function submitMissing() {
  if (!ML || ML.locked || !boardComplete(ML.board)) return;
  const r = ML.rounds[ML.idx];
  ML.attempts++;
  if (foldApos(boardString(ML.board)).toLowerCase() !== foldApos(r.word).toLowerCase()) {
    // Nothing is lost and nothing is recorded yet. The board is left exactly as
    // they built it — telling them WHICH slot is wrong would turn the puzzle
    // into one-slot trial and error, so the whole board just says "look again".
    renderMissingRound("wrong");
    return;
  }
  ML.locked = true;
  // `correct` is first-try, which is the only measure worth a parent's
  // attention; `attempts` carries the rest. Neither is ever shown to the child
  // as a failure — they filled in the word, and the screen says so.
  ML.results.push({ word: r.word, correct: ML.attempts === 1, attempts: ML.attempts });
  renderMissingRound("correct");
  setTimeout(nextMissing, 1200);
}
function revealMissing() {
  if (!ML || ML.locked) return;
  const r = ML.rounds[ML.idx];
  r.blanks.forEach(i => { ML.board.slots[i].ch = r.word[i]; });
  ML.locked = true;
  ML.results.push({ word: r.word, correct: false, attempts: ML.attempts, revealed: true });
  renderMissingRound("reveal");
}
function nextMissing() {
  if (!ML) return; // navigated away before the timer fired — nothing to advance
  ML.idx++;
  if (ML.idx >= ML.rounds.length) return finishMissing();
  const r = ML.rounds[ML.idx];
  ML.locked = false; ML.attempts = 0;
  ML.board = makeBoard(r.word, r.blanks);
  renderMissingRound();
}
function finishMissing() {
  if (!ML) return;
  const session = {
    id: Date.now(), date: new Date().toISOString(), mode: "missing", ...carryListStamp(ML), ...coverStamp(ML),
    results: ML.results, score: 0, total: 0,
  };
  data.sessions.push(session);
  const saved = persist();
  syncPush();
  const firstTry = ML.results.filter(r => r.correct).length;
  const total = ML.results.length;
  // The round is over, so nothing is in flight any more. Same discipline as
  // go()'s null-out and for the same reason: a next-word timer still pending
  // from the last word would otherwise run off the end of the round and write
  // the session a second time.
  ML = null;
  app.innerHTML = `
    ${saved ? "" : saveFailedBannerHtml("history-only")}
    <div class="card center" style="padding:40px">
      <div style="font-size:46px;margin-bottom:8px">&#129513;</div>
      <h2 style="margin:0 0 8px;font-weight:800">You found them all, ${esc(data.childName)}!</h2>
      <div class="muted">${total} word${total===1?"":"s"} filled in${firstTry ? ` &mdash; ${firstTry} on the very first try` : ""}. Knowing which letters go where is real spelling!</div>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="big outline" onclick="go('games')">Play again</button>
        <button class="big" onclick="go('home')">Done</button>
      </div>
    </div>`;
}

// ============================================================================
// Crossword (docs/spelling-star-games.md §5.6)
//
// The first game where the child spells a word with no letters given and no
// bank to draw from — only a definition and whatever crossing letters they
// have already earned. That is the whole reason it is worth building: Missing
// Letters gives them most of the word, Unscramble gives them all of it out of
// order, and this gives them none of it.
//
// Three things are worth knowing about how it is put together:
//
//   - The grid is generated, not authored. cwLayout() packs the week's actual
//     words, so the puzzle is different every time and no list needs a
//     hand-built grid. It refuses run-ons and sideways contact (cwFits), which
//     is what guarantees every maximal run of letters in the finished grid is
//     a word somebody clued — the child can never be marked wrong for an
//     accidental "word" the packer created.
//
//   - The clue is `hint`, which every one of the 988 curated rows already
//     carries and which was written as a definition — exactly a crossword
//     clue. Only one row in the corpus mentions its own answer. `sentence` is
//     offered too, with the answer blanked out, because reading it aloud
//     otherwise says the answer.
//
//   - A solved entry locks. Its letters are proven correct, so they stop being
//     controls (same reasoning as .slot.given) and the crossing words get
//     easier as the puzzle fills. That is the progressive help this game has
//     instead of a hint button, and it is why a wrong entry needs no penalty:
//     the puzzle simply stays open.
//
// Not a grade, per §2 and parent-sync-spec §16: score 0, total 0. An unsolved
// entry is recorded as unsolved and nothing more — the child chose to stop,
// which is allowed.
// ============================================================================
let CW = null;

// A burst is budgeted in LETTERS, not words. "Administration" and "cat" cost
// the grid wildly different amounts of room, so a fixed word count would give
// grade 3 a puzzle half the size of grade 5's. Sizing by letters holds the
// finished grid at roughly 13 squares a side for every list in the corpus.
const CW_LETTER_BUDGET = 58;
const CW_MIN_WORDS = 5;
const CW_MAX_WORDS = 10;

// ---------- Layout ----------
// Greedy best-placement with restarts. Deterministic on the first pass (longest
// word first, which is the classic seed) and shuffled thereafter, keeping the
// best result. A few hundred packings of ten short words is microseconds, and
// the alternative — backtracking to a guaranteed-optimal grid — buys a child
// nothing they can see.
function cwFits(cells, w, r, c, dr, dc) {
  const key = (rr, cc) => rr + "," + cc;
  let cross = 0;
  // Nothing may butt up against either end, or two entries read as one longer
  // word that has no clue and no number.
  if (cells.has(key(r - dr, c - dc))) return -1;
  if (cells.has(key(r + dr * w.length, c + dc * w.length))) return -1;
  for (let i = 0; i < w.length; i++) {
    const rr = r + dr * i, cc = c + dc * i;
    const g = cells.get(key(rr, cc));
    if (g !== undefined) {
      if (g !== w[i]) return -1;
      cross++;                       // an existing letter: this is a crossing
    } else {
      // A brand-new square may not touch anything sideways, for the same
      // reason: it would create a two-letter run nobody clued.
      if (cells.has(key(rr + dc, cc + dr))) return -1;
      if (cells.has(key(rr - dc, cc - dr))) return -1;
    }
  }
  return cross;                      // 0 means "floats free" — rejected by the caller
}

function cwPack(words) {
  const cells = new Map();
  const placed = [];
  const key = (r, c) => r + "," + c;
  const commit = (w, r, c, dr, dc) => {
    for (let i = 0; i < w.length; i++) cells.set(key(r + dr * i, c + dc * i), w[i]);
    placed.push({ word: w, r, c, dr, dc });
  };
  commit(words[0], 0, 0, 0, 1);
  const leftovers = [];
  // Two sweeps: a word that found no hook early often fits once the grid has
  // filled out, and re-offering it is one more pass over a few dozen squares.
  for (const pass of [words.slice(1), leftovers]) {
    for (const w of pass) {
      let best = null;
      for (let i = 0; i < w.length; i++) {
        for (const [k, g] of cells) {
          if (g !== w[i]) continue;
          const parts = k.split(",");
          const hr = +parts[0], hc = +parts[1];
          for (const [dr, dc] of [[0, 1], [1, 0]]) {
            const r = hr - dr * i, c = hc - dc * i;
            const cross = cwFits(cells, w, r, c, dr, dc);
            if (cross <= 0) continue;
            let minR = Math.min(r, hr), maxR = Math.max(r + dr * (w.length - 1), hr);
            let minC = Math.min(c, hc), maxC = Math.max(c + dc * (w.length - 1), hc);
            for (const k2 of cells.keys()) {
              const p2 = k2.split(","), r2 = +p2[0], c2 = +p2[1];
              if (r2 < minR) minR = r2; if (r2 > maxR) maxR = r2;
              if (c2 < minC) minC = c2; if (c2 > maxC) maxC = c2;
            }
            const h = maxR - minR + 1, wd = maxC - minC + 1;
            // More crossings first (a knitted grid is the point), then small,
            // then square — a 4x22 ribbon technically packs but does not fit
            // on a tablet.
            const score = cross * 100 - (h * wd) / 10 - Math.abs(h - wd);
            if (!best || score > best.score) best = { score, r, c, dr, dc };
          }
        }
      }
      if (best) commit(w, best.r, best.c, best.dr, best.dc);
      else if (pass !== leftovers) leftovers.push(w);
    }
  }
  let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
  for (const k of cells.keys()) {
    const p = k.split(","), r = +p[0], c = +p[1];
    if (r < minR) minR = r; if (r > maxR) maxR = r;
    if (c < minC) minC = c; if (c > maxC) maxC = c;
  }
  return { placed, rows: maxR - minR + 1, cols: maxC - minC + 1, minR, minC };
}

function cwLayout(words, tries) {
  let best = null;
  for (let t = 0; t < (tries || 140); t++) {
    const order = t === 0 ? [...words].sort((a, b) => b.length - a.length) : shuffle(words);
    const g = cwPack(order);
    const boxed = g.rows <= 14 && g.cols <= 14;
    const score = g.placed.length * 1000 + (boxed ? 500 : 0) - (g.rows * g.cols) / 10;
    if (!best || score > best.score) best = { ...g, score, boxed };
    if (best.placed.length === words.length && best.boxed) break;
  }
  return best;
}

// The answer blanked out of its own example sentence. Spoken as "blank" and
// shown as a rule, so a child can hear the word used without being told how it
// is spelled — the sentence is a clue here, not the reading aid it is in
// Practice, where the word is already on screen.
function cwSentenceClue(sentence, word) {
  if (!sentence || !word) return null;
  const re = new RegExp("\\b" + word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
  if (!re.test(sentence)) return null;
  return { shown: sentence.replace(re, "_____"), spoken: sentence.replace(re, "blank") };
}

// ---------- Building one puzzle ----------
function cwBuild(picked) {
  const layout = cwLayout(picked.map(w => w.plain));
  const meta = new Map(picked.map(w => [w.plain, w]));
  const { rows, cols, minR, minC } = layout;
  const cells = new Array(rows * cols).fill(null);
  layout.placed.forEach(p => {
    for (let i = 0; i < p.word.length; i++) {
      const idx = (p.r - minR + p.dr * i) * cols + (p.c - minC + p.dc * i);
      if (!cells[idx]) cells[idx] = { answer: p.word[i], ch: "", num: 0, across: -1, down: -1 };
    }
  });
  // Crossword numbering: scan in reading order and number every square that
  // begins a run. Because cwFits() forbids run-ons, the runs are exactly the
  // words that were placed, so the numbers and the clue list cannot disagree.
  let num = 0;
  const numAt = new Map();
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      if (!cells[idx]) continue;
      const startsAcross = (c === 0 || !cells[idx - 1]) && c + 1 < cols && cells[idx + 1];
      const startsDown = (r === 0 || !cells[idx - cols]) && r + 1 < rows && cells[idx + cols];
      if (startsAcross || startsDown) { num++; cells[idx].num = num; numAt.set(r + "," + c, num); }
    }
  }
  const entries = layout.placed.map(p => {
    const r = p.r - minR, c = p.c - minC;
    const m = meta.get(p.word) || {};
    const cellIdx = [];
    for (let k = 0; k < p.word.length; k++) cellIdx.push((r + p.dr * k) * cols + (c + p.dc * k));
    return {
      word: p.word, num: numAt.get(r + "," + c) || 0, dir: p.dc ? "across" : "down",
      clue: m.hint || "", sentence: cwSentenceClue(m.sentence, p.word),
      cells: cellIdx, solved: false, revealed: false, attempts: 0, checked: null,
    };
  }).sort((a, b) => a.num - b.num || (a.dir === "across" ? -1 : 1));
  // Back-references last, because sorting above moved every index.
  entries.forEach((e, i) => e.cells.forEach(ci => { cells[ci][e.dir] = i; }));
  return { rows, cols, cells, entries };
}

function startCrossword() {
  const lists = practiceLists();
  const list = lists[0];
  const seen = new Set();
  const candidates = [];
  const add = w => {
    if (!w || !w.word) return;
    const plain = foldApos(w.word).toLowerCase();
    // A square holds one letter and nothing else. A contraction, a hyphenated
    // word or a two-word entry has nowhere to put its apostrophe, hyphen or
    // space, and stripping it would print DONT and ALLRIGHT into the grid —
    // teaching the child exactly the misspelling those lists exist to prevent.
    // Three letters is the floor: a two-letter entry is fixed by its crossings
    // before the child has read the clue.
    if (!/^[a-z]{3,}$/.test(plain) || seen.has(plain)) return;
    seen.add(plain);
    candidates.push({ plain, hint: w.hint || "", sentence: w.sentence || "" });
  };
  lists.forEach(l => l.words.forEach(add));
  data.reviewWords.forEach(add);

  const picked = [];
  let letters = 0;
  for (const w of shuffle(candidates)) {
    if (picked.length >= CW_MAX_WORDS) break;
    if (picked.length >= CW_MIN_WORDS && letters + w.plain.length > CW_LETTER_BUDGET) continue;
    picked.push(w); letters += w.plain.length;
  }
  // Four words is the floor for something that reads as a crossword rather
  // than a list. A list of contractions produces one usable word, so this is a
  // real screen a child can reach, not a defensive branch.
  if (picked.length < 4) {
    CW = null;
    app.innerHTML = `<div class="card">A crossword needs a few more words that fit in a grid &mdash; ones with no apostrophes or spaces. Ask a parent to add some in the parent dashboard!</div>
      <div class="center" style="margin-top:6px"><button class="big outline" onclick="go('games')">Back</button></div>`;
    return;
  }
  const puzzle = cwBuild(picked);
  CW = {
    ...puzzle, sel: 0, pos: 0, done: false, fb: null,
    ...listStamp(list), coverIds: lists.map(l => l.id),
  };
  app.innerHTML = `
    <div class="card center" style="padding:40px">
      <div style="font-size:14px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:8px">&#129535; Crossword</div>
      <h2 style="margin:0 0 6px;font-weight:800;font-size:26px">${lists.length > 1 ? lists.map(l => esc(l.name)).join(" + ") : esc(CW.listName)}</h2>
      <div class="muted" style="margin-bottom:20px">${CW.entries.length} words &mdash; read the clue, spell it in the squares!</div>
      <div style="background:var(--soft);border-radius:14px;padding:16px 20px;font-size:19px;font-weight:600;margin-bottom:26px">Every word you get right helps with the ones crossing it.</div>
      <button class="big green" onclick="renderCrossword()">Let's play! &rarr;</button>
    </div>`;
}

// ---------- Playing ----------
const cwEntry = () => (CW && CW.entries[CW.sel]) || null;
// A square is locked once any word through it is solved: that letter has been
// proven right, so it is no longer the child's to change.
function cwLocked(idx) {
  const cell = CW.cells[idx];
  return (cell.across >= 0 && CW.entries[cell.across].solved) || (cell.down >= 0 && CW.entries[cell.down].solved);
}

function cwSelect(entryIdx, cellIdx) {
  CW.sel = entryIdx;
  const e = CW.entries[entryIdx];
  const at = cellIdx === undefined ? -1 : e.cells.indexOf(cellIdx);
  // Land on the first square still to be filled, so a child returning to a
  // half-typed word carries on rather than overwriting its first letter.
  CW.pos = at >= 0 ? at : Math.max(0, e.cells.findIndex(ci => !CW.cells[ci].ch));
}

function cwTapCell(idx) {
  if (!CW || CW.done) return;
  const cell = CW.cells[idx];
  if (!cell) return;
  const cur = cwEntry();
  const inCur = cur && cur.cells.includes(idx);
  const other = cur && cur.dir === "across" ? cell.down : cell.across;
  // Tapping the square you are already on flips to the word crossing it. That
  // is the only across/down control there is, and it is where a child's finger
  // already is.
  if (inCur && cur.cells[CW.pos] === idx && other >= 0 && !CW.entries[other].solved) cwSelect(other, idx);
  else if (inCur) cwSelect(CW.sel, idx);
  else {
    const through = [cell.across, cell.down].filter(i => i >= 0);
    const open = through.filter(i => !CW.entries[i].solved);
    cwSelect((open.length ? open : through)[0], idx);
  }
  CW.fb = null;
  renderCrossword();
}

function cwTapClue(i) {
  if (!CW || CW.done) return;
  cwSelect(i);
  CW.fb = null;
  renderCrossword();
}

function cwType(ch) {
  if (!CW || CW.done) return;
  const e = cwEntry();
  if (!e || e.solved) return;
  const idx = e.cells[CW.pos];
  if (!cwLocked(idx)) CW.cells[idx].ch = ch;
  // Step past anything already proven, so typing straight through a word that
  // crosses a solved one does the obvious thing.
  let p = CW.pos + 1;
  while (p < e.cells.length && cwLocked(e.cells[p])) p++;
  CW.pos = Math.min(p, e.cells.length - 1);
  cwSettle();
}

function cwErase() {
  if (!CW || CW.done) return;
  const e = cwEntry();
  if (!e || e.solved) return;
  const here = e.cells[CW.pos];
  if (!cwLocked(here) && CW.cells[here].ch) CW.cells[here].ch = "";
  else {
    for (let k = CW.pos - 1; k >= 0; k--) {
      const ci = e.cells[k];
      if (cwLocked(ci)) continue;
      CW.pos = k;
      CW.cells[ci].ch = "";
      break;
    }
  }
  cwSettle();
}

// Everything that happens after a square changes. Called on every keystroke
// because one letter can complete the word it was typed into AND the word
// crossing it at the same time.
function cwSettle() {
  let fb = null;
  CW.entries.forEach((e, i) => {
    if (e.solved) return;
    if (!e.cells.every(ci => CW.cells[ci].ch)) { e.checked = null; return; }
    const got = e.cells.map(ci => CW.cells[ci].ch).join("");
    // `checked` is the last filling that was looked at, not a "has been looked
    // at" flag. A child who fills a word wrong and then types over one letter
    // never empties the word, so a boolean latch would leave the entry full,
    // corrected, and never checked again — they would have to erase a square
    // to get the puzzle to notice.
    if (got === e.checked) return;
    const wasFull = e.checked !== null;
    e.checked = got;
    // An attempt is a filling, not a keystroke. Typing over a word that is
    // already full walks it through every intermediate string on the way, and
    // counting those would charge a child six tries for one correction — so a
    // wrong word that is still wrong is the same attempt, re-checked.
    if (got === e.word) { e.solved = true; e.attempts++; fb = { kind: "solved", i }; }
    else {
      if (!wasFull) e.attempts++;
      if (!fb) fb = { kind: "wrong", i };
    }
  });
  CW.fb = fb;
  // Solving a word can lock squares under the cursor; move off them so the
  // next letter typed does not silently go nowhere.
  const e = cwEntry();
  if (e && !e.solved) {
    let p = CW.pos;
    while (p < e.cells.length && cwLocked(e.cells[p])) p++;
    if (p < e.cells.length) CW.pos = p;
  }
  // Solved the word they were in: move on to one they have not finished, the
  // way a child would after filling the last square.
  if (e && e.solved) {
    const next = CW.entries.findIndex(x => !x.solved);
    if (next >= 0) cwSelect(next);
  }
  if (CW.entries.every(x => x.solved)) {
    CW.done = true;
    renderCrossword();
    setTimeout(finishCrossword, 1500);
    return;
  }
  renderCrossword();
}

// One help, gated like Missing Letters' "Show me the word": the child must have
// filled THIS entry in and be looking at something that is not working — two
// goes at it, or one that is still sitting there wrong. Either way the help
// costs as much typing as the answer would, so it cannot be used to skip the
// puzzle, and a child who is genuinely stuck is never left there.
function cwHelpReady(e) {
  return !!e && !e.solved && (e.attempts >= 2 || (e.checked !== null && e.checked !== e.word));
}
function cwReveal() {
  if (!CW || CW.done) return;
  const e = cwEntry();
  if (!cwHelpReady(e)) return;
  e.cells.forEach((ci, k) => { CW.cells[ci].ch = e.word[k]; });
  e.solved = true; e.revealed = true; e.checked = e.word;
  cwSettle();
}

function cwCellHtml(idx) {
  const cell = CW.cells[idx];
  if (!cell) return `<div class="cw-blank"></div>`;
  const e = cwEntry();
  const cls = ["cw-cell"];
  const owner = cell.across >= 0 && CW.entries[cell.across].solved ? CW.entries[cell.across]
    : cell.down >= 0 && CW.entries[cell.down].solved ? CW.entries[cell.down] : null;
  if (owner) { cls.push("solved"); if (owner.revealed) cls.push("shown"); }
  else if (e && e.cells.includes(idx)) cls.push(e.cells[CW.pos] === idx ? "sel" : "in-entry");
  return `<button class="${cls.join(" ")}" onclick="cwTapCell(${idx})">${cell.num ? `<span class="cw-num">${cell.num}</span>` : ""}${cell.ch ? esc(cell.ch) : ""}</button>`;
}

function cwClueList(dir, label) {
  const rows = CW.entries.map((e, i) => ({ e, i })).filter(x => x.e.dir === dir);
  if (!rows.length) return "";
  return `<div>
    <div style="font-weight:700;margin-bottom:6px">${label}</div>
    ${rows.map(({ e, i }) => `<button class="cw-clue ${i === CW.sel ? "sel" : ""} ${e.solved ? "solved" : ""} ${e.revealed ? "shown" : ""}" onclick="cwTapClue(${i})"><b>${e.num}.</b> ${esc(e.clue || "Spell this word")}${e.solved ? ` &middot; <b>${esc(e.word.toUpperCase())}</b>` : ""}</button>`).join("")}
  </div>`;
}

function renderCrossword() {
  if (!CW) return;
  const e = cwEntry();
  const solved = CW.entries.filter(x => x.solved).length;
  const fb = CW.fb;
  app.innerHTML = `
    <div class="card" style="padding:24px 20px">
      <div style="font-size:14px;color:var(--muted);margin-bottom:14px">&#129535; Crossword &middot; ${solved} of ${CW.entries.length} filled in</div>
      <div class="cw-scroll">
        <div class="cw-grid" style="--cw-cols:${CW.cols};grid-template-columns:repeat(${CW.cols},1fr)">
          ${CW.cells.map((_, i) => cwCellHtml(i)).join("")}
        </div>
      </div>
      ${CW.done ? "" : `
      <div style="background:var(--soft);border-radius:14px;padding:14px 16px;margin-bottom:14px">
        <div style="font-weight:800;margin-bottom:4px">${e.num} ${e.dir === "across" ? "Across" : "Down"} &middot; <span class="muted" style="font-weight:600">${e.word.length} letters</span></div>
        <div style="font-size:17px;margin-bottom:${e.sentence ? "6px" : "10px"}">${esc(e.clue || "Spell this word")}</div>
        ${e.sentence ? `<div class="muted" style="font-size:15px;font-style:italic;margin-bottom:10px">${esc(e.sentence.shown)}</div>` : ""}
        <div class="row">
          <button onclick="speak(cwEntry().word)">&#128266; Hear this word</button>
          ${e.sentence ? `<button class="outline" onclick="speak(cwEntry().sentence.spoken)">&#128214; Hear the sentence</button>` : ""}
          ${cwHelpReady(e) ? `<button class="outline" onclick="cwReveal()">Show me this word</button>` : ""}
        </div>
      </div>
      <div class="kb" id="kb">
        ${kbRows().map((row, ri) => `<div class="kb-row">
          ${row.replace("'", "").split("").map(ch => `<button onclick="cwType(&quot;${ch.toLowerCase()}&quot;)">${ch}</button>`).join("")}
          ${ri === 2 ? `<button class="kb-back" onclick="cwErase()">&#9003; erase</button>` : ""}
        </div>`).join("")}
      </div>`}
      <div class="feedback center" id="fb">${
        CW.done ? `<span style="color:var(--green)">&#127881; Every square filled in!</span>` :
        fb && fb.kind === "solved" ? `<span style="color:var(--green)">&#9989; Yes! <strong>${esc(CW.entries[fb.i].word)}</strong></span>` :
        fb && fb.kind === "wrong" ? `<span style="color:var(--accent)">Not quite for ${CW.entries[fb.i].num} ${CW.entries[fb.i].dir === "across" ? "Across" : "Down"} &mdash; have another look.</span>` : ""
      }</div>
      <div class="cw-clues" style="margin-top:16px">
        ${cwClueList("across", "Across")}
        ${cwClueList("down", "Down")}
      </div>
    </div>
    ${CW.done ? "" : `<div class="center"><button class="big outline" onclick="finishCrossword()">I'm finished</button></div>`}`;
}

function finishCrossword() {
  if (!CW) return;
  const results = CW.entries.map(e => ({
    word: e.word,
    // `correct` is "solved it themselves" — a revealed word and an abandoned
    // one are both not that, and the two are told apart by `revealed`.
    correct: e.solved && !e.revealed,
    attempts: e.attempts,
    ...(e.revealed ? { revealed: true } : {}),
    ...(!e.solved ? { unfinished: true } : {}),
  }));
  const session = {
    id: Date.now(), date: new Date().toISOString(), mode: "crossword", ...carryListStamp(CW), ...coverStamp(CW),
    results, score: 0, total: 0,
  };
  data.sessions.push(session);
  const saved = persist();
  syncPush();
  const got = results.filter(r => r.correct).length;
  const total = results.length;
  // Same discipline as go()'s null-out: the auto-finish timer may still be in
  // flight, and a second pass through here would write the session twice.
  CW = null;
  app.innerHTML = `
    ${saved ? "" : saveFailedBannerHtml("history-only")}
    <div class="card center" style="padding:40px">
      <div style="font-size:46px;margin-bottom:8px">&#129535;</div>
      <h2 style="margin:0 0 8px;font-weight:800">${got === total ? `You finished the whole grid, ${esc(data.childName)}!` : got ? `Nice work, ${esc(data.childName)}!` : `Good try, ${esc(data.childName)}!`}</h2>
      <div class="muted">${got
        ? `${got} of ${total} word${total === 1 ? "" : "s"} worked out from the clues. Spelling a word with nothing to copy from is the hard kind &mdash; and you did it!`
        : `A crossword gives you the meaning and nothing else, which is the hard kind of spelling. Come back and have another go whenever you like!`}</div>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="big outline" onclick="go('games')">Play again</button>
        <button class="big" onclick="go('home')">Done</button>
      </div>
    </div>`;
}

let selectedListId = null;
let selectedResultsList = null;

function resultGroups() {
  // Group sessions by list — by id where there is one, so the same list name
  // reused in a later grade gets its own group (§16). Order by most recent
  // session desc. `grade` comes off the sessions rather than the live list, so
  // a group keeps the grade it was worked under even if the list is relabelled.
  const groups = {};
  data.sessions.forEach(s => {
    const key = sessionListKey(s);
    if (!groups[key]) groups[key] = { key, name: s.listName || "Untitled list", grade: s.listGrade, sessions: [] };
    groups[key].sessions.push(s);
  });
  return Object.values(groups)
    .map(g => ({ ...g, latest: Math.max(...g.sessions.map(x => x.id)) }))
    .sort((a, b) => b.latest - a.latest);
}

function parseCSVLine(line) {
  const out = []; let cur = ""; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ",") { out.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function importCSV() {
  const sel = data.lists.find(l => l.id === selectedListId);
  const fileInput = document.getElementById("csvFile");
  const msg = document.getElementById("csvMsg");
  if (!sel || !fileInput.files.length) { msg.textContent = "Choose a CSV file first."; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split(/\r?\n/).filter(l => l.trim());
    let added = 0, skipped = 0;
    lines.forEach((line, i) => {
      const [word, hint, sentence, bonus, misspellings] = parseCSVLine(line);
      if (!word) return;
      const w = foldApos(word).toLowerCase();   // a spreadsheet curls them too
      if (i === 0 && w === "word") return; // header row
      if ([...sel.words, ...sel.bonus].some(x => x.word === w)) { skipped++; return; }
      const entry = { word: w, hint: (hint || "A word you're learning."), sentence: (sentence || w) };
      const alts = parseMisspellings(misspellings);
      if (alts.length) entry.misspellings = alts;
      if ((bonus || "").toLowerCase().startsWith("y") || (bonus || "").toLowerCase() === "true") sel.bonus.push(entry);
      else sel.words.push(entry);
      added++;
    });
    persist();
    msg.textContent = `Imported ${added} word${added===1?"":"s"}${skipped?`, skipped ${skipped} duplicate${skipped===1?"":"s"}`:""}.`;
    setTimeout(() => renderParent("words"), 1200);
  };
  reader.readAsText(fileInput.files[0]);
}
