// ---------- Sync (docs/parent-sync-spec.md §7, §8) ----------
// Identical in both app files (§3 rule 5) — same function/field names,
// differing only in SYNC_APP. Fire-and-forget: nothing here ever blocks a
// session or a render, and a sync failure is never visible to the child (§3).
const SYNC_APP = "spelling"; // "math" in Math Star

function syncReady() { return !!(data.sync && data.sync.enabled && data.sync.deviceToken); }
function syncEndpoint() { return (data.sync && data.sync.endpoint) || "/api"; }

async function syncApi(path, body) {
  const res = await fetch(syncEndpoint() + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + data.sync.deviceToken },
    cache: "no-store",
    body: JSON.stringify(body),
  });
  let json = null;
  try { json = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((json && json.error) || ("sync failed (" + res.status + ")"));
  return json;
}

// Any session not yet acked gets pushed. The server's upsert is idempotent
// (§6.4), so re-sending an already-accepted session is harmless — that's
// what lets the client be careless about retries (§8).
// One child, one childId — across both apps (§6.2). Spelling Star and Math Star
// keep separate profile blobs, so each was minting its own crypto.randomUUID()
// the first time sync was turned on and the same child arrived in the cloud as
// two `children` rows, one per app, showing up as two rows in the parent grid.
// The apps share an origin, so the id lives in its own localStorage entry keyed
// by the profile slug and whichever app pairs first mints it for both.
function sharedChildIdKey() { return "starhomeschool-childid-" + childSlug(data.childName); }
function sharedChildId() {
  let id = null;
  try { id = localStorage.getItem(sharedChildIdKey()); } catch(e) {}
  if (id) return id;
  id = (data.sync && data.sync.childId) || crypto.randomUUID();
  try { localStorage.setItem(sharedChildIdKey(), id); } catch(e) {}
  return id;
}

// Reconciles this profile's childId with the shared one on the way to every
// push, so a profile that already paired under its own id moves over. Adopting
// means re-pushing local history under the new id: /api/sync is an idempotent
// upsert (§6.4), so clearing ackedIds is safe, and it is what actually merges
// this app's sessions onto the shared child.
function syncChildId() {
  if (!data.sync) return null;
  const shared = sharedChildId();
  if (data.sync.childId !== shared) {
    data.sync.childId = shared;
    data.sync.ackedIds = [];
    persist();
  }
  return data.sync.childId;
}

// Phase 3 (§15.2) made this a round-trip rather than a push: it always calls
// /api/sync now, even with nothing pending, because the response is how a
// parent's assignment reaches this device. It is still fire-and-forget in
// every direction that matters — no await in the render path, no spinner, and
// a failure still leaves the child's session untouched (§3 rule 1).
let syncLastPullAt = 0;

function syncPush() {
  if (!syncReady()) return;
  syncLastPullAt = Date.now();
  const childId = syncChildId();
  const acked = new Set(data.sync.ackedIds || []);
  const pending = data.sessions.filter(s => !acked.has(s.id));
  syncApi("/sync", {
    app: SYNC_APP, childId, childName: data.childName,
    // §9.3 — stamped on the way out, so a sitting recorded while the tablet
    // was offline and plan-less still carries the right calendar day.
    sessions: withLocalDates(pending),
    state: syncState(),
    applied: data.sync.appliedCommandIds || [],
    // Not an ack (§6.1) — just what this device is holding, so the parent's
    // Plan tab can show delivery without any bookkeeping on this side.
    planRevision: (planRead() || {}).revision,
  })
    .then(res => {
      if (!res) return;
      if (Array.isArray(res.accepted) && res.accepted.length) {
        const merged = new Set([...(data.sync.ackedIds || []), ...res.accepted]);
        // Pruned alongside the 300-session cap (§8) so this can't grow unbounded.
        data.sync.ackedIds = [...merged].slice(-300);
      }
      data.sync.lastPushAt = Date.now();
      persist();
      if (Array.isArray(res.commands) && res.commands.length) syncQueueCommands(res.commands);
      // Stored before anything reads it, and stored whole (§7.1). Nothing in
      // this app renders another app's items — filtering is a read-time
      // concern — so a plan naming apps this one has never heard of is
      // written through untouched.
      //
      // A plan that arrives while the child is sitting on the home screen
      // shows up there without a reload, the same way an assigned list
      // already does — and nowhere else: no other screen is worth yanking
      // out from under them mid-sitting.
      if (res.plan && planStore(res.plan) && !parentUnlocked && currentView === "home") renderHome();
    })
    .catch(() => { /* best-effort — the next session or boot retries (§8) */ });
}

// A parent's assignment should land while the tablet is in their hands, not
// only at the next cold boot, so coming back to the tab counts as a poll.
// Throttled, because a child flipping between apps must not spend the §6.6
// rate-limit budget.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (Date.now() - syncLastPullAt < 60000) return;
  syncPush();
});

// Best-effort (§8): if this fails, the session just reappears in the parent
// dashboard; "Resync now" in Settings is the manual recovery.
function syncDelete(ids) {
  if (!syncReady() || !ids.length) return;
  syncApi("/delete", { app: SYNC_APP, childId: syncChildId(), sessionIds: ids }).catch(() => {});
}

// ---------- The plan document (docs/assignment-spec.md §7, §9) ----------
// Byte-identical in all three synced apps (§3 rule 5), like the transport
// above it. The drift test in tests/ compares these three copies.
//
// The document is delivered inside /api/sync's response, beside commands[],
// and is written here to ONE key shared by all five apps. Not this app's own
// slice of it — the whole thing, verbatim. That is what lets a plan reach an
// app that is not itself synced: Reading Star's items land on the device
// because Spelling Star wrote them, even with Reading Star's sync switched
// off. The synced apps are the delivery mechanism for a plan they do not own.
function planKey() { return "starplan-" + childSlug(data.childName); }

function planRead() {
  try { return JSON.parse(localStorage.getItem(planKey())); } catch(e) { return null; }
}

// §7.1's writer protocol, in full, because one shared key across five apps
// breaks the "each app owns its own keys" convention:
//   1. Highest revision wins — two apps receiving the same plan write once
//      between them, and two tablets racing is harmless.
//   2. Stored verbatim — an app that rewrote the document to hold only its own
//      items would destroy the others' the moment it synced first.
//   3. A malformed value is overwritten, not repaired — the server is the
//      authority and this key is a cache.
// Filtering to this app's own items happens at read time, never here.
//
// Returns whether the stored document actually changed, so a caller can
// repaint a screen that is showing it without repainting on every sync that
// re-delivers the revision this device already holds — which is most of them.
function planStore(plan) {
  if (!plan || typeof plan !== "object" || typeof plan.revision !== "number") return false;
  const held = planRead();
  if (held && typeof held.revision === "number" && held.revision >= plan.revision) return false;
  try { localStorage.setItem(planKey(), JSON.stringify(plan)); } catch(e) { return false; }
  return true;
}

// The family timezone (§9.3), or null when no plan has ever arrived. Null is a
// supported state and not a failure: a tablet with no plan has no target to
// bucket, so it stamps nothing and the phone backfills what it displays (§9.6).
function planTimezone() {
  const plan = planRead();
  return (plan && typeof plan.timezone === "string" && plan.timezone) || null;
}

// §9.3. 'en-CA' formats as YYYY-MM-DD. This runs on the client for one reason:
// the conversion needs the full IANA timezone database, which a browser has
// and D1 does not (§9.2) — so a local calendar day cannot be derived at query
// time, and has to be stamped at write time instead. Doing it here also gets
// DST right by construction, including the 23- and 25-hour days.
function localDate(instant, tz) {
  try { return new Intl.DateTimeFormat("en-CA", { timeZone: tz }).format(instant); }
  catch(e) { return null; }
}

// Attaches localDate to each session on its way up, rather than freezing it
// into the stored session record. localDate() is a pure function of the
// instant and the zone, so the answer is the same whenever it is computed —
// which means a sitting recorded before the family timezone ever arrived is
// still stamped correctly the first time it is actually pushed.
function withLocalDates(sessions) {
  const tz = planTimezone();
  if (!tz) return sessions;
  return sessions.map(s => {
    const at = Date.parse(s.date);
    if (!Number.isFinite(at)) return s;
    const stamp = localDate(new Date(at), tz);
    return stamp ? Object.assign({}, s, { localDate: stamp }) : s;
  });
}

// ---------- The mode registry and evaluator (docs/assignment-spec.md §5, §10) ----------
// Everything from here to the end of evaluateItem() is shared source, copied
// byte-for-byte into today.html and into the three synced apps, which is what
// §17 step 4 asked for. tests/shared-code.test.mjs compares all five copies,
// the way it already compares the plan document block.
//
// Drift here is the silent-wrongness the suites exist to catch: nothing throws
// and no screen breaks, the phone and the tablet simply start counting the
// same week differently and neither can be shown to be the wrong one.
//
// It depends on exactly one thing outside itself — localDate(instant, tz),
// which is already hand-duplicated across parent.html and the three apps under
// the same rule. Nothing else from any host file may be referenced here, or the
// block stops being copyable, which is the only property that makes it safe.
//
// What kind of sitting a session was. A pretest, a test and a practice all
// arrive as a row with a score, and "2 sessions, averaging 100%" flattened
// them into something a parent can't read: the diagnostic before the list and
// the test after it look identical to two practice runs. Labels and ordering
// follow the child apps' own screens (Spelling Star's Pretest / Test /
// Practice, Math Star's Drill / Practice) so the dashboard names a session the
// same way the child saw it.
//
// §5 promotes this from a badge-labelling table to the registry both sides
// evaluate against, which is why `tone` now decides what counts as work and
// not just what colour a badge is.
const MODES = {
  spelling: {
    pretest:  { label: 'Pretest',  tone: 'diagnostic' },
    test:     { label: 'Test',     tone: 'graded' },
    practice: { label: 'Practice', tone: 'practice' },
    repeat:   { label: 'Repeat',   tone: 'practice' },
    spotit:   { label: 'Spot it',  tone: 'play' },
    missing:  { label: 'Missing Letters', tone: 'play' },
    crossword:{ label: 'Crossword', tone: 'play' },
  },
  math: {
    drill:    { label: 'Drill',    tone: 'graded' },
    practice: { label: 'Practice', tone: 'practice' },
  },
  // reading-star-spec.md §6: quiz is the graded sitting, the same way Test is
  // for Spelling and Drill is for Math. `log-session` is the sitting that
  // actually is reading, so it reads as practice.
  //
  // The other three are `lifecycle` (assignment-spec.md §5): Reading Star
  // writes a session row when a book is *started*, and again when it is
  // finished or abandoned. Those are transitions of a book, not sittings at
  // one — counting them would make "5 reading sessions a week" satisfiable by
  // opening five books and reading none of them.
  reading: {
    start:        { label: 'Started',        tone: 'lifecycle' },
    'log-session':{ label: 'Reading session', tone: 'practice' },
    finish:       { label: 'Finished',       tone: 'lifecycle' },
    abandon:      { label: 'Quit',           tone: 'lifecycle' },
    quiz:         { label: 'Quiz',           tone: 'graded' },
  },
  // §5, §14. Neither app syncs yet, so nothing here is reachable from the
  // dashboard or the Plan tab's editor — the phone cannot verify a session it
  // never receives, which is why §11 keeps them out of the editor. They are
  // written down now so that the model that ships is already the model those
  // apps slot into, rather than one that has to be reshaped to admit them:
  // when §14 lands, an app id becomes selectable and nothing else moves.
  //
  // Nine Geography modes and four Logic ones collapse to one countable unit
  // each. A round is a round; whether it was capitals or rivers is a question
  // the dashboard answers, not one a target should have to.
  geography: {
    round:  { label: 'Round',  tone: 'practice' },
  },
  logic: {
    puzzle: { label: 'Puzzle', tone: 'practice' },
  },
};

// Unknown modes still render — a future app screen shows its raw mode rather
// than vanishing from the dashboard.
function modeInfo(appId, mode) {
  return (MODES[appId] || {})[mode] || { label: mode || 'Session', tone: 'play' };
}

// assignment-spec.md §5. Two rules rather than an enumeration, because an
// enumeration goes stale: Spelling Star shipped `spotit`, then `missing`, and
// docs/spelling-star-games.md is a backlog of more. Each arrives as a mode with
// tone 'play' and should land in the plan already knowing it is not homework,
// without anyone remembering to come back here.
//
// A parent who wants to encourage games can still target one by naming its
// mode explicitly — this governs only what a broad match sweeps up.
const UNCOUNTED_TONES = ['play', 'lifecycle'];

// An unrecognized mode falls to modeInfo's 'play' default and therefore does
// not count, which is the direction worth failing in: a target that undercounts
// shows "2 of 3" for a child who did three, and a parent goes and looks. One
// that overcounts shows "3 of 3" for a child who did two, and nobody does.
function countsAsWork(appId, mode) {
  return !UNCOUNTED_TONES.includes(modeInfo(appId, mode).tone);
}

// Date arithmetic on a YYYY-MM-DD string, with no timezone involved anywhere.
// That is the whole payoff of §9.3 stamping local_date at write time: once a
// session carries the calendar day it belongs to, every bucket downstream is
// string comparison and day counting, and the IANA database is needed exactly
// once — to ask what today is.
//
// The arithmetic goes through UTC deliberately. A local Date would put these
// on a clock that has 23- and 25-hour days, and "seven days after" would
// occasionally land on the wrong one.
function shiftDate(date, days) {
  const at = Date.parse(date + 'T00:00:00Z');
  if (!Number.isFinite(at)) return date;
  return new Date(at + days * 86400000).toISOString().slice(0, 10);
}
function daysBetween(from, to) {
  const a = Date.parse(from + 'T00:00:00Z');
  const b = Date.parse(to + 'T00:00:00Z');
  if (!Number.isFinite(a) || !Number.isFinite(b)) return 0;
  return Math.round((b - a) / 86400000);
}

// §9.4: the most recent weekStart weekday on or before this date. 0 = Sunday,
// matching data.schedule's existing indexing, so a family that has set its week
// to start on Monday gets the same answer from both.
function weekBucketStart(date, weekStart) {
  const at = Date.parse(date + 'T00:00:00Z');
  if (!Number.isFinite(at)) return date;
  const shift = (new Date(at).getUTCDay() - (weekStart === 1 ? 1 : 0) + 7) % 7;
  return shiftDate(date, -shift);
}

// The local-date window an item is being counted over right now, plus whether
// that window has closed. §4.3's three period kinds, and nothing else: there is
// deliberately no Mon–Fri "schoolweek", because whether a week includes
// Saturday is a question about the family's week and weekStart answers it.
//
// `closed` can only ever be true for a dated period. A day or a week bucket is
// derived from today and therefore always contains it — which is what §10.4
// needs: mid-period neither surface renders a judgment, so a target that has
// not closed has no verdict to show, only a count and the days left.
function periodWindow(item, { timezone, weekStart, now }) {
  const today = localDate(new Date(now), timezone);
  if (!today) return null;

  const period = item && item.period;
  if (period === 'day') return { from: today, to: today, closed: false };
  if (period === 'week') {
    const from = weekBucketStart(today, weekStart);
    return { from, to: shiftDate(from, 6), closed: false };
  }
  if (period && typeof period === 'object' && period.from && period.to) {
    return { from: period.from, to: period.to, closed: today > period.to };
  }
  return null;
}

// §10.2. One pure function, evaluated identically on the phone, on the hub and
// in the apps, so no client ever has to report "I have done 2 of 3" — both
// sides count the same sessions with the same rules and arrive at the same
// number on their own. There is no progress field to get out of sync.
//
// `sessions` are normalized to { at, localDate, app, mode, scopeId, deviceId,
// id }. `now` is a parameter rather than Date.now() so a past period is
// answerable retroactively (§10.1) — which is the point of plan revisions
// carrying an effective date.
function evaluateItem(item, sessions, { timezone, weekStart, now }) {
  const window = periodWindow(item, { timezone, weekStart, now });
  const count = (item && item.count) || 0;
  if (!window) return { done: 0, count, met: false, from: null, to: null, closed: false, daysLeft: 0 };

  const match = (item && item.match) || {};

  // Deduplicated on (deviceId, sessionId) before counting, which is not
  // optional: a merged child holds the same sitting under more than one childId
  // (§6.2), and an app re-pushes its history when it adopts the shared one.
  // /api/summary carries an inner DISTINCT for exactly this reason. Without it
  // a re-push inflates every count and a child appears to have met a target
  // they did not.
  //
  // today.html has no deviceId — everything it reads is by definition from the
  // one device — so the key collapses to the session id there, on its own. That
  // is the same line of code doing the right thing in both places rather than a
  // branch, which is what lets this stay byte-identical.
  const seen = new Set();
  let done = 0;

  for (const s of sessions || []) {
    // A session with no local_date cannot be placed in a calendar day at all
    // (§9.6): it was recorded before plans existed, or on a tablet that has
    // never received one. Excluded rather than guessed at — the phone
    // backfills what it can before this ever runs.
    if (!s || !s.localDate) continue;
    if (s.localDate < window.from || s.localDate > window.to) continue;

    if (match.app && s.app !== match.app) continue;
    if (match.scopeId && s.scopeId !== match.scopeId) continue;

    if (match.modes && match.modes.length) {
      // Naming a mode explicitly targets it whatever its tone, so a parent who
      // wants to encourage a game can. Only a broad match defers to §5's rule.
      if (!match.modes.includes(s.mode)) continue;
    } else if (!countsAsWork(s.app, s.mode)) {
      continue;
    }

    const key = (s.deviceId || '') + ':' + (s.id || '');
    if (seen.has(key)) continue;
    seen.add(key);
    done += 1;
  }

  const today = localDate(new Date(now), timezone);
  return {
    done,
    count,
    met: done >= count,
    from: window.from,
    to: window.to,
    closed: window.closed,
    // Inclusive of today: on the last day of a week this reads 0, which the
    // surfaces render as "last day" rather than "0 days left".
    daysLeft: today && today <= window.to ? daysBetween(today, window.to) : 0,
  };
}
// ---------- end of the shared registry and evaluator ----------

// ---------- The plan panel (docs/assignment-spec.md §8, §17 step 4) ----------
// What this child owes in THIS app, read from the plan document the last sync
// delivered (§6.2) and evaluated right here (§10.2) — no client ever reports
// "2 of 3" upward or downward. Both sides count the same sittings with the
// same rules and arrive at the same number on their own, which is the whole
// reason the evaluator above is copied rather than called.
//
// Shared source, byte-identical in all three synced apps and compared by
// tests/shared-code.test.mjs, like the plan document block. It depends on the
// evaluator above it, on planRead() / planTimezone() / localDate() from that
// block, on esc(), on SYNC_APP — the app id these sittings are already pushed
// under — and on planSessions(), the one per-app hook, defined immediately
// below it. Nothing else from any host file may be referenced here, or the
// block stops being copyable, which is the only property that makes it safe.

// §9.5: the tablet's clock for plan purposes comes from the plan document and
// nowhere else — deliberately no fallback to the device's own zone, unlike
// today.html. A tablet holding no plan has no item to place in a calendar day
// anyway, so periodWindow() returning null on a null zone is what hides this
// panel entirely (§9.6), rather than showing a bar that reads 0 of 3 forever
// with nothing visibly wrong.
function planContext(plan) {
  return { timezone: planTimezone(), weekStart: plan && plan.weekStart === 1 ? 1 : 0, now: Date.now() };
}

// §7.1: an app filters the plan to its own items at read time, and only at
// read time — the document itself is stored whole, because it is also how the
// other apps' items reach this device.
//
// A cross-app item — a match with no `app` (§4) — is deliberately NOT shown
// here. Counting one needs sittings from apps whose keys this app does not
// read, so the only number it could print is too low, and §5 is explicit about
// which direction of wrong is the bad one: a bar that undercounts sends a
// child back to work they have already done. today.html holds all five apps'
// history and is the surface that can count it, so the panel points there.
function planOwnItems(plan, ctx) {
  return ((plan && plan.items) || []).filter(item => {
    if (!item || !item.id || !item.match || item.match.app !== SYNC_APP) return false;
    // §4.3: a dated item leaves the child's view once its window has closed.
    // It stays in the parent's history, where "not done, and the window
    // closed" is the whole point — but a child does not need yesterday's
    // deadline on today's list. An item whose period this version cannot place
    // drops out the same way: there is nothing honest to show for it.
    const window = periodWindow(item, ctx);
    return !!window && !window.closed;
  });
}

// §8.2, and it is the reason this is a panel and not a gate: it displays, it
// never blocks. Every button under it stays exactly as live as it was, a child
// who wants a fourth practice is not stopped, and a child who has finished is
// not locked out. data.schedule remains the only thing that gates, because
// schedule is what is available today and the plan is what is owed this week.
function planPanelHtml() {
  const plan = planRead();
  const ctx = planContext(plan);
  const items = planOwnItems(plan, ctx);
  if (!items.length) return "";
  const sessions = planSessions(ctx.timezone);
  const met = items.every(item => evaluateItem(item, sessions, ctx).met);
  // Only ever true when the parent has targeted an app this one is not, so the
  // line is silent on a plan that is entirely this app's — which is most of
  // them.
  const elsewhere = ((plan && plan.items) || []).length > items.length;
  return `<div class="card" style="padding:20px">
    <div style="font-weight:700;font-size:18px;margin-bottom:4px">${met ? "&#11088; All done here!" : "&#128203; What I owe"}</div>
    <div class="muted" style="margin-bottom:10px">${met ? "Anything else today is because you felt like it." : "Nothing here locks anything &mdash; you can always do more."}</div>
    ${items.map(item => planRowHtml(item, sessions, ctx)).join("")}
    ${elsewhere ? `<div class="muted" style="margin-top:12px;font-size:14px">Other work is on the <a href="./today.html" style="color:var(--accent);font-weight:700;text-decoration:none">Today page &rarr;</a></div>` : ""}
  </div>`;
}

// §8.3: a count and a bar, never a percentage and never a grade — the same
// resolution math-star-spec.md §1 and reading-star-spec.md §4.2 reached
// independently. The bar's width is a percentage internally, which is fine:
// nothing reads it out.
function planRowHtml(item, sessions, ctx) {
  const r = evaluateItem(item, sessions, ctx);
  const pct = r.count ? Math.min(100, Math.round((r.done / r.count) * 100)) : 0;
  // §10.4: no judgment mid-period. Every item rendering here has an open
  // window — a closed one was filtered out — so the right-hand side is either
  // the good news or the time left, never a verdict. "Done" replaces the time
  // left rather than sitting beside it: a child who has finished does not need
  // to know how long they had.
  const right = r.met
    ? `<span style="color:var(--green-dark);font-weight:700">Done &#10003;</span>`
    : item.period === "day" ? "today"
    : r.daysLeft === 0 ? "last day"
    : r.daysLeft + (r.daysLeft === 1 ? " day left" : " days left");
  // The deadline goes in the label line rather than in the status slot on the
  // right: a dated assignment that has been finished still has a due date, and
  // a row reading only "Done" does not say which piece of work it was for.
  const when = item.period === "day" ? "every day"
    : item.period === "week" ? "this week"
    : "by " + planReadableDate(r.to);
  return `<div style="padding:10px 0;border-top:1px solid var(--line)">
    <div style="display:flex;align-items:baseline;gap:10px">
      <strong style="font-size:16px">${esc(item.label || "Work")}</strong>
      <span class="muted" style="margin-left:auto">${r.done} of ${r.count}</span>
    </div>
    <div style="height:10px;border-radius:6px;background:var(--chip);overflow:hidden;margin:8px 0 6px">
      <span style="display:block;height:100%;width:${pct}%;background:${r.met ? "var(--green)" : "var(--accent)"}"></span>
    </div>
    <div class="muted" style="display:flex;gap:10px;font-size:14px"><span>${esc(when)}</span><span style="margin-left:auto">${right}</span></div>
  </div>`;
}

// A YYYY-MM-DD local date read back as "Sep 4". Parsed as UTC on purpose: the
// string is already a calendar day, and re-reading it in the device's own zone
// is how a date becomes the day before.
function planReadableDate(date) {
  const at = Date.parse(date + "T00:00:00Z");
  if (!Number.isFinite(at)) return date;
  return new Date(at).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
}

// ---------- end of the shared plan panel ----------
// The one hook it needs, and the only part of any of this that is not shared:
// how to read this app's own history into the shape evaluateItem() expects.
// The app id it filters on is SYNC_APP, already declared above — the same
// identifier these sittings are pushed under, which is what §4.1 means by a
// match referencing envelope columns and nothing else.

// Named fields, never a spread. today.html states that rule for a stronger
// reason — the object it reads holds a PIN — but it holds here too: the shape
// the evaluator reads is a contract, and a field that leaks into it by
// accident becomes load-bearing without anyone deciding it should be.
//
// No app-id namespace on the id, unlike the hub's adapter: this list holds one
// app's sittings, so an id minted from Date.now() cannot collide with another
// app's inside it. `deviceId` is absent for the reason it is absent on the hub
// — everything here was recorded on this device.
function planSessions(tz) {
  const rows = [];
  for (const s of data.sessions || []) {
    if (!s) continue;
    const at = Date.parse(s.date);
    if (!Number.isFinite(at)) continue;
    rows.push({ id: s.id, at, localDate: localDate(new Date(at), tz), app: SYNC_APP, mode: s.mode, scopeId: s.listId || null });
  }
  return rows;
}


// ---------- Parent -> child commands (§15) ----------
// This is where the two app files stop being byte-identical. §3 rule 5 still
// holds for everything above — transport, pairing, acking, the queue — but
// syncState() and applyCommand() are necessarily about *this* app's data
// model, so they are the declared seam rather than an accidental divergence.
// Their names, shape, and return contract are the same in both files.

// What this tablet has right now, uploaded on every sync (§15.4) so the parent
// phone can offer real choices. Word counts only, not the words: the parent
// composing a list doesn't need them, and there's no reason to mirror more
// into the cloud than the feature actually uses.
function syncState() {
  return {
    lists: (data.lists || []).map(l => ({
      id: l.id, name: l.name, desc: l.desc || "", grade: l.grade || null,
      wordCount: (l.words || []).length, bonusCount: (l.bonus || []).length,
      pretest: l.pretest || "global",
    })),
    activeListId: data.activeListId,
    // So the phone can show which lists are being practiced together and offer a
    // reorder against the order the tablet actually has (§15.4).
    practiceListIds: data.practiceListIds || [],
    gradeLevel: data.gradeLevel,
    grades: GRADES,
  };
}

// Commands arrive from a network callback that can fire at any moment,
// including mid-Test. Nothing is applied until the child is somewhere it is
// safe to change the ground under them (§15.5).
let syncPendingCommands = [];
function syncSafeToApply() { return S === null && RP === null && SP === null; }

function syncQueueCommands(commands) {
  syncPendingCommands = syncPendingCommands.concat(commands);
  syncApplyPending(true);
}

function syncApplyPending(repaint) {
  if (!data || !data.sync || !syncPendingCommands.length || !syncSafeToApply()) return;
  const queue = syncPendingCommands;
  syncPendingCommands = [];
  const done = new Set(data.sync.appliedCommandIds || []);
  let changed = false;
  for (const cmd of queue) {
    if (!cmd || !cmd.id || done.has(cmd.id)) continue;
    // Marked applied even when it throws or is rejected: a command this
    // version of the app can't act on is a bad command, and re-attempting it
    // on every sync forever is worse than dropping it. The parent sees it
    // as delivered, which is true — it arrived and was considered.
    try { if (applyCommand(cmd)) changed = true; } catch (e) {}
    done.add(cmd.id);
  }
  // Acked upward on the next sync, which is what stops the server resending.
  data.sync.appliedCommandIds = [...done].slice(-200);
  persist();
  // Only the home screen is repainted, and only when the child is sitting on
  // it: a newly assigned list should show up without a reload, but no other
  // screen is worth yanking out from under them.
  if (changed && repaint && !parentUnlocked && currentView === "home") renderHome();
}

function applyCommand(cmd) {
  const p = cmd.payload || {};
  if (cmd.kind === "set-active-list") {
    const list = (data.lists || []).find(l => l.id === p.listId)
      || (data.lists || []).find(l => (l.name || "").toLowerCase() === String(p.listName || "").toLowerCase());
    if (!list || data.activeListId === list.id) return false;
    data.activeListId = list.id;
    prunePracticeSet();
    return true;
  }
  if (cmd.kind === "assign-list") {
    const incoming = p.list || {};
    const name = String(incoming.name || "").trim();
    if (!name) return false;
    const words = normalizeAssignedWords(incoming.words);
    const bonus = normalizeAssignedWords(incoming.bonus);
    if (!words.length && !bonus.length) return false;
    const grade = incoming.grade || data.gradeLevel;
    // Replace by name rather than always appending: re-sending a corrected
    // list is the common case, and it should fix the list the child already
    // has instead of leaving two with the same name.
    //
    // Matched on name *and grade* (§16). Without the grade in the match, a
    // parent assigning "Unit 1" for Grade 5 would silently overwrite the
    // Grade 3 list of the same name — replacing its words in place and
    // taking a previous year's list with it. That is data loss, not a
    // mislabel, and it is the one place the name-collision problem could
    // destroy something rather than just confuse a total.
    let list = (data.lists || []).find(l =>
      (l.name || "").toLowerCase() === name.toLowerCase() && (l.grade || null) === (grade || null));
    if (list) {
      if (incoming.desc) list.desc = String(incoming.desc);
      list.words = words;
      list.bonus = bonus;
      if (incoming.pretest) list.pretest = incoming.pretest;
    } else {
      list = {
        id: "l" + Date.now() + Math.floor(Math.random() * 1000),
        name, desc: String(incoming.desc || ""), words, bonus,
        pretest: incoming.pretest || "global",
        grade,
      };
      data.lists.push(list);
    }
    if (p.makeActive !== false) { data.activeListId = list.id; prunePracticeSet(); }
    return true;
  }
  // §15.3: the phone sends the full order it wants, not a move. It composed that
  // order from the snapshot this tablet uploaded, so anything created since —
  // a list the parent typed in on the tablet itself — is unknown to it and keeps
  // its relative position at the end rather than being dropped on the floor.
  if (cmd.kind === "reorder-lists") {
    const order = Array.isArray(p.order) ? p.order : [];
    if (!order.length) return false;
    const byId = new Map(data.lists.map(l => [l.id, l]));
    const next = [];
    const taken = new Set();
    for (const id of order) {
      const l = byId.get(id);
      if (!l || taken.has(id)) continue;
      taken.add(id);
      next.push(l);
    }
    for (const l of data.lists) if (!taken.has(l.id)) next.push(l);
    if (next.length !== data.lists.length) return false;
    if (next.every((l, i) => l.id === data.lists[i].id)) return false;
    data.lists = next;
    return true;
  }
  if (cmd.kind === "delete-session") return applyRemoteSessionDelete(p.sessionIds);
  return false;
}

// Accepts bare strings or {word, hint, sentence}, and fills the same defaults
// addWord() does, so a list assigned from a phone is indistinguishable from
// one typed in the parent area.
function normalizeAssignedWords(items) {
  const out = [];
  const seen = new Set();
  for (const item of (Array.isArray(items) ? items : [])) {
    const raw = typeof item === "string" ? { word: item } : (item || {});
    const word = foldApos(raw.word).trim().toLowerCase();
    if (!word || seen.has(word)) continue;
    seen.add(word);
    const entry = {
      word,
      hint: String(raw.hint || "").trim() || "A word you're learning.",
      sentence: String(raw.sentence || "").trim() || word,
    };
    const alts = parseMisspellings(raw.misspellings);
    if (alts.length) entry.misspellings = alts;
    out.push(entry);
  }
  return out;
}

// The parent already tombstoned these server-side, so there is nothing to push
// back — this is the local half. Same linked-pair rule as deleteSession() in
// the parent area (design v6 §2.5): a perfect pretest and its auto-promoted
// test twin are one sitting and go together.
function applyRemoteSessionDelete(ids) {
  const wanted = new Set((Array.isArray(ids) ? ids : []).map(String));
  if (!wanted.size) return false;
  for (const s of data.sessions) {
    if (!wanted.has(String(s.id))) continue;
    if (s.promotedFrom) wanted.add(String(s.promotedFrom));
    const twin = data.sessions.find(x => x.promotedFrom && String(x.promotedFrom) === String(s.id));
    if (twin) wanted.add(String(twin.id));
  }
  const before = data.sessions.length;
  data.sessions = data.sessions.filter(s => !wanted.has(String(s.id)));
  return data.sessions.length !== before;
}

// Redeems a pairing code and builds the resulting data.sync block. Shared by
// the Settings "Connect" button and the first-launch wizard (§6.2 setup-time
// pairing) so a code is only ever redeemed one way.
async function redeemPairingCode(code, endpoint, deviceId) {
  const res = await fetch(endpoint + "/pair", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    cache: "no-store",
    body: JSON.stringify({ code, deviceId, role: "child", label: data.childName + "'s device" }),
  });
  let json = null;
  try { json = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((json && json.error) || "Could not connect — check the code and try again.");
  // §6.2: a code minted from the parent side carries the child it was
  // assigned to. That's now authoritative — fall back to the local
  // name-slug guess only against an older server that never sends one.
  const childId = json.childId || sharedChildId();
  try { localStorage.setItem(sharedChildIdKey(), childId); } catch(e) {}
  return {
    enabled: true, endpoint,
    childId,
    deviceId, deviceToken: json.token, ackedIds: [], appliedCommandIds: [], lastPushAt: null,
  };
}

async function connectSync() {
  const code = document.getElementById("syncCodeIn").value.trim().toUpperCase();
  const endpointIn = document.getElementById("syncEndpointIn").value.trim();
  const msg = document.getElementById("syncMsg");
  if (!code) { msg.textContent = "Enter the code shown on your phone."; return; }
  msg.textContent = "Connecting…";
  const endpoint = endpointIn || "/api";
  const deviceId = (data.sync && data.sync.deviceId) || crypto.randomUUID();
  try {
    data.sync = await redeemPairingCode(code, endpoint, deviceId);
    persist();
    renderParent("settings");
    syncPush();
  } catch (err) {
    // §7: redeeming a pairing code is not idempotent, so a network error here
    // must be treated as "unknown, generate a new code" — never auto-retried
    // with the same single-use code.
    msg.textContent = err.message + " If it keeps failing, generate a fresh code on your phone and try again.";
  }
}
function disableSync() { if (!data.sync) return; data.sync.enabled = false; persist(); renderParent("settings"); }
function enableSync() { if (!data.sync) return; data.sync.enabled = true; persist(); renderParent("settings"); syncPush(); }
function resyncNow() {
  if (!data.sync || !data.sync.deviceToken) return;
  data.sync.ackedIds = []; // safe: /api/sync is an idempotent upsert (§6.4)
  persist();
  syncPush();
}

function syncSettingsHtml() {
  const s = data.sync;
  if (s && s.deviceToken) {
    return `
      <div class="muted">${s.enabled ? "Sending results to your phone, and picking up word lists you assign from it." : "Sync is paused on this device."}</div>
      <div class="muted" style="margin-bottom:10px">Last synced: ${s.lastPushAt ? new Date(s.lastPushAt).toLocaleString() : "not yet"}</div>
      <div class="row">
        ${s.enabled ? `<button class="outline" onclick="disableSync()">Pause sync</button>` : `<button onclick="enableSync()">Resume sync</button>`}
        <button class="outline" onclick="resyncNow()">Resync now</button>
      </div>
      <div class="muted" style="margin-top:8px">To stop this device permanently, revoke it from the parent dashboard on your phone (Devices tab).</div>`;
  }
  return `
    <p class="muted">On your phone, open the parent dashboard &rarr; Devices &rarr; "Add a device" &rarr; "Child's tablet," then type the code it shows here.</p>
    <label for="syncCodeIn">Pairing code</label>
    <input type="text" id="syncCodeIn" placeholder="6-character code" maxlength="6" style="text-transform:uppercase;text-align:center;font-size:22px;letter-spacing:.25em">
    <details style="margin:6px 0">
      <summary class="muted" style="cursor:pointer">Advanced: custom sync server</summary>
      <label for="syncEndpointIn" style="margin-top:6px">Sync server URL (leave blank for the default)</label>
      <input type="text" id="syncEndpointIn" placeholder="https://your-worker.workers.dev/api">
    </details>
    <button onclick="connectSync()">Connect</button>
    <div class="muted" id="syncMsg" style="color:var(--danger);min-height:16px"></div>`;
}

// ---------- Boot ----------
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
(function boot() {
  const profiles = listProfiles();
  if (profiles.length === 0) return renderSetup(1);
  if (profiles.length === 1) { data = load(profiles[0].key); if (data) { applyTheme(); syncPush(); return go("home"); } }
  renderPicker();
})();
</script>
</body>
</html>
