<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Star</title>
<style>
  :root {
    --bg: #FDF6EC; --text: #2A3A50; --card: #FFFFFF; --card-shadow: rgba(42,58,80,.10);
    --accent: #2A5D9F; --accent-soft: #E3EDF9; --green: #2E8B57; --green-soft: #DCEBDD; --green-dark: #2E6B45;
    --danger: #C4553B; --gold: #E8A013; --gold-soft: #FBEBC8;
    --soft: #F2EBDD; --soft-text: #8A6A3B; --chip: #EDE4D3; --muted: #6B7686; --border: #C9CDD4;
    --line: #EDE4D3; --input-bg: #FFFDF8; --eyebrow: #B0763A; --body-text: #4A5568;
  }
  body[data-theme="mint"] {
    --bg: #EDF7F4; --text: #1F3D38; --card: #FFFFFF; --card-shadow: rgba(31,61,56,.10);
    --accent: #1F7A70; --accent-soft: #D8EFEA; --green: #2E8B57; --green-soft: #DCEBDD; --green-dark: #256B45;
    --danger: #C4553B; --gold: #D99114; --gold-soft: #FBEBC8;
    --soft: #DDEFE9; --soft-text: #2F6B5E; --chip: #D8EAE4; --muted: #5C7370; --border: #B9CFC9;
    --line: #DCEAE5; --input-bg: #FBFEFD; --eyebrow: #1F7A70; --body-text: #3D5A54;
  }
  body[data-theme="lavender"] {
    --bg: #F5F1FA; --text: #372B4E; --card: #FFFFFF; --card-shadow: rgba(55,43,78,.10);
    --accent: #6A4FA3; --accent-soft: #EAE3F6; --green: #2E8B57; --green-soft: #DCEBDD; --green-dark: #2E6B45;
    --danger: #C4553B; --gold: #D99114; --gold-soft: #F9EBC9;
    --soft: #ECE5F5; --soft-text: #5D4A85; --chip: #E6DEF2; --muted: #6E6482; --border: #C8BEDB;
    --line: #E6DFF1; --input-bg: #FDFCFE; --eyebrow: #6A4FA3; --body-text: #4C4163;
  }
  /* Stable: oat and hay for the page, saddle tan for the accent, pasture green
     kept in the same slot the other themes use for "good/correct" so anything
     keyed off --green keeps meaning the same thing. */
  body[data-theme="horse"] {
    --bg: #F6EEE2; --text: #3B2A1C; --card: #FFFDF9; --card-shadow: rgba(59,42,28,.12);
    --accent: #8A5A2B; --accent-soft: #F0E2CE; --green: #5C7A45; --green-soft: #E1E9D6; --green-dark: #466034;
    --danger: #B04A32; --gold: #C98A1E; --gold-soft: #F7E6C4;
    --soft: #EFE2CF; --soft-text: #7A5326; --chip: #E9DAC3; --muted: #7C6A57; --border: #C9B394;
    --line: #E7D8C2; --input-bg: #FFFCF6; --eyebrow: #8A5A2B; --body-text: #4E3B29;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Lexend', 'Trebuchet MS', 'Comic Sans MS', sans-serif;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--eyebrow); letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; }
  .card { background: var(--card); border-radius: 20px; padding: 24px; box-shadow: 0 2px 10px var(--card-shadow); margin-bottom: 16px; }
  button { font-family: inherit; font-weight: 600; font-size: 15px; padding: 10px 18px; border-radius: 14px; border: none; background: var(--accent); color: #fff; cursor: pointer; letter-spacing: .02em; }
  button.big { font-size: 22px; padding: 16px 32px; }
  button.outline { background: transparent; border: 2.5px solid var(--accent); color: var(--accent); }
  button.green { background: var(--green); }
  button.gold { background: var(--gold); color: var(--text); }
  button.danger { background: var(--danger); }
  button.link { background: none; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px; }
  button:disabled { background: var(--border); color: #fff; cursor: default; border-color: var(--border); }
  input[type=text], input[type=password] { font-family: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border); width: 100%; margin-bottom: 8px; background: var(--input-bg); color: var(--text); }
  select { font-family: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border); background: var(--input-bg); color: var(--text); }
  #spellInput { font-size: 30px; font-weight: 600; letter-spacing: .15em; padding: 16px 18px; border-radius: 14px; border: 3px solid var(--border); }
  #spellInput.ok { border-color: var(--green); } #spellInput.bad { border-color: var(--danger); }
  .hint { background: var(--soft); border-radius: 14px; padding: 14px 18px; font-size: 17px; line-height: 1.5; margin-bottom: 24px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 14px; }
  .chip { background: var(--chip); border-radius: 10px; padding: 4px 12px; font-size: 14px; display: inline-block; margin: 3px; }
  .chip button { background: none; color: var(--muted); padding: 0 2px; font-size: 14px; }
  .chip.bonus { background: var(--gold-soft); }
  .feedback { min-height: 56px; margin-top: 14px; font-size: 19px; font-weight: 600; }
  .center { text-align: center; }
  details { padding: 8px 0; border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; font-size: 15px; }
  label { font-size: 16px; display: block; padding: 4px 0; }
  .bonus-tag { color: var(--gold); font-weight: 700; }
  .kb { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  /* Wraps because the rows no longer fit a phone. Ten keys at a tappable size
     need about 430px of card, so on anything narrower the row used to run off
     the side of the screen — already true of QWERTY's top row before the
     apostrophe key joined the bottom one. Wrapping keeps every key on screen
     and at thumb size; the keypad just gets one line taller on a small phone. */
  .kb-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .kb button { min-width: 30px; padding: 12px 0; font-size: 19px; font-weight: 800; border-radius: 10px; background: var(--card); color: var(--text); border: 2px solid var(--border); flex: 1; max-width: 48px; text-transform: uppercase; }
  .kb button:active { background: var(--accent-soft); border-color: var(--accent); }
  /* min-width is the width of the label itself, and it is what makes the wrap
     happen at the right moment: below it the erase key was squeezed until
     "erase" broke onto a second line inside the button, which is what made
     every keypad row 65px tall instead of 48. */
  .kb button.kb-back { min-width: 104px; max-width: 110px; flex: 2; font-size: 16px; background: var(--soft); }
  /* The apostrophe is the one non-letter on the keypad. Tinted like the erase
     key and printed larger, because a straight quote at letter size is a speck
     a child has to hunt for. */
  .kb button.kb-punct { background: var(--soft); font-size: 26px; line-height: 1; }
  .kb button:disabled { background: #EEE; color: #AAA; }
  /* On a phone the card's padding leaves a ten-key row nowhere to go, so the
     keypad alone reaches past it and the keys close up. That keeps every
     letter row on one line down to about 360px; what still cannot fit is the
     erase key, which drops to a line of its own — the one place the wrap is
     an improvement, since it lands as a wide bar under the letters. */
  @media (max-width: 480px) {
    .kb { margin-left: -20px; margin-right: -20px; }
    .kb-row { gap: 4px; }
    .kb button { min-width: 26px; }
  }
  .assigned-badge { background: var(--green-soft); color: var(--green-dark); border-radius: 8px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
  .swatch { width: 84px; height: 56px; border-radius: 14px; border: 3px solid var(--border); cursor: pointer; display: inline-flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-size: 12px; font-weight: 700; }
  .swatch.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  button.spot-choice { background: var(--card); color: var(--text); border: 3px solid var(--border); }
  button.spot-choice.ok { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }
  button.spot-choice.bad { border-color: var(--danger); background: #FBEAE6; color: var(--danger); }
  button.spot-choice:disabled { opacity: .85; }
  /* ---------- The slot board ----------
     One row of per-letter slots filled by tapping a source. Missing Letters is
     the first configuration (most slots given, the keypad as the source);
     Unscramble is the same board with nothing given and a consumable letter
     bank, which is why none of this knows what the source is. See
     docs/spelling-star-games.md §5.0.
     Wraps for the same reason the keypad does: the corpus runs to 14 letters
     ("administration") and a phone is 360px, so a fixed row would run off the
     side. Static layout that wraps is the whole reason tapping is cheap here —
     a drag board would have had to solve this as geometry. */
  .board { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; margin: 4px 0 20px; }
  .slot { min-width: 34px; height: 56px; border-radius: 10px; font-size: 26px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; justify-content: center; padding: 0 5px; letter-spacing: 0; }
  /* Given letters are the word showing through, not controls: no border, no
     tap target, nothing to suggest they can be changed. */
  .slot.given { background: transparent; color: var(--text); border: 3px solid transparent; }
  /* The apostrophe is always given and never blanked (see pickBlanks), and it
     sits narrow so "o'clock" reads as one word rather than eight tiles. */
  .slot.punct { min-width: 12px; padding: 0; color: var(--muted); border: 3px solid transparent; background: transparent; }
  .slot.open { background: var(--card); color: var(--accent); border: 3px dashed var(--border); cursor: pointer; }
  .slot.open.filled { border-style: solid; }
  .slot.open.sel { border-color: var(--accent); background: var(--accent-soft); border-style: solid; }
  .slot.open.ok { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); border-style: solid; }
  .slot.open:disabled { cursor: default; }
  @media (max-width: 480px) {
    .board { gap: 4px; }
    .slot { min-width: 28px; height: 48px; font-size: 22px; }
  }
  /* ---------- The crossword grid ----------
     Sized by its column count rather than by a breakpoint: a 6-word puzzle and
     a 10-word one differ by a factor of two in width, so a fixed cell size
     would either waste half the card or run off a phone. The grid asks for
     26px per column and the scroller lets it exceed the card if the layout
     came out wide, which is the one case where shrinking the cells further
     would put them below a fingertip.
     See docs/spelling-star-games.md §5.6. */
  .cw-scroll { overflow-x: auto; margin: 0 -6px 14px; padding: 0 6px 4px; }
  .cw-grid { display: grid; gap: 3px; margin: 0 auto; min-width: calc(var(--cw-cols) * 20px); max-width: min(100%, calc(var(--cw-cols) * 46px)); }
  .cw-blank { aspect-ratio: 1; }
  .cw-cell { aspect-ratio: 1; position: relative; padding: 2px 0 0; border-radius: 4px; background: var(--card); color: var(--text);
             border: 2px solid var(--border); font-size: clamp(10px, 3.2vw, 20px); font-weight: 800; text-transform: uppercase;
             display: flex; align-items: center; justify-content: center; cursor: pointer; line-height: 1; }
  /* The whole entry lights up, not just the letter under the finger: in a grid
     every cell has two possible words through it, so "which word am I typing
     into" is the one thing the child must never have to guess. */
  .cw-cell.in-entry { background: var(--accent-soft); border-color: var(--accent); }
  .cw-cell.sel { background: var(--accent); border-color: var(--accent); color: #FFF; }
  /* A solved entry's letters are proven right, so they stop being controls —
     same reasoning as .slot.given. */
  .cw-cell.solved { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); cursor: default; }
  .cw-cell.solved.shown { background: var(--soft); border-color: var(--border); color: var(--muted); }
  .cw-num { position: absolute; top: 1px; left: 2px; font-size: 8px; font-weight: 700; opacity: .75; line-height: 1; }
  .cw-cell.sel .cw-num { opacity: .9; }
  .cw-clues { display: flex; flex-wrap: wrap; gap: 18px; }
  .cw-clues > div { flex: 1; min-width: 210px; }
  .cw-clue { display: block; width: 100%; text-align: left; background: transparent; color: var(--body-text); border: 2px solid transparent;
             border-radius: 8px; padding: 7px 8px; font-size: 15px; font-weight: 500; cursor: pointer; }
  .cw-clue.sel { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
  .cw-clue.solved { color: var(--green-dark); text-decoration: line-through; text-decoration-thickness: 2px; opacity: .8; }
  .cw-clue.solved.shown { color: var(--muted); }
  .cw-clue b { font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Spelling Star</div>
      <h1 id="greeting">Welcome! &#11088;</h1>
    </div>
    <button class="outline" id="homeBtn" style="display:none" onclick="lockAndHome()">Home</button>
  </header>
  <div id="app"></div>
</div>

<script>
// ============================================================================
// Missing Letters (this pass) — a second game, and the first thing in the hub
// that asks the child to PRODUCE a spelling rather than recognise one. The
// word appears with two or three letters blanked and they fill them from the
// existing keypad. See docs/spelling-star-games.md §5.2.
//
// Two things are worth knowing about how it is built:
//
//   - The slot board is a shared primitive, not part of this game. It owns
//     slots, selection, auto-advance, lift-to-correct and assemble-and-compare,
//     and knows nothing about where the letters come from. Missing Letters is
//     the configuration where most slots are given and the keypad is the tap
//     source; Unscramble (games doc §5.0) is the same board with nothing given
//     and a consumable letter bank, and should be built as a configuration of
//     makeBoard/boardPlace/boardLift rather than a second engine. That is the
//     whole reason this game is small: the board is the medium-sized piece and
//     it is now paid for.
//
//   - The blanks are not random, which is the point of the idea. pickBlanks()
//     diffs the child's own recorded misspellings (missedAs, via
//     observedErrorsFor) against the real word and blanks exactly where they
//     went wrong — a child who has written "beleive" gets "bel__ve". Words
//     with no error history fall back to vowels and vowel teams. So the game
//     teaches the specific trap this child falls into, using data the app has
//     been recording since v6.2 and only ever used for distractors.
//
// It does NOT write missedAs back. A wrong board is a real misspelling, but
// the blanks constrain what could have been typed, so feeding it back would
// be a loop rather than evidence. Free-typed errors stay the only source.
// ============================================================================
// Apostrophes (previous pass) — the on-screen keypad was letters and erase only,
// which made a list of contractions literally unspellable: the child could
// hear "don't", know it, and have no way to type it. There is now an
// apostrophe key on the last row of both layouts (and of the Repeat keypad,
// which shares kbRows), always present so it never signals which words need
// one. Three things follow from letting a non-letter onto the keypad:
//   - the key's onclick argument is quoted with &quot; rather than ', since a
//     ' key writing onclick="kbType('|')" would end the JS string;
//   - foldApos(): a word pasted from a document carries a curly apostrophe and
//     the keypad types a straight one, so both fold to ' on entry (addWord,
//     normalizeAssignedWords, importCSV) and again when an answer is checked,
//     which also covers lists already saved with a curly one;
//   - two rank-1 RESPELLINGS for Spot the Spelling. Every other rule is
//     anchored to letters and skips contractions entirely, so "don't" used to
//     fall through to rank 6 and get shown against "don'tt". It now gets the
//     errors children actually make: "dont" and "do'nt".
// v6.4 build — "give me more words" is gone; practice sets replace it.
// The old Merge folded the next list's words into the assigned one and then
// retired the source list, which cost two things at once: a child could undo a
// week of list structure with one mis-tap on the home screen, and a merged list
// could only ever carry ONE test title, so a gradebook that tracks each list as
// its own assignment had nothing to file the swallowed list under.
// Practice sets keep the lists apart permanently:
//   - data.practiceListIds names extra lists practiced alongside the assigned
//     one. See My Words, Practice, Repeat and Spot the Spelling draw from the
//     union of the set; nothing is copied, moved, or deleted, so every tap in
//     this feature is reversible and an accidental one costs nothing.
//   - Test and Pretest are always exactly ONE list. With extras in the set the
//     child first picks the list they are testing on, and the sitting is
//     stamped with that list's own id/name/grade exactly as a single-list test
//     always was — that is what keeps one graded row per list title (§16), which
//     is the whole point of the redesign.
//   - Practice/Repeat/Spot sittings that span the set carry `coverIds` (every
//     list they drew from) and a per-result `listId`. Repeat difficulty and the
//     parent's reading of history use those through sessionCoversList();
//     sessionMatchesList() is deliberately left alone, because it decides
//     pretest gates, test-on-record and history grouping, and a shared practice
//     sitting must never satisfy those for a list it only borrowed words from.
// Also in this pass: list reordering, which never existed despite Settings
// claiming it did — parent-area up/down and a `reorder-lists` command from the
// phone dashboard — plus a gradebook CSV (one row per graded sitting) and a
// Test scores card in the parent area, both keyed on the list's own title.
// Removed: mergeEligible/startMergeIntro/confirmMergeStart/finishMergeDirect/
// startMergePretest/finishMergePretest/renderMergeDone/renderNothingToMerge and
// S.mergeContext. Lists already merged by v6.2/v6.3 are left as they are: the
// merge was applied to the data, and inventing an un-merge would be a second
// act of damage on top of the first.
// v6.3 build — reliability/parent-control backport from Math Star v6, per
// design review: corrupted-profile detection & recovery on the picker screen,
// load()'s lastLoadError (distinguishes "no profile" from "unreadable
// profile"), persist() now returns success/failure with a save-failed banner
// on all 5 session-completion paths (finishSession, finishMergeDirect,
// finishMergePretest, finishRepeat, finishSpotIt — Math Star only needed one),
// a 300-session reliability cap, and resetProfile()/deleteProfile() in
// Settings. Kept-on-reset set: childName/pin/scoring/showHistory/
// pretestGlobal/gamesEnabled/advanceEnabled/advanceThreshold/theme/keyboard/
// repeatStandard/repeatHard/lists/activeListId/schedule — wiped: sessions/
// reviewWords/graduated. Incidental fix: load() now defaults reviewWords to
// [] for pre-existing saves that predate it.
// v6.2 build — all three build-order steps now landed (design v6 §5, v6.1 §3):
// #1 primitives + deleteSession cascade fix, #2 Advance, #3 Merge (this pass),
// plus the max-date-pretest display change (v6 §2.4) and the "Allow self-pacing"
// single-permission relabel (v6.1 §2). Gating for Merge uses data.advanceEnabled,
// not a separate mergeEnabled — that field was struck before ever being built
// (v6.1 §2). Two fixes made during this pass, beyond the spec:
//   (a) mergeEligible() now also requires !pretestGateActive() — the spec as
//       written let a freshly-assigned, pretest-gated list offer "give me more
//       words" at the same time as the "take your pretest first" banner.
//   (b) go() now nulls S and RP on every navigation, same as it already did
//       for SP. The v6 Games-hub note flagged this as a latent gap in the
//       Practice/Test/Pretest/Repeat engines and said Merge would need the
//       same discipline; Merge's "nothing is half-committed if you back out"
//       guarantee actually depends on it, so it's fixed here rather than left
//       for a future pass.
// Post-ship fix (regression from a divergent copy): Test/Pretest blind-answer
// neutrality had regressed — a wrong answer left the keyboard live and a
// "Check it" button on screen while a correct answer showed a locked green
// "Next word" button, telegraphing the result through button state and
// opening a same-word double-submit window before the 1000ms auto-advance
// fired. Fixed by locking on any answered state in Test/Pretest (not just
// correct) and showing no manual button at all once answered there —
// auto-advance is the only way forward, matching the original fix pattern.
// ============================================================================

// ---------- Storage keys / profiles ----------
function listProfiles() {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith("spellingstar-")) continue;
    try {
      const d = JSON.parse(localStorage.getItem(k));
      if (d && d.childName && d.pin) { out.push({ key: k, name: d.childName, corrupted: false }); continue; }
      // Parses fine but is missing required fields — surface it as damaged
      // rather than silently dropping it (and the child's data with it).
      out.push({ key: k, name: k.replace(/^spellingstar-/, "") || "profile", corrupted: true });
    } catch(e) {
      out.push({ key: k, name: k.replace(/^spellingstar-/, "") || "profile", corrupted: true });
    }
  }
  return out.sort((a,b) => a.name.localeCompare(b.name));
}
// Shared with Math Star (§3 rule 5) so both apps land on the same slug for the
// same child — that is what lets them share one childId (see sharedChildId).
function childSlug(name) {
  const s = String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return s || "child";
}
function nameToKey(name) {
  return "spellingstar-" + childSlug(name);
}
let KEY = null;
let data = null;

// Grades a list can be labelled with. Same set as Math Star's, so one child
// reads the same way across both apps.
const GRADES = ["K","1","2","3","4","5","6","7"];

function freshData(childName, pin, scoring, gradeLevel) {
  return {
    childName, pin, scoring,           // scoring: "percent" | "points"
    // The default grade for lists created from now on — not a fact about the
    // child that anything else reads. A list's own `grade` is what history is
    // keyed on, because a list outlives the year the child was in when it was
    // made (parent-sync-spec §16).
    gradeLevel: gradeLevel || "2",
    showHistory: true,
    pretestGlobal: false,
    gamesEnabled: true,
    advanceEnabled: false,      // child-led "ready for the next list?" prompt, off by default
    advanceThreshold: 90,       // % on a Test needed to unlock that prompt
    theme: "classic",
    keyboard: "abc",                   // "abc" | "qwerty"
    repeatStandard: 5,
    repeatHard: 8,
    lists: [{ id: "starter", name: "Starter Words", desc: "", words: [], bonus: [], pretest: "global", grade: gradeLevel || "2" }],
    activeListId: "starter",
    // Extra lists practiced alongside the assigned one (v6.4). Never includes
    // activeListId — the assigned list is in the set by definition.
    practiceListIds: [],
    reviewWords: [],
    sessions: [],
    schedule: defaultSchedule(),
    graduated: [],
  };
}
function defaultDay() { return { activity: "none", studyEnabled: true, practiceEnabled: true, testEnabled: true, repeatEnabled: true, gamesEnabled: true }; }
function defaultSchedule() { return Array.from({length:7}, defaultDay); } // 0=Sunday ... 6=Saturday

// Set by load() on failure so callers can tell "no profile at this key"
// (expected, e.g. first launch) apart from "data was there but unreadable"
// (real corruption, worth telling the parent about instead of silently
// treating it as if the profile never existed).
let lastLoadError = null;
function load(key) {
  lastLoadError = null;
  const raw = localStorage.getItem(key);
  if (!raw) return null;
  let d;
  try {
    d = JSON.parse(raw);
  } catch(e) {
    lastLoadError = "corrupted";
    return null;

function activeList() { return data.lists.find(l => l.id === data.activeListId) || data.lists[0]; }

// ---------- Practice sets (v6.4, replacing Merge) ----------
// The set is derived from ids on every read and never cached: the assigned list
// is always in it and always first, extras follow in data.lists order so the
// child meets them in the order the parent arranged. Nothing here copies a word
// from one list into another — that is the property that makes an accidental
// tap free to undo, which is what the old Merge could never offer.
function practiceLists() {
  const active = activeList();
  const extras = data.lists.filter(l =>
    (!active || l.id !== active.id) && (data.practiceListIds || []).includes(l.id));

}
function practiceExtras() { return practiceLists().slice(1); }
function practiceIsMulti() { return practiceExtras().length > 0; }
// A list whose parent asked for a pretest, that has never been sat, would be

function practiceGateBlocks(list) {

}

}
// Called after anything that can change which lists exist or which is assigned.
// Cheap, idempotent, and the single place the two invariants live: ids resolve,
// and the assigned list is never also listed as an extra.
function prunePracticeSet() {
  const ids = new Set(data.lists.map(l => l.id));

    .filter(id => id !== data.activeListId && ids.has(id));

function addPracticeList(id) {

function removePracticeList(id) {

// ---------- Which sessions belong to a list (parent-sync-spec §16) ----------
// Sessions used to record only `listName`, so every lookup below joined on a
// free-text string. That was survivable while a name was unique, and stops
// being survivable the moment lists carry a grade: "Unit 1" in Grade 3 and
// "Unit 1" in Grade 5 are different lists, and name-matching would let the
// older one satisfy the newer one's pretest gate, feed its Repeat difficulty,
// and pool both into one average.
//
// Sessions now also carry `listId`. Matching prefers it and falls back to the
// name only when a session predates the change — those sessions genuinely have
// no id, and the fallback is what keeps existing history attached to its list
// rather than silently orphaning a year of it.
// The three fields that tie a session to a list, spread into the in-flight
// session object at start and copied onto the record at finish. `listName` is
// still written because everything that only wants to *display* the list —
// including the parent dashboard and the CSV export — reads it, and because a
// session should stay readable if the list is later deleted. `listGrade` is
// frozen here rather than looked up later, so re-labelling a list never
// rewrites the grade a past sitting was recorded under (§16.1).

// downstream has to learn a new shape to read old history (v6.4).
function coverStamp(state) {
  const ids = Array.isArray(state.coverIds) ? state.coverIds : [];

// "Did this sitting touch this list at all" — a different question from the one

// difficulty). A multi-list practice sitting is stamped with the assigned list
// but carries coverIds for every list it drew words from (v6.4). Keeping this
// separate is deliberate: pretest gates, "has a test on record", advancement and
// history grouping all run through sessionMatchesList, and none of them may be
// satisfied by a list that merely lent its words to a shared practice run.

function sessionListKey(s) { return s.listId || ("name:" + (s.listName || "Untitled list")); }

// ---------- Child-led list progression: shared primitives (design v6 §2.1) ----------
// hasTestSession also counts a perfect-pretest promotion, since that's stored as
// mode:"test" too (promotedFrom) — a child who aces the pretest already has a
// qualifying test on record, same as one who took the Test screen directly.
function hasTestSession(list) {

}
// Reads data.lists' live order each time — if a parent reorders or deletes lists,

function nextListFor(list) {
  const idx = data.lists.findIndex(l => l.id === list.id);

// ---------- Advance: "ready for the next list?" (design v6 §2.2) ----------
function advanceEligible() {
  if (!data.advanceEnabled) return false;
  const list = activeList();
  const lastTest = [...data.sessions].reverse().find(s => s.mode === "test" && sessionMatchesList(s, list));
  if (!lastTest) return false;
  return pct(lastTest) >= data.advanceThreshold && !!nextListFor(list);
}
function tryAdvance() {
  const list = activeList();
  const next = nextListFor(list);

  if (!confirm(`Move on from "${list.name}" to "${next.name}"? You can always come back and practice old lists later.`)) return;
  data.activeListId = next.id;

  // now, and the invariant is that it is never both.

// ---------- Practice sets: the child-facing door (v6.4, replacing Merge) ----------
// Shares data.advanceEnabled with Advance, as Merge did (v6.1 §2). Unlike Merge
// there is no "tested lists advance, not merge" rule: adding a list to practice
// takes nothing away and changes no score, so a child who has already tested may
// still want another list's words in the mix. The gate check stays — a child who
// owes a pretest on the assigned list should be taking it, not shopping for more

// ---------- Helpers ----------
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// and a child who spells it correctly must never be told otherwise, so every

// ---------- Kid-facing test history ----------
function renderHistory() {
  const tests = data.sessions.filter(s => s.mode === "test" && s.total > 0);
  if (!tests.length) {
    app.innerHTML = `<div class="card center" style="padding:40px">
      <div style="font-size:40px;margin-bottom:8px">&#128200;</div>
      <div style="font-size:18px;font-weight:600">No tests yet!</div>
      <div class="muted" style="margin-top:6px">Take your first test and your scores will show up here.</div>
    </div>`;
    return;
  }
  const avg = Math.round(tests.reduce((sum, s) => sum + pct(s), 0) / tests.length);
  // Keyed on the list, not its name (§16): repeating "Unit 1" in a later grade
  // is a new list with its own best score, not a better attempt at the old one.
  const best = {};
  tests.forEach(s => {
    const key = sessionListKey(s);
    if (!best[key] || pct(s) > pct(best[key])) best[key] = s;
  });
  const gradeColor = avg >= 90 ? "var(--green)" : avg >= 75 ? "var(--accent)" : "var(--eyebrow)";
  const totalScore = tests.reduce((sum, s) => sum + s.score, 0);
  const totalPossible = tests.reduce((sum, s) => sum + s.total, 0);
  app.innerHTML = `
    <div class="card center" style="padding:30px">
      <div style="font-size:14px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:8px">&#128200; ${data.scoring==="points"?"My points":"My running grade"}</div>
      <div style="font-size:52px;font-weight:800;color:${gradeColor}">${data.scoring==="points"?totalScore:avg+"%"}</div>
      <div class="muted">${data.scoring==="points"?`points earned out of ${totalPossible} across ${tests.length} test${tests.length===1?"":"s"}`:`Average across ${tests.length} test${tests.length===1?"":"s"}`}</div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px">My best score on each list</div>
      ${Object.values(best).map((s) => `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap">
          <span style="font-size:17px;font-weight:600">${esc(s.listName || "Untitled list")}</span>
          <span style="text-align:right">
            <span style="font-size:20px;font-weight:800;color:${pct(s)>=90?"var(--green)":pct(s)>=75?"var(--accent)":"var(--eyebrow)"}">${fmtTest(s)}</span>
            <span class="muted" style="display:block;font-size:13px">${new Date(s.date).toLocaleDateString()}</span>
          </span>
        </div>`).join("")}
    </div>`;
}

// ---------- Session ----------
let S = null;
function cheers() {
  const n = data.childName;
  return [
    `You can do it, ${n}! &#128170;`,
    "Get ready to learn something great!",
    "Take a deep breath — you've got this! &#127775;",
    "Every word you try makes your brain stronger!",
    "Focus up — you've got this! &#128640;",
    "Believe in yourself — we do!",
    "One word at a time. You're going to shine! &#10024;",
    "Mistakes are how we learn. Let's go!",
  ];
}
// `listId` is only ever passed for a Test the child chose from the picker. A
// graded sitting is one list, always — Practice is the only mode that spans the
// practice set, and it is the only mode whose score nobody records (v6.4).
function startSession(mode, listId) {
  const isTest = mode !== "practice";
  const list = (listId && data.lists.find(l => l.id === listId)) || activeList();
  const lists = isTest ? [list] : practiceLists();
  // Two lists can legitimately share a word; the child should spell it once.
  // First list in the set wins the attribution, which is the assigned list
  // wherever there is any doubt.
  const seen = new Set();
  const main = [];
  lists.forEach(l => l.words.forEach(w => {
    if (seen.has(w.word)) return;
    seen.add(w.word);
    main.push({ ...w, type: "main", listId: l.id });
  }));
  const review = data.reviewWords.filter(w => !seen.has(w.word)).map(w => ({...w, type:"review"}));
  let queue = shuffle([...main, ...review]);
  if (isTest) queue = [...queue, ...list.bonus.map(w => ({...w, type:"bonus", listId: list.id}))];
  if (!queue.length) { app.innerHTML = `<div class="card">This list is empty! Ask a parent to add words in the parent dashboard.</div>`; return; }
  S = { mode, isTest, queue, idx: 0, attempts: 0, misses: [], results: [], ...listStamp(list), coverIds: lists.map(l => l.id) };
  const C = cheers();
  const cheer = mode === "pretest" ? "Just show what you know — every answer helps!" : C[Math.floor(Math.random() * C.length)];
  const label = mode === "pretest" ? "&#128221; Pretest" : isTest ? "&#128221; Test time" : "&#127919; Practice time";
  app.innerHTML = `
    <div class="card center" style="padding:40px">
      <div style="font-size:14px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:8px">${label}</div>
      <h2 style="margin:0 0 6px;font-weight:800;font-size:26px">${lists.length > 1 ? lists.map(l => esc(l.name)).join(" + ") : esc(list.name)}</h2>
      ${lists.length === 1 && list.desc ? `<div style="font-size:17px;color:var(--body-text);margin-bottom:14px;line-height:1.5">${esc(list.desc)}</div>` : ""}
      <div class="muted" style="margin-bottom:20px">${queue.length} words today${lists.length > 1 ? ` from ${lists.length} lists` : ""}</div>
      <div style="background:var(--soft);border-radius:14px;padding:16px 20px;font-size:19px;font-weight:600;margin-bottom:26px">${cheer}</div>
      <button class="big green" onclick="beginSession()">Let's start! &rarr;</button>
    </div>`;
}
function beginSession() {
  renderWord();
  speak(S.queue[0].word);
}

// The apostrophe rides on the last row of both layouts. A list of contractions
// is unspellable without it, and it is always present rather than shown only
// for words that need one — a key that appears when the answer contains an
// apostrophe would announce the answer, which Test mode's blind neutrality
// cannot afford.
function kbRows() {
  return data.keyboard === "qwerty"
    ? ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM'"]
    : ["ABCDEFGHI","JKLMNOPQR","STUVWXYZ'"];
}

function renderWord(state) {
  if (!S) return; // navigated away before a pending timer fired — nothing to render
  const w = S.queue[S.idx];
  const fb = state || "";
  // Locked whenever there's nothing left to do but wait/advance: a correct
  // Practice answer, a reveal, OR any answered state in Test/Pretest (correct
  // or wrong). That last clause is the fix — previously only "correct" locked
  // in Test/Pretest, so a wrong test answer left the keyboard live and "Check
  // it" on screen, which (a) telegraphed right-vs-wrong through button state
  // alone, breaking blind neutrality, and (b) left a window to submit a second
  // result for the same word before the 1000ms auto-advance timer fired —
  // same double-log class of bug as Math Star's comparison-widget fix.
  const locked = fb === "reveal" || (S.isTest ? (fb === "correct" || fb === "wrong") : fb === "correct");
  app.innerHTML = `
    <div class="card" style="padding:32px">
      <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:20px">
        <span>${S.mode==="pretest"?"Pretest":S.isTest?"Test":"Practice"} · word ${S.idx+1} of ${S.queue.length}</span>
        ${w.type==="bonus"?'<span class="bonus-tag">&#10024; BONUS WORD</span>':""}
      </div>
      <div class="row" style="margin-bottom:20px">
        <button onclick="speak(S.queue[S.idx].word)">&#128266; Hear the word</button>
        <button class="outline" onclick="speak(S.queue[S.idx].word,true)">&#128034; Say it slowly</button>
        <button class="outline" onclick="speak(S.queue[S.idx].sentence)">&#128214; Hear a sentence</button>
      </div>
      <div class="hint">&#128161; ${esc(w.hint)}</div>
      <input type="text" id="spellInput" class="${S.isTest ? "" : (fb==="correct"?"ok":fb==="wrong"?"bad":"")}" placeholder="Tap the letters below"
        readonly inputmode="none" value="${esc(S.typed || "")}">
      <div class="kb" id="kb">
        ${kbRows().map((row,ri) => `<div class="kb-row">
          ${row.split("").map(ch => `<button class="${ch === "'" ? "kb-punct" : ""}" ${locked?"disabled":""} onclick="kbType(&quot;${ch.toLowerCase()}&quot;)">${ch}</button>`).join("")}
          ${ri===2 ? `<button class="kb-back" ${locked?"disabled":""} onclick="kbBack()">&#9003; erase</button>` : ""}
        </div>`).join("")}
      </div>
      <div class="feedback" id="fb">${
        S.isTest && (fb==="correct"||fb==="wrong") ? '<span style="color:var(--muted)">&#10004;&#65039; Answer saved. On to the next one!</span>' :
        fb==="correct" ? '<span style="color:var(--green)">&#9989; Yes! That\'s it!</span>' :
        fb==="wrong" ? '<span style="color:var(--danger)">Not quite — listen again and give it another try. You\'ve got this!</span>' :
        fb==="reveal" ? `<span style="color:var(--accent);letter-spacing:.2em;font-size:26px">${esc(w.word.toUpperCase())}</span>` : ""
      }</div>
      <div class="row" style="margin-top:10px">
        ${S.isTest && (fb === "correct" || fb === "wrong")
          ? "" /* Test/Pretest: no manual button once answered, on purpose. Auto-advance
                 (the setTimeout in submitWord) is the only way forward — showing a button
                 here at all is what let a correct answer look different from a wrong one,
                 and a visible "Check it" also meant a fast second tap could log a second
                 result for the same word before the timer fired. */
          : locked
          ? '<button class="big green" onclick="nextWord()">Next word &rarr;</button>'
          : `<button class="big" onclick="submitWord()">Check it</button>
             ${!S.isTest && S.attempts >= 2 ? '<button class="outline" onclick="revealWord()">Show me the word</button>' : ""}`}
      </div>
    </div>`;
}

function kbType(ch) {
  S.typed = (S.typed || "") + ch;
  document.getElementById("spellInput").value = S.typed;
}
function kbBack() {
  S.typed = (S.typed || "").slice(0, -1);
  document.getElementById("spellInput").value = S.typed;
}

// Every result row remembers the list its word came from, so a shared practice
// sitting can still be read per-list afterwards (v6.4). Absent on review words,
// which belong to the child rather than to any list.
//
// `missedAs` is what the child actually wrote when they got it wrong. It used
// to be computed, compared, and thrown away — but a child's own misspelling is
// the best distractor Spot the Spelling can offer, better than anything
// generated or hand-written, because it is the error they really make.
//
// It is an array because Practice lets them try again: a word can be missed
// twice and still end the sitting correct, and both misses are worth keeping.
// Test mode contributes at most one. Recorded even on a row marked correct,
// since "got there after two wrong tries" is exactly the word worth drilling.
function resultRow(w, correct, attempts, misses) {
  const row = { word: w.word, correct, attempts, type: w.type };
  if (w.listId) row.listId = w.listId;
  const seen = [];
  for (const m of (Array.isArray(misses) ? misses : [misses])) {
    const t = foldApos(m).trim().toLowerCase();
    if (t && t !== foldApos(w.word).toLowerCase() && !seen.includes(t)) seen.push(t);
  }
  if (seen.length) row.missedAs = seen;
  return row;
}
function submitWord() {
  const val = (S.typed || "").trim();
  if (!val) return;
  const w = S.queue[S.idx];
  const correct = foldApos(val).toLowerCase() === foldApos(w.word).toLowerCase();
  S.attempts++;
  if (S.isTest) {
    S.results.push(resultRow(w, correct, 1, [val]));
    S.typed = "";
    renderWord(correct ? "correct" : "wrong");
    setTimeout(nextWord, 1000);
  } else {
    if (correct) {
      S.results.push(resultRow(w, true, S.attempts, S.misses));
      S.typed = "";
      S.misses = [];
      renderWord("correct");
    } else {
      (S.misses = S.misses || []).push(val);
      S.typed = "";
      renderWord("wrong");
      setTimeout(() => renderWord(), 1400);
    }
  }
}

function revealWord() {
  const w = S.queue[S.idx];
  S.results.push(resultRow(w, false, S.attempts, S.misses));
  S.misses = [];
  renderWord("reveal");
}

function nextWord() {
  if (!S) return; // navigated away before a pending timer fired
  S.idx++; S.attempts = 0; S.typed = ""; S.misses = [];
  if (S.idx >= S.queue.length) return finishSession();
  renderWord();
  speak(S.queue[S.idx].word);
}

function finishSession() {
  const mainR = S.results.filter(r => r.type === "main");
  const bonusEarned = S.results.filter(r => r.type === "bonus" && r.correct).length;
  const session = {
    id: Date.now(), date: new Date().toISOString(), mode: S.mode, ...carryListStamp(S),
    ...coverStamp(S),
    results: S.results,
    score: Math.min(mainR.filter(r => r.correct).length + bonusEarned, mainR.length),
    total: mainR.length, bonusEarned,
  };
  data.sessions.push(session);
  let promoted = false;
  if (S.mode === "pretest" && session.total > 0) {
    const perfect = mainR.length > 0 && mainR.every(r => r.correct);
    if (perfect) {
      // Perfect pretest (bonus words not required): duplicate as a regular test session
      data.sessions.push({ ...session, id: session.id + 1, mode: "test", promotedFrom: session.id });
      promoted = true;
    }
  }
  // Review-word graduation: 3 first-try correct spellings in a row -> word graduates
  S.results.filter(r => r.type === "review").forEach(r => {
    const rw = data.reviewWords.find(w => w.word === r.word);
    if (!rw) return;
    if (r.correct && r.attempts === 1) rw.streak = (rw.streak || 0) + 1;
    else if (!r.correct) rw.streak = 0;
    if ((rw.streak || 0) >= 3) {
      data.reviewWords = data.reviewWords.filter(w => w.word !== rw.word);
      data.graduated.push({ word: rw.word, date: new Date().toISOString() });
    }
  });
  const saved = persist();
  syncPush();
  app.innerHTML = `
    ${saved ? "" : saveFailedBannerHtml()}
    <div class="card center" style="padding:40px">
      <div style="font-size:46px;margin-bottom:8px">${S.isTest?"&#127775;":"&#127881;"}</div>
      <h2 style="margin:0 0 8px;font-weight:800">Great work, ${esc(data.childName)}!</h2>
      ${S.mode==="pretest"
        ? `<div style="font-size:34px;font-weight:800">${fmtTest(session)}</div>
           <div class="muted" style="margin-top:4px">${promoted
             ? "A perfect pretest! &#127775; That counts as your test for this list."
             : "Now you know your words — practice is unlocked. You've got this!"}</div>`
        : S.isTest
        ? `<div style="font-size:34px;font-weight:800">${fmtTest(session)}</div>
           <div class="muted" style="margin-top:4px">${session.score} of ${session.total} words${session.bonusEarned?` · includes +${session.bonusEarned} bonus!`:""}</div>`
        : `<div class="muted">You practiced ${S.results.length} words. Every try makes you stronger!</div>`}
      <div style="margin-top:24px"><button class="big" onclick="go('home')">Done</button></div>
    </div>`;
}

// ---------- Repeat (write-it-out drill) ----------
let RP = null;
// Difficulty follows the word, so the lookup follows the word's own list — and
// a multi-list practice sitting counts for every list it covered (v6.4). The
// session also has to actually contain the word: with several lists in play the
// most recent sitting on a list may be a shared one the word wasn't drawn into.
function repsNeededFor(word, list) {
  const modes = ["practice", "test", "pretest"];
  for (const mode of modes) {
    const last = [...data.sessions].reverse().find(s =>
      s.mode === mode && sessionCoversList(s, list) && s.results.some(x => x.word === word));
    if (!last) continue;
    const r = last.results.find(x => x.word === word);
    if (!r) continue;
    const struggled = mode === "practice" ? (r.attempts > 1 || !r.correct) : !r.correct;
    if (struggled) return data.repeatHard || 8;
  }
  return data.repeatStandard || 5;
}
function startRepeat() {
  const lists = practiceLists();
  const list = lists[0];
  const seen = new Set();
  const words = [];
  lists.forEach(l => l.words.forEach(w => {
    if (seen.has(w.word)) return;
    seen.add(w.word);
    words.push({ ...w, listId: l.id, needed: repsNeededFor(w.word, l) });
  }));
  const queue = shuffle(words).map(w => ({ ...w, extra: w.needed === (data.repeatHard || 8) }));
  if (!queue.length) { app.innerHTML = `<div class="card">This list is empty! Ask a parent to add words in the parent dashboard.</div>`; return; }
  RP = { queue, idx: 0, rep: 0, typed: "", results: [], ...listStamp(list), coverIds: lists.map(l => l.id) };
  app.innerHTML = `
    <div class="card center" style="padding:40px">
      <div style="font-size:14px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:8px">&#9997; Repeat</div>

      <div class="muted" style="margin-bottom:20px">See each word, hear it, then write it yourself — a few times in a row.</div>
      <div style="background:var(--soft);border-radius:14px;padding:16px 20px;font-size:19px;font-weight:600;margin-bottom:26px">Getting a word wrong never counts against you — just try that one again!</div>
      <button class="big green" onclick="beginRepeat()">Let's start! &rarr;</button>
    </div>`;
}
function beginRepeat() {
  renderRepeatWord();
  speak(RP.queue[0].word);
}

function rkbType(ch) { RP.typed = (RP.typed || "") + ch; document.getElementById("spellInput").value = RP.typed; }
function rkbBack() { RP.typed = (RP.typed || "").slice(0, -1); document.getElementById("spellInput").value = RP.typed; }
function submitRepeat() {
  const val = (RP.typed || "").trim();
  if (!val) return;

    renderRepeatWord("wrong");

}
function nextRepeatWord() {

  RP.idx++; RP.rep = 0; RP.typed = "";

  renderRepeatWord();
  speak(RP.queue[RP.idx].word);
}

    results: RP.results, score: 0, total: 0,

  syncPush();

      <div style="margin-top:24px"><button class="big" onclick="go('home')">Done</button></div>
