<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Dashboard — Star</title>
<link rel="manifest" href="./parent-manifest.json">
<link rel="icon" href="./parent-favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./parent-apple-touch-icon.png">
<meta name="theme-color" content="#2A5D9F">
<style>
  :root {
    --bg: #FDF6EC; --text: #2A3A50; --card: #FFFFFF; --card-shadow: rgba(42,58,80,.10);
    --accent: #2A5D9F; --accent-soft: #E3EDF9; --green: #2E8B57; --green-soft: #DCEBDD; --green-dark: #2E6B45;
    --danger: #C4553B; --gold: #E8A013; --gold-soft: #FBEBC8;
    --soft: #F2EBDD; --muted: #6B7686; --border: #C9CDD4; --line: #EDE4D3;
    --input-bg: #FFFDF8; --eyebrow: #B0763A; --body-text: #4A5568;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Lexend', 'Trebuchet MS', 'Comic Sans MS', sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--eyebrow); letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; }
  h2 { margin: 0 0 4px; font-size: 19px; font-weight: 800; }
  nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .card { background: var(--card); border-radius: 20px; padding: 22px; box-shadow: 0 2px 10px var(--card-shadow); margin-bottom: 16px; border: 1px solid var(--line); }
  button { font-family: inherit; font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 12px; border: none; background: var(--accent); color: #fff; cursor: pointer; letter-spacing: .02em; }
  button.big { font-size: 18px; padding: 14px 26px; }
  button.outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
  button.outline.active { background: var(--accent); color: #fff; }
  button.danger { background: var(--danger); }
  button.link { background: none; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px; }
  button:disabled { background: var(--border); color: #fff; cursor: default; border-color: var(--border); }
  input[type=text], input[type=password], select, textarea {
    font-family: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px;
    border: 2px solid var(--border); width: 100%; margin-bottom: 10px; background: var(--input-bg); color: var(--text);
  }
  textarea { resize: vertical; line-height: 1.45; }
  code { background: var(--soft); border-radius: 5px; padding: 1px 5px; font-size: 13px; }
  label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--danger); font-size: 13px; margin: 6px 0; min-height: 16px; }
  .center { text-align: center; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 260px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--accent-soft); }
  .badge { display: inline-block; border-radius: 8px; padding: 2px 9px; font-size: 12px; font-weight: 700; }
  .badge.ok { background: var(--green-soft); color: var(--green-dark); }
  .badge.warn { background: var(--gold-soft); color: #7A5300; }
  .badge.off { background: var(--border); color: #fff; }
  .badge.tone-graded { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-diagnostic { background: var(--gold-soft); color: #7A5300; }
  .badge.tone-practice { background: var(--green-soft); color: var(--green-dark); }
  .badge.tone-play { background: var(--soft); color: var(--body-text); }
  .badge.tone-lifecycle { background: var(--soft); color: var(--muted); }
  .mode-breakdown { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
  /* Plan (assignment-spec.md §8.3): a count and a bar, never a percentage.
     The bar's width is a proportion, but nothing ever prints one — the number
     beside it is "2 of 3", which reads better and keeps a kid-facing view and
     a parent-facing one saying the same thing. */
  .plan-item { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .plan-item:last-child { border-bottom: none; }
  .plan-item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .plan-item-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
  .bar { height: 9px; border-radius: 6px; background: var(--soft); overflow: hidden; margin: 10px 0 6px; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
  .bar.met > span { background: var(--green); }
  .picker label { font-size: 14px; margin-bottom: 6px; }
  .picker select { margin-bottom: 12px; }
  .app-toggle { gap: 8px; }
  .app-toggle button { flex: 1; min-width: 130px; }
  .app-toggle .count { font-weight: 700; opacity: .7; font-size: 12px; }
  tr.selected-row td { background: var(--accent-soft); }
  tr.selected-row td:first-child { border-left: 3px solid var(--accent); }
  .code-display { font-size: 40px; font-weight: 800; letter-spacing: .18em; text-align: center; padding: 18px; background: var(--soft); border-radius: 16px; margin: 12px 0; }
  .sparkline { display: block; }
  .trouble-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .trouble-item:last-child { border-bottom: none; }
  .miss-count { color: var(--danger); font-weight: 700; font-size: 13px; }
  .overlay { position: fixed; inset: 0; background: rgba(42,58,80,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 10; }
  .overlay .card { max-width: 480px; width: 100%; margin: 0; }
  .result-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .result-row:last-child { border-bottom: none; }
  .mark-ok { color: var(--green-dark); font-weight: 800; }
  .mark-bad { color: var(--danger); font-weight: 800; }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Star</div>
      <h1>Parent Dashboard</h1>
    </div>
    <nav class="tabs" id="topNav" style="display:none"></nav>
  </header>
  <div id="app"></div>
</div>

<script>
// ============================================================================
// parent.html — read-only dashboard for the Parent Sync backend
// (docs/parent-sync-spec.md §9, built per §11 Phase 1 step 3). Talks only to
// same-origin /api/*; never touches the child apps' localStorage.
//
// Trouble-item ranking here uses only what /api/sessions returns, i.e. the
// synced results[]. §9 also describes excluding words a child has already
// graduated out of reviewWords, but graduation state lives in localStorage
// and is never synced (only sessions are), so that exclusion isn't available
// here — this ranks purely on recency-weighted miss count across synced
// history, which is the best signal actually on the server.
// ============================================================================

const API = '/api';
const SYNC_KEY = 'star-parent-sync';
// Must match reading-star-v1.html's GENRE_VOCAB exactly (reading-star-spec.md
// §4.2) — a book classified here has to mean the same thing as one classified
// on the tablet.
const READING_GENRE_VOCAB = [
  'adventure', 'animal-fiction', 'biography-nonfiction', 'fantasy',
  'historical-fiction', 'humor', 'mystery', 'realistic-fiction',
  'science-fiction', 'poetry',
];
// Must match reading-star-v1.html's READING_SUPPORT_LEVELS exactly
// (reading-star-spec.md §7) — a generic tier, not a diagnosis label.
const READING_SUPPORT_LEVELS = [
  { v: 'standard', label: 'Standard' },
  { v: 'extra-support', label: 'Extra support' },
  { v: 'significant-support', label: 'Significant support' },
];
const APPS = [
  { id: 'spelling', label: 'Spelling Star' },
  { id: 'math', label: 'Math Star' },
  { id: 'reading', label: 'Reading Star' },
];

// ---------- The mode registry and evaluator (docs/assignment-spec.md §5, §10) ----------
// Everything from here to the end of evaluateItem() is shared source, copied
// byte-for-byte into today.html, and into the three synced apps when §17 step 4
// lands. tests/shared-code.test.mjs compares the copies, the way it already
// compares the plan document block.
//
// Drift here is the silent-wrongness the suites exist to catch: nothing throws
// and no screen breaks, the phone and the tablet simply start counting the
// same week differently and neither can be shown to be the wrong one.
//
// It depends on exactly one thing outside itself — localDate(instant, tz),
// which is already hand-duplicated across parent.html and the three apps under
// the same rule. Nothing else from any host file may be referenced here, or the
// block stops being copyable, which is the only property that makes it safe.
//
// What kind of sitting a session was. A pretest, a test and a practice all
// arrive as a row with a score, and "2 sessions, averaging 100%" flattened
// them into something a parent can't read: the diagnostic before the list and
// the test after it look identical to two practice runs. Labels and ordering
// follow the child apps' own screens (Spelling Star's Pretest / Test /
// Practice, Math Star's Drill / Practice) so the dashboard names a session the
// same way the child saw it.
//
// §5 promotes this from a badge-labelling table to the registry both sides
// evaluate against, which is why `tone` now decides what counts as work and
// not just what colour a badge is.
const MODES = {
  spelling: {
    pretest:  { label: 'Pretest',  tone: 'diagnostic' },
    test:     { label: 'Test',     tone: 'graded' },
    practice: { label: 'Practice', tone: 'practice' },
    repeat:   { label: 'Repeat',   tone: 'practice' },
    spotit:   { label: 'Spot it',  tone: 'play' },
    missing:  { label: 'Missing Letters', tone: 'play' },
  },
  math: {
    drill:    { label: 'Drill',    tone: 'graded' },
    practice: { label: 'Practice', tone: 'practice' },
  },
  // reading-star-spec.md §6: quiz is the graded sitting, the same way Test is
  // for Spelling and Drill is for Math. `log-session` is the sitting that
  // actually is reading, so it reads as practice.
  //
  // The other three are `lifecycle` (assignment-spec.md §5): Reading Star
  // writes a session row when a book is *started*, and again when it is
  // finished or abandoned. Those are transitions of a book, not sittings at
  // one — counting them would make "5 reading sessions a week" satisfiable by
  // opening five books and reading none of them.
  reading: {
    start:        { label: 'Started',        tone: 'lifecycle' },
    'log-session':{ label: 'Reading session', tone: 'practice' },
    finish:       { label: 'Finished',       tone: 'lifecycle' },
    abandon:      { label: 'Quit',           tone: 'lifecycle' },
    quiz:         { label: 'Quiz',           tone: 'graded' },
  },
  // §5, §14. Neither app syncs yet, so nothing here is reachable from the
  // dashboard or the Plan tab's editor — the phone cannot verify a session it
  // never receives, which is why §11 keeps them out of the editor. They are
  // written down now so that the model that ships is already the model those
  // apps slot into, rather than one that has to be reshaped to admit them:
  // when §14 lands, an app id becomes selectable and nothing else moves.
  //
  // Nine Geography modes and four Logic ones collapse to one countable unit
  // each. A round is a round; whether it was capitals or rivers is a question
  // the dashboard answers, not one a target should have to.
  geography: {
    round:  { label: 'Round',  tone: 'practice' },
  },
  logic: {
    puzzle: { label: 'Puzzle', tone: 'practice' },
  },
};

// Unknown modes still render — a future app screen shows its raw mode rather
// than vanishing from the dashboard.
function modeInfo(appId, mode) {
  return (MODES[appId] || {})[mode] || { label: mode || 'Session', tone: 'play' };
}

// assignment-spec.md §5. Two rules rather than an enumeration, because an
// enumeration goes stale: Spelling Star shipped `spotit`, then `missing`, and
// docs/spelling-star-games.md is a backlog of more. Each arrives as a mode with
// tone 'play' and should land in the plan already knowing it is not homework,
// without anyone remembering to come back here.
//
// A parent who wants to encourage games can still target one by naming its
// mode explicitly — this governs only what a broad match sweeps up.
const UNCOUNTED_TONES = ['play', 'lifecycle'];

// An unrecognized mode falls to modeInfo's 'play' default and therefore does
// not count, which is the direction worth failing in: a target that undercounts
// shows "2 of 3" for a child who did three, and a parent goes and looks. One
// that overcounts shows "3 of 3" for a child who did two, and nobody does.
function countsAsWork(appId, mode) {
  return !UNCOUNTED_TONES.includes(modeInfo(appId, mode).tone);
}

// Date arithmetic on a YYYY-MM-DD string, with no timezone involved anywhere.
// That is the whole payoff of §9.3 stamping local_date at write time: once a
// session carries the calendar day it belongs to, every bucket downstream is
// string comparison and day counting, and the IANA database is needed exactly
// once — to ask what today is.
//
// The arithmetic goes through UTC deliberately. A local Date would put these
// on a clock that has 23- and 25-hour days, and "seven days after" would
// occasionally land on the wrong one.
function shiftDate(date, days) {
  const at = Date.parse(date + 'T00:00:00Z');
  if (!Number.isFinite(at)) return date;
  return new Date(at + days * 86400000).toISOString().slice(0, 10);
}
function daysBetween(from, to) {
  const a = Date.parse(from + 'T00:00:00Z');
  const b = Date.parse(to + 'T00:00:00Z');
  if (!Number.isFinite(a) || !Number.isFinite(b)) return 0;
  return Math.round((b - a) / 86400000);
}

// §9.4: the most recent weekStart weekday on or before this date. 0 = Sunday,
// matching data.schedule's existing indexing, so a family that has set its week
// to start on Monday gets the same answer from both.
function weekBucketStart(date, weekStart) {
  const at = Date.parse(date + 'T00:00:00Z');
  if (!Number.isFinite(at)) return date;
  const shift = (new Date(at).getUTCDay() - (weekStart === 1 ? 1 : 0) + 7) % 7;
  return shiftDate(date, -shift);
}

// The local-date window an item is being counted over right now, plus whether
// that window has closed. §4.3's three period kinds, and nothing else: there is
// deliberately no Mon–Fri "schoolweek", because whether a week includes
// Saturday is a question about the family's week and weekStart answers it.
//
// `closed` can only ever be true for a dated period. A day or a week bucket is
// derived from today and therefore always contains it — which is what §10.4
// needs: mid-period neither surface renders a judgment, so a target that has
// not closed has no verdict to show, only a count and the days left.
function periodWindow(item, { timezone, weekStart, now }) {
  const today = localDate(new Date(now), timezone);
  if (!today) return null;

  const period = item && item.period;
  if (period === 'day') return { from: today, to: today, closed: false };
  if (period === 'week') {
    const from = weekBucketStart(today, weekStart);
    return { from, to: shiftDate(from, 6), closed: false };
  }
  if (period && typeof period === 'object' && period.from && period.to) {
    return { from: period.from, to: period.to, closed: today > period.to };
  }
  return null;
}

// §10.2. One pure function, evaluated identically on the phone, on the hub and
// in the apps, so no client ever has to report "I have done 2 of 3" — both
// sides count the same sessions with the same rules and arrive at the same
// number on their own. There is no progress field to get out of sync.
//
// `sessions` are normalized to { at, localDate, app, mode, scopeId, deviceId,
// id }. `now` is a parameter rather than Date.now() so a past period is
// answerable retroactively (§10.1) — which is the point of plan revisions
// carrying an effective date.
function evaluateItem(item, sessions, { timezone, weekStart, now }) {
  const window = periodWindow(item, { timezone, weekStart, now });
  const count = (item && item.count) || 0;
  if (!window) return { done: 0, count, met: false, from: null, to: null, closed: false, daysLeft: 0 };

  const match = (item && item.match) || {};

  // Deduplicated on (deviceId, sessionId) before counting, which is not
  // optional: a merged child holds the same sitting under more than one childId
  // (§6.2), and an app re-pushes its history when it adopts the shared one.
  // /api/summary carries an inner DISTINCT for exactly this reason. Without it
  // a re-push inflates every count and a child appears to have met a target
  // they did not.
  //
  // today.html has no deviceId — everything it reads is by definition from the
  // one device — so the key collapses to the session id there, on its own. That
  // is the same line of code doing the right thing in both places rather than a
  // branch, which is what lets this stay byte-identical.
  const seen = new Set();
  let done = 0;

  for (const s of sessions || []) {
    // A session with no local_date cannot be placed in a calendar day at all
    // (§9.6): it was recorded before plans existed, or on a tablet that has
    // never received one. Excluded rather than guessed at — the phone
    // backfills what it can before this ever runs.
    if (!s || !s.localDate) continue;
    if (s.localDate < window.from || s.localDate > window.to) continue;

    if (match.app && s.app !== match.app) continue;
    if (match.scopeId && s.scopeId !== match.scopeId) continue;

    if (match.modes && match.modes.length) {
      // Naming a mode explicitly targets it whatever its tone, so a parent who
      // wants to encourage a game can. Only a broad match defers to §5's rule.
      if (!match.modes.includes(s.mode)) continue;
    } else if (!countsAsWork(s.app, s.mode)) {
      continue;
    }

    const key = (s.deviceId || '') + ':' + (s.id || '');
    if (seen.has(key)) continue;
    seen.add(key);
    done += 1;
  }

  const today = localDate(new Date(now), timezone);
  return {
    done,
    count,
    met: done >= count,
    from: window.from,
    to: window.to,
    closed: window.closed,
    // Inclusive of today: on the last day of a week this reads 0, which the
    // surfaces render as "last day" rather than "0 days left".
    daysLeft: today && today <= window.to ? daysBetween(today, window.to) : 0,
  };
}
// ---------- end of the shared registry and evaluator ----------

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Which payload field names "what this session was about," per app — the
// scope columns in the schema are generic (§16.3), so only the client that
// wrote a session knows what to call it back.
function scopeOf(appId, s) {
  if (appId === 'spelling') return s.listName;
  if (appId === 'reading') return s.bookTitle;
  return s.focusName || (s.categories || []).join(', ');
}
function scopeColumnLabel(appId, long) {
  if (appId === 'spelling') return 'List';
  if (appId === 'reading') return 'Book';
  return long ? 'Focus area' : 'Focus';
}

function modeOrder(appId, mode) {
  const i = Object.keys(MODES[appId] || {}).indexOf(mode);
  return i === -1 ? 99 : i;
}

// A perfect pretest also writes a `test` session (promotedFrom) so that list
// progression sees a qualifying test. It is bookkeeping, not a second sitting,
// and the session count is only honest if the parent can tell which is which.
function modeBadge(appId, session) {
  const info = modeInfo(appId, session.mode);
  const auto = session.promotedFrom ? ' <span class="muted">auto</span>' : '';
  return `<span class="badge tone-${info.tone}">${esc(info.label)}</span>${auto}`;
}

function loadSync() {
  try { return JSON.parse(localStorage.getItem(SYNC_KEY)); } catch { return null; }
}
function saveSync(obj) { localStorage.setItem(SYNC_KEY, JSON.stringify(obj)); }
function clearSync() { localStorage.removeItem(SYNC_KEY); }

const state = {
  sync: loadSync(), view: 'dashboard', children: [], sessionsByKey: {}, loading: false, error: '',
  detailChildId: null, detailApp: APPS[0].id, // which child/app the detail card below the grid is showing
  // Assign view (§15): the tablet's own report of what it has, and the queue
  // of things sent to it. Both are per child+app and reloaded on every switch.
  snapshots: [], commands: [], assignErr: '', assignNote: '',
  years: [], // Previous years (§16): one aggregate row per (grade, list)
  // Reading's catalog editor (§4.3): the bundled catalog fetched directly
  // (same-origin static asset — cheaper than duplicating full question text
  // into every child_state row, per §15.4's size argument) and the book
  // currently being added/edited, or null when the list view is showing.
  readingCatalog: null, readingEditor: null,
  // Plan tab (assignment-spec.md §11). `plan` is the document as the server
  // last handed it back; `planEditor` is the one item being added or changed,
  // or null when the list is showing. Snapshots are per app, and are what a
  // scoped target is composed against (§15.4) so the phone never carries a
  // second copy of a child app's data model.
  plan: null, planEditor: null, planSnapshots: {}, planErr: '', planNote: '', planBusy: false,
  // assignment-spec.md §9.3: the family's time policy, fetched once and reused.
  // The dashboard buckets a child's week in the FAMILY's zone, not this
  // phone's — a parent reading it from a different timezone should see their
  // child's week, not their own (§9.5).
  family: { timezone: null, weekStart: 0 },
  // The migration runner (Devices → Database). `null` means "not asked yet",
  // which is different from "asked, nothing pending" — only the second should
  // ever silence the banner.
  migrations: null, migrationsBusy: false, migrationsNote: '',
};

async function api(path, { method = 'GET', body, auth = true } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && state.sync) headers.Authorization = 'Bearer ' + state.sync.token;
  const res = await fetch(API + path, { method, headers, cache: 'no-store', body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await res.json(); } catch { /* empty body */ }
  if (!res.ok) throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
  return data;
}

function fmtRelative(ms) {
  if (!ms) return 'never';
  const diff = Date.now() - ms;
  if (diff < 60_000) return 'just now';
  const mins = Math.floor(diff / 60_000);
  if (mins < 60) return mins + ' min ago';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + ' hr' + (hours === 1 ? '' : 's') + ' ago';
  const days = Math.floor(hours / 24);
  return days + ' day' + (days === 1 ? '' : 's') + ' ago';
}
function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
// Sessions travel as UTC ISO strings (the tablet's `new Date().toISOString()`,
// stored as an epoch and handed back the same way), which is the right thing on
// the wire and the wrong thing to read. toLocale* resolves to whatever phone is
// looking, so a parent sees the clock time they'd have seen in the room.
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
// Same as fmtDate but carries the year. The Dashboard can leave the year off
// because everything on it is recent; the Years view cannot — "Jun 26" against
// "Jun 21" reads as the same fortnight when the two are a year apart.
function fmtDateWithYear(ms) {
  const d = new Date(ms);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
// assignment-spec.md §9.3. Byte-identical to the copy in the three child apps;
// 'en-CA' formats as YYYY-MM-DD. Returns null for an unusable zone rather than
// throwing, so a bad family setting degrades to "unbucketed" instead of taking
// the dashboard down.
function localDate(instant, tz) {
  try { return new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(instant); }
  catch { return null; }
}

// §9.6: fill in local_date for rows a client stamped before it knew the family
// zone — every row recorded before Phase 5, and any recorded on a tablet that
// has not yet received a plan.
//
// This runs on the phone because it is the only place it can: applying an IANA
// zone to an instant needs a timezone database, which JavaScript has and
// SQLite does not (§9.2). The dashboard already downloads 90 days of sessions,
// so backfilling the window it displays is free. Rows outside that window stay
// null, which reads as "before plans" — permanently correct, since no target
// has ever applied to a session recorded before this shipped.
function backfillLocalDates(sessions) {
  const tz = state.family.timezone;
  if (!tz) return sessions;
  for (const s of sessions) {
    if (s.localDate) continue;
    const at = Date.parse(s.date);
    if (!Number.isFinite(at)) continue;
    s.localDate = localDate(new Date(at), tz);
  }
  return sessions;
}

// Cheap and idempotent, so every view that needs it can just call it. A family
// with no zone set is a supported state, not an error — the Plan tab is where
// that gets asked about, because a "3 per day" target is the first thing that
// actually needs an answer (§12).
async function ensureFamilySettings() {
  if (state.family.timezone) return state.family;
  try {
    const settings = await api('/family/settings');
    state.family = { timezone: settings.timezone || null, weekStart: settings.weekStart ?? 0 };
  } catch { /* leave it unset; nothing in this phase is blocked by it */ }
  return state.family;
}

// ---------- Database migrations ----------
// The schema ships as numbered schema-phaseN.sql files and applies itself from
// a button here, so a deploy never needs a wrangler command or the D1 console.
// Borrowed wholesale from the Scheduling App's Settings → Database.
async function loadMigrationStatus() {
  try {
    state.migrations = await api('/migrations');
  } catch {
    // A failure here is not worth a red screen: the dashboard's real job is
    // showing a child's work, and it does that fine against an old schema.
    state.migrations = null;
  }
  return state.migrations;
}

// Checked on boot rather than only when someone opens Devices. A pending
// migration is invisible until something breaks — /api/sync starts 500-ing on
// every tablet, and §3 rule 1 makes that silent for the child — so the app has
// to be the one that remembers to look.
function migrationBannerHtml() {
  if (!state.migrations || !state.migrations.pending) return '';
  const n = state.migrations.pending;
  return `<div class="card error">
    <strong>${n} database ${n === 1 ? 'migration is' : 'migrations are'} pending.</strong>
    Tablets may fail to sync until ${n === 1 ? 'it is' : 'they are'} applied — and they fail quietly.
    <button onclick="showView('devices')">Open Devices to apply</button>
  </div>`;
}

function pct(score, total) {
  if (!total) return null;
  return Math.round((score / total) * 100);
}

// ---------- Boot / auth screens ----------
function boot() {
  if (state.sync) {
    renderShell();
    showView('dashboard');
    // Fire and forget: the dashboard paints immediately and the banner appears
    // a moment later if there is one. Nothing waits on this.
    loadMigrationStatus().then(() => { if (state.migrations && state.migrations.pending) showView(state.view); });
  } else renderSetup();
}

function renderSetup() {
  document.getElementById('topNav').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="row">
      <div class="col card">
        <h2>Create a family</h2>
        <p class="muted">First time setting this up? Enter the signup secret your Cloudflare deployment was configured with (spec §5, §6).</p>
        <form id="createForm">
          <label for="secretIn">Signup secret</label>
          <input type="password" id="secretIn" placeholder="Signup secret" required>
          <label for="createLabelIn">This phone's name (optional)</label>
          <input type="text" id="createLabelIn" placeholder="e.g. Mom's phone" maxlength="60">
          <button class="big" type="submit" style="width:100%">Create family</button>
        </form>
        <div class="error" id="createErr"></div>
      </div>
      <div class="col card">
        <h2>Add this phone</h2>
        <p class="muted">Already have a family set up on another phone? Open Devices there, tap "Add a device," pick "Another parent phone," and enter the code it shows here.</p>
        <form id="joinForm">
          <label for="codeIn">Pairing code</label>
          <input type="text" id="codeIn" placeholder="6-character code" maxlength="6" style="text-transform:uppercase;text-align:center;font-size:22px;letter-spacing:.25em" required>
          <label for="joinLabelIn">This phone's name (optional)</label>
          <input type="text" id="joinLabelIn" placeholder="e.g. Dad's phone" maxlength="60">
          <button class="big" type="submit" style="width:100%">Join family</button>
        </form>
        <div class="error" id="joinErr"></div>
      </div>
    </div>`;

  document.getElementById('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('createErr');
    errEl.textContent = '';
    try {
      const deviceId = crypto.randomUUID();
      const data = await api('/family', {
        method: 'POST', auth: false,
        body: {
          signupSecret: document.getElementById('secretIn').value, deviceId,
          label: document.getElementById('createLabelIn').value.trim() || undefined,
          // §9.3: this is the one moment a parent is certain to be holding a
          // device that knows the family's zone, so it is set here rather than
          // left for someone to find on a settings screen. Editable afterwards
          // in Devices.
          timezone: resolvedTimezone(),
        },
      });
      saveSync({ token: data.token, familyId: data.familyId, deviceId, role: 'parent' });
      state.sync = loadSync();
      renderShell(); showView('dashboard');
    } catch (err) { errEl.textContent = err.message; }
  });

  document.getElementById('joinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('joinErr');
    errEl.textContent = '';
    try {
      const deviceId = crypto.randomUUID();
      const code = document.getElementById('codeIn').value.trim().toUpperCase();
      const data = await api('/pair', {
        method: 'POST', auth: false,
        body: { code, deviceId, role: 'parent', label: document.getElementById('joinLabelIn').value.trim() || undefined },
      });
      saveSync({ token: data.token, familyId: null, deviceId, role: 'parent' });
      state.sync = loadSync();
      renderShell(); showView('dashboard');
    } catch (err) { errEl.textContent = err.message; }
  });
}

// What this phone thinks its zone is. Wrapped because resolvedOptions() has
// been known to return undefined in older embedded webviews, and a family
// created without a zone is a supported state (§9.6) — not a reason to fail.
function resolvedTimezone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || undefined; }
  catch { return undefined; }
}

function signOut() {
  if (!confirm('Sign out of the parent dashboard on this phone? This only forgets it locally — to actually cut this phone off, use Revoke in Devices first.')) return;
  clearSync();
  state.sync = null; state.children = []; state.sessionsByKey = {};
  boot();
}

// ---------- Shell / tabs ----------
function renderShell() {
  const nav = document.getElementById('topNav');
  nav.style.display = 'flex';
  nav.innerHTML = `
    <button class="outline" id="navDashboard" onclick="showView('dashboard')">Dashboard</button>
    <button class="outline" id="navYears" onclick="showView('years')">Years</button>
    <button class="outline" id="navAssign" onclick="showView('assign')">Assign</button>
    <button class="outline" id="navPlan" onclick="showView('plan')">Plan</button>
    <button class="outline" id="navDevices" onclick="showView('devices')">Devices</button>
    <button class="link" onclick="signOut()">Sign out</button>`;
}

const VIEWS = { dashboard: renderDashboard, years: renderYears, assign: renderAssign, plan: renderPlan, devices: renderDevices };

function showView(view) {
  state.view = view;
  for (const [id, name] of [['navDashboard', 'dashboard'], ['navYears', 'years'], ['navAssign', 'assign'], ['navPlan', 'plan'], ['navDevices', 'devices']]) {
    document.getElementById(id)?.classList.toggle('active', view === name);
  }
  (VIEWS[view] || renderDashboard)();
}

// Which mode counts as the graded sitting, per app. Derived from MODES rather
// than written out again, so adding an app or renaming its graded screen keeps
// this correct on its own.
function gradedMode(appId) {
  const modes = MODES[appId] || {};
  return Object.keys(modes).find((m) => modes[m].tone === 'graded');
}

// Every id a merged child has synced under (§6.2), as repeated query params.
// The parent never knows which one a given tablet is currently pushing with,
// so both reads and writes address all of them.
function childQuery(child) {
  return child.ids.map((id) => 'childId=' + encodeURIComponent(id)).join('&');
}

async function ensureChildren() {
  if (state.children.length) return;
  const { children } = await api('/children');
  state.children = mergeChildren(children);
}

// ---------- Dashboard ----------

// One child, one row. Both apps now push under a shared childId (§6.2), but a
// child who paired before that fix has a `children` row per app, and a child
// who uses Spelling on one tablet and Math on another legitimately gets two
// ids. Within a single family a name is the child, so fold same-name rows into
// one dashboard child that carries every id it was synced under.
function mergeChildren(children) {
  const byName = new Map();
  for (const c of children) {
    const key = (c.name || '').trim().toLowerCase() || c.id;
    const merged = byName.get(key);
    if (merged) { merged.ids.push(c.id); continue; }
    byName.set(key, { id: c.id, name: c.name, created_at: c.created_at, ids: [c.id] });
  }
  return [...byName.values()];
}

// The 90 days of history both the Dashboard and the Plan tab read from, filed
// into state.sessionsByKey as `<childId>:<appId>`. Extracted from the Dashboard
// so the Plan tab does not silently depend on someone having opened the
// Dashboard first — and so progress against a target costs no new endpoint and
// no new request, which is the whole of §11's "Progress" bullet.
//
// Returns one cell per (child, app) because the Dashboard's grid is built from
// them; the Plan tab reads state.sessionsByKey directly instead.
async function loadSessions() {
  const since = Date.now() - 90 * 86400000;
  const cells = []; // { child, app, sessions }
  for (const child of state.children) {
    for (const a of APPS) {
      const sessions = [];
      const seen = new Set();
      for (const id of child.ids) {
        const res = await api(`/sessions?childId=${encodeURIComponent(id)}&app=${a.id}&since=${since}`);
        for (const s of res.sessions) {
          // A merged child can hold the same session under more than one id:
          // an app re-pushes its history when it adopts the shared childId.
          // (deviceId, id) is the session's real identity — the storage key
          // minus child and app.
          const k = s.deviceId + ':' + s.id;
          if (seen.has(k)) continue;
          seen.add(k);
          sessions.push(s);
        }
      }
      sessions.sort((x, y) => Date.parse(x.date) - Date.parse(y.date));
      state.sessionsByKey[child.id + ':' + a.id] = backfillLocalDates(sessions);
      cells.push({ child, app: a, sessions });
    }
  }
  return cells;
}

async function renderDashboard() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const [{ children: synced }] = await Promise.all([api('/children'), ensureFamilySettings()]);
    const children = mergeChildren(synced);
    state.children = children;

    if (!children.length) {
      app.innerHTML = `<div class="card empty">No children synced yet.<br><br>
        <button onclick="showView('devices')">Go to Devices to add one</button></div>`;
      return;
    }

    const cells = await loadSessions();

    // Land on someone with data rather than an empty card.
    if (!children.some((c) => c.id === state.detailChildId)) {
      const busiest = cells.filter((c) => c.sessions.length)[0];
      state.detailChildId = (busiest ? busiest.child : children[0]).id;
      if (busiest) state.detailApp = busiest.app.id;
    }
    paintDashboard();
  } catch (err) {
    app.innerHTML = `<div class="card error">${esc(err.message)}</div>`;
  }
}

// Repaint only — every session is already in state.sessionsByKey, so switching
// child or app is instant and costs no requests.
function paintDashboard() {
  const weekAgo = Date.now() - 7 * 86400000;
  const gridRows = state.children.map((child) => {
    const cols = APPS.map((a) => {
      const sessions = state.sessionsByKey[child.id + ':' + a.id] || [];
      const recent = sessions.filter((s) => Date.parse(s.date) >= weekAgo);
      const lastActive = sessions.length ? Date.parse(sessions[sessions.length - 1].date) : null;
      return `<td>${recent.length ? `${recent.length} session${recent.length === 1 ? '' : 's'}<br><span class="muted" title="${esc(fmtDateTime(sessions[sessions.length - 1].date))}">${fmtRelative(lastActive)}</span>` : '<span class="muted">—</span>'}</td>`;
    }).join('');
    const selected = child.id === state.detailChildId ? ' class="selected-row"' : '';
    return `<tr${selected}><td><strong>${esc(child.name || 'Unnamed')}</strong></td>${cols}</tr>`;
  }).join('');

  const child = state.children.find((c) => c.id === state.detailChildId) || state.children[0];
  const appDef = APPS.find((a) => a.id === state.detailApp) || APPS[0];
  const sessions = state.sessionsByKey[child.id + ':' + appDef.id] || [];

  const childOptions = state.children
    .map((c) => `<option value="${esc(c.id)}"${c.id === child.id ? ' selected' : ''}>${esc(c.name || 'Unnamed')}</option>`)
    .join('');

  // The app toggle carries each app's session count, so switching to an empty
  // one is a decision rather than a surprise.
  const appToggle = APPS.map((a) => {
    const n = (state.sessionsByKey[child.id + ':' + a.id] || []).length;
    const active = a.id === appDef.id ? ' active' : '';
    return `<button class="outline${active}" onclick="selectDetailApp('${a.id}')">${esc(a.label)}${n ? ` <span class="count">${n}</span>` : ''}</button>`;
  }).join('');

  const detail = sessions.length
    ? renderChildAppCard(child, appDef, sessions)
    : `<div class="card empty">No ${esc(appDef.label)} sessions for ${esc(child.name || 'this child')} yet.</div>`;

  document.getElementById('app').innerHTML = `
    ${migrationBannerHtml()}
    <div class="card">
      <h2>Last 7 days</h2>
      <table>
        <thead><tr><th>Child</th>${APPS.map((a) => `<th>${a.label}</th>`).join('')}</tr></thead>
        <tbody>${gridRows}</tbody>
      </table>
    </div>
    <div class="card picker">
      <label for="childSel">View details for:</label>
      <select id="childSel" onchange="selectDetailChild(this.value)">${childOptions}</select>
      <div class="row app-toggle">${appToggle}</div>
    </div>
    ${detail}`;
}

function selectDetailChild(id) {
  state.detailChildId = id;
  paintDashboard();
}
function selectDetailApp(appId) {
  state.detailApp = appId;
  paintDashboard();
}

function renderChildAppCard(child, app, sessions) {
  const weekAgo = Date.now() - 7 * 86400000;
  const recent = sessions.filter((s) => Date.parse(s.date) >= weekAgo);
  const avgPct = recent.length
    ? Math.round(recent.reduce((sum, s) => sum + (pct(s.score, s.total) ?? 0), 0) / recent.length)
    : null;
  const lastActive = sessions.length ? Date.parse(sessions[sessions.length - 1].date) : null;

  const spark = sessions.slice(-14).map((s) => pct(s.score, s.total) ?? 0);
  const sparkSvg = spark.length > 1 ? renderSparkline(spark) : '';

  // Which kinds of session made up that count, in the apps' own screen order.
  const counts = new Map();
  for (const s of recent) counts.set(s.mode, (counts.get(s.mode) || 0) + 1);
  const breakdown = [...counts.entries()]
    .sort((a, b) => modeOrder(app.id, a[0]) - modeOrder(app.id, b[0]))
    .map(([mode, n]) => {
      const info = modeInfo(app.id, mode);
      return `<span class="badge tone-${info.tone}">${n} ${esc(info.label)}</span>`;
    }).join('');

  const recentList = sessions.slice(-8).reverse().map((s) => {
    const scope = scopeOf(app.id, s);
    const p = pct(s.score, s.total);
    // Reading's non-quiz modes (start/log-session/finish/abandon) carry no
    // score — total > 0 is exactly the condition /api/summary already uses
    // to mean "this row is scored" (§6).
    const scoreCell = s.total ? `${s.score}/${s.total}${p != null ? ` (${p}%)` : ''}` : '—';
    return `<tr class="clickable" onclick="openSessionDetail('${child.id}','${app.id}','${esc(s.id)}')">
      <td>${fmtDate(s.date)}<br><span class="muted">${fmtTime(s.date)}</span></td><td>${modeBadge(app.id, s)}</td><td>${esc(scope || '—')}</td>
      <td>${scoreCell}</td></tr>`;
  }).join('');

  const trouble = app.id === 'spelling'
    ? rankTrouble(sessions, (r) => r.word, (r) => r.word)
    : app.id === 'reading'
    ? rankReadingTrouble(sessions)
    : rankTrouble(sessions, (r) => r.category ? (r.category + (r.subgroup ? ' · ' + r.subgroup : '')) : null, (r) => r.category + (r.subgroup ? ' · ' + r.subgroup : ''));

  const troubleHtml = trouble.length
    ? trouble.map((t) => `<div class="trouble-item"><span>${esc(t.label)}</span><span class="miss-count">${t.misses} miss${t.misses === 1 ? '' : 'es'}</span></div>`).join('')
    : '<p class="muted">No trouble spots yet — nice!</p>';

  return `
    <div class="card">
      <h2>${esc(child.name || 'Unnamed')} — ${esc(app.label)}</h2>
      <p class="muted">Last active ${fmtRelative(lastActive)}${lastActive ? ` · ${esc(fmtDateTime(sessions[sessions.length - 1].date))}` : ''}</p>
      <div class="row">
        <div class="col">
          <p><strong>${recent.length}</strong> session${recent.length === 1 ? '' : 's'} in the last 7 days${avgPct != null ? `, averaging <strong>${avgPct}%</strong>` : ''}.</p>
          ${breakdown ? `<div class="mode-breakdown">${breakdown}</div>` : ''}
          ${sparkSvg}
        </div>
        <div class="col">
          <strong>Trouble spots</strong>
          ${troubleHtml}
        </div>
      </div>
      <details style="margin-top:10px">
        <summary class="muted" style="cursor:pointer">Recent sessions</summary>
        <table style="margin-top:8px">
          <thead><tr><th>Date</th><th>Type</th><th>${scopeColumnLabel(app.id)}</th><th>Score</th></tr></thead>
          <tbody>${recentList}</tbody>
        </table>
      </details>
    </div>`;
}

function renderSparkline(values) {
  const w = 220, h = 40, max = 100;
  const pts = values.map((v, i) => {
    const x = (i / Math.max(values.length - 1, 1)) * w;
    const y = h - (Math.min(v, max) / max) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg class="sparkline" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// Recency-weighted miss count (§9): misses in the last 7 days count double,
// misses in the last 30 count 1.3x, older misses count once.
function rankTrouble(sessions, keyFn, labelFn) {
  const now = Date.now();
  const byKey = new Map();
  for (const s of sessions) {
    const occurred = Date.parse(s.date) || now;
    const ageDays = (now - occurred) / 86400000;
    const recencyMult = ageDays <= 7 ? 2 : ageDays <= 30 ? 1.3 : 1;
    for (const r of (s.results || [])) {
      const key = keyFn(r);
      if (!key) continue;
      if (!byKey.has(key)) byKey.set(key, { label: labelFn(r), misses: 0, weight: 0 });
      const entry = byKey.get(key);
      if (!r.correct) { entry.misses += 1; entry.weight += recencyMult; }
    }
  }
  return [...byKey.values()].filter((e) => e.misses > 0).sort((a, b) => b.weight - a.weight).slice(0, 10);
}

// Reading has no per-item results array (§6) — a quiz event carries only
// score/total and a `missed` array of stable question ids (reading-star-spec
// §3.2, §4.1). No catalog is loaded here to turn an id into question text, so
// this ranks by book instead, the same "weak spots" instinct one level up:
// which books' quizzes are actually giving trouble, not which question.
function rankReadingTrouble(sessions) {
  const now = Date.now();
  const byKey = new Map();
  for (const s of sessions) {
    if (s.mode !== 'quiz' || !Array.isArray(s.missed) || !s.missed.length) continue;
    const key = s.bookTitle || 'Untitled';
    const label = s.author ? `${key} — ${s.author}` : key;
    const occurred = Date.parse(s.date) || now;
    const ageDays = (now - occurred) / 86400000;
    const recencyMult = ageDays <= 7 ? 2 : ageDays <= 30 ? 1.3 : 1;
    if (!byKey.has(key)) byKey.set(key, { label, misses: 0, weight: 0 });
    const entry = byKey.get(key);
    entry.misses += s.missed.length;
    entry.weight += s.missed.length * recencyMult;
  }
  return [...byKey.values()].sort((a, b) => b.weight - a.weight).slice(0, 10);
}

// A reading event's mode-specific detail, read straight off the session
// (payload fields spread onto it by /api/sessions) rather than a results[].
function readingDetailHtml(session) {
  if (session.mode === 'log-session') {
    const parts = [];
    if (session.minutes) parts.push(`${session.minutes} min`);
    if (session.pages) parts.push(`${session.pages} pages`);
    if (session.note) parts.push(esc(session.note));
    return parts.length ? `<p>${parts.join(' · ')}</p>` : '';
  }
  if (session.mode === 'finish' && session.rating) return `<p>Rating: ${session.rating}/5</p>`;
  if (session.mode === 'quiz' && Array.isArray(session.missed)) {
    return `<p>${session.missed.length} question${session.missed.length === 1 ? '' : 's'} missed out of ${session.total}</p>`;
  }
  return '';
}

// ---------- Session detail ----------
function openSessionDetail(childId, appId, sessionId) {
  const sessions = state.sessionsByKey[childId + ':' + appId] || [];
  const session = sessions.find((s) => String(s.id) === String(sessionId));
  if (!session) return;
  const child = state.children.find((c) => c.id === childId);
  const scope = scopeOf(appId, session);

  // Reading has no per-item results array — its mode-specific detail (minutes/
  // pages/note, a rating, a missed-question count) lives directly on the
  // session, not in a `results[]` (§6).
  const rows = appId === 'reading'
    ? readingDetailHtml(session)
    : (session.results || []).map((r) => {
        const label = appId === 'spelling'
          ? esc(r.word)
          : esc(r.prompt || (r.category + (r.subgroup ? ' · ' + r.subgroup : '')));
        const answer = appId === 'math' && r.answer != null ? ` <span class="muted">(${esc(String(r.answer))})</span>` : '';
        return `<div class="result-row"><span>${label}${answer}</span>
          <span class="${r.correct ? 'mark-ok' : 'mark-bad'}">${r.correct ? '✓' : '✗'} ${r.attempts ? `· ${r.attempts} try${r.attempts === 1 ? '' : 'ies'}` : ''}</span></div>`;
      }).join('');

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="card">
      <h2>${esc(child?.name || 'Session')}</h2>
      <p style="margin:6px 0">${modeBadge(appId, session)}</p>
      <p class="muted">${esc(fmtDateTime(session.date))}${scope ? ' · ' + esc(scope) : ''}${session.total ? ' · ' + session.score + '/' + session.total : ''}</p>
      ${session.promotedFrom ? '<p class="muted">Recorded automatically from a perfect pretest — the same sitting as that pretest, not a second one.</p>' : ''}
      <div>${rows || '<p class="muted">No item detail recorded.</p>'}</div>
      <div class="error" id="sessionDeleteErr"></div>
      <div class="row" style="margin-top:16px;justify-content:space-between">
        <button class="danger" onclick="deleteSessionFromParent('${esc(childId)}','${esc(appId)}','${esc(String(session.id))}',this)">Delete session</button>
        <button class="outline" onclick="this.closest('.overlay').remove()">Close</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

// §15.3. One call does both halves — tombstone the cloud row so this dashboard
// stops showing it, and queue the command that drops it from the tablet's own
// history — because a delete that lands on only one side is worse than no
// delete at all.
async function deleteSessionFromParent(childId, appId, sessionId, btn) {
  const child = state.children.find((c) => c.id === childId);
  const sessions = state.sessionsByKey[childId + ':' + appId] || [];
  const session = sessions.find((s) => String(s.id) === String(sessionId));
  if (!child || !session) return;

  // A perfect pretest and its auto-promoted test twin are one sitting (§9), so
  // they delete together — the same rule the child app applies locally. Doing
  // it here rather than server-side keeps the server out of the business of
  // knowing what a Spelling Star session means (§3 rule 3).
  const ids = new Set([String(session.id)]);
  if (session.promotedFrom) ids.add(String(session.promotedFrom));
  const twin = sessions.find((s) => s.promotedFrom && String(s.promotedFrom) === String(session.id));
  if (twin) ids.add(String(twin.id));

  const extra = ids.size > 1 ? '\n\nIts auto-recorded twin will go too — they are one sitting.' : '';
  if (!confirm(`Delete this session from ${child.name || 'this child'}'s history?${extra}\n\nIt disappears here and from the tablet the next time it syncs. This can't be undone.`)) return;

  const errEl = document.getElementById('sessionDeleteErr');
  if (btn) { btn.disabled = true; btn.textContent = 'Deleting…'; }
  try {
    await api('/sessions/delete', { method: 'POST', body: { app: appId, childIds: child.ids, sessionIds: [...ids] } });
    for (const a of APPS) {
      const key = childId + ':' + a.id;
      if (!state.sessionsByKey[key]) continue;
      state.sessionsByKey[key] = state.sessionsByKey[key].filter((s) => !ids.has(String(s.id)));
    }
    document.querySelector('.overlay')?.remove();
    paintDashboard();
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Delete session'; }
    if (errEl) errEl.textContent = err.message;
  }
}

// ---------- Previous years (§16) ----------
//
// The multi-year record. Deliberately not the dashboard: the dashboard answers
// "how is it going this week" and is built from full sessions, while this
// answers "what did they do in Grade 3" and is built from one aggregate query
// (§16.2) that never moves a payload. Which is why it can span years at all.
//
// A final grade here is the **highest** graded sitting on each list, not an
// average of attempts — practising a list until it is right is the point, so
// the best score is the honest record of what was learned (§16.1).

async function renderYears() {
  const appEl = document.getElementById('app');
  appEl.innerHTML = '<div class="empty">Loading…</div>';
  try {
    await ensureChildren();
    if (!state.children.length) {
      appEl.innerHTML = `<div class="card empty">No children synced yet.<br><br>
        <button onclick="showView('devices')">Go to Devices to add one</button></div>`;
      return;
    }
    if (!state.children.some((c) => c.id === state.detailChildId)) state.detailChildId = state.children[0].id;

    const child = state.children.find((c) => c.id === state.detailChildId);
    const appDef = APPS.find((a) => a.id === state.detailApp) || APPS[0];
    const mode = gradedMode(appDef.id);
    const qs = childQuery(child) + '&app=' + encodeURIComponent(appDef.id) + '&mode=' + encodeURIComponent(mode);
    const { lists } = await api('/summary?' + qs);
    state.years = lists || [];
    paintYears();
  } catch (err) {
    appEl.innerHTML = `<div class="card error">${esc(err.message)}</div>`;
  }
}

function selectYearsChild(id) { state.detailChildId = id; renderYears(); }
function selectYearsApp(appId) { state.detailApp = appId; renderYears(); }

function paintYears() {
  const child = state.children.find((c) => c.id === state.detailChildId);
  const appDef = APPS.find((a) => a.id === state.detailApp) || APPS[0];
  const gradedLabel = modeInfo(appDef.id, gradedMode(appDef.id)).label;

  const childOptions = state.children
    .map((c) => `<option value="${esc(c.id)}"${c.id === child.id ? ' selected' : ''}>${esc(c.name || 'Unnamed')}</option>`)
    .join('');
  const appToggle = APPS.map((a) => {
    const active = a.id === appDef.id ? ' active' : '';
    return `<button class="outline${active}" onclick="selectYearsApp('${a.id}')">${esc(a.label)}</button>`;
  }).join('');

  // Newest grade first, with anything recorded before grades existed last —
  // it is history, not a year, and putting it on top would bury the real ones.
  const byGrade = new Map();
  for (const row of state.years) {
    const key = row.grade || '';
    if (!byGrade.has(key)) byGrade.set(key, []);
    byGrade.get(key).push(row);
  }
  const order = [...byGrade.keys()].sort((a, b) => {
    if (!a) return 1;
    if (!b) return -1;
    return gradeRank(b) - gradeRank(a);
  });

  const sections = order.map((grade) => {
    const rows = byGrade.get(grade).slice().sort((x, y) => (y.lastAt || 0) - (x.lastAt || 0));
    // The grade-level number is the mean of each list's best — an average of
    // finals, not of every attempt. Stated in the copy, because "91%" with no
    // definition is exactly the kind of number that gets quoted back wrongly.
    const mean = Math.round((rows.reduce((sum, r) => sum + r.best, 0) / rows.length) * 100);
    const span = rows.length
      ? `${fmtDateWithYear(Math.min(...rows.map((r) => r.firstAt)))} – ${fmtDateWithYear(Math.max(...rows.map((r) => r.lastAt)))}`
      : '';

    const body = rows.map((r) => `
      <tr>
        <td><strong>${esc(r.scopeName || 'Untitled')}</strong><br><span class="muted">${esc(fmtDateWithYear(r.lastAt))}</span></td>
        <td class="muted">${r.attempts} ${esc(gradedLabel.toLowerCase())}${r.attempts === 1 ? '' : 's'}</td>
        <td><strong>${Math.round(r.best * 100)}%</strong></td>
      </tr>`).join('');

    return `
      <div class="card">
        <h2>${grade ? 'Grade ' + esc(grade) : 'Before grades'}</h2>
        <p class="muted">${rows.length} list${rows.length === 1 ? '' : 's'}${span ? ' · ' + esc(span) : ''} · best scores average <strong>${mean}%</strong></p>
        ${!grade ? '<p class="muted">Recorded before word lists carried a grade. These keep their scores; they just have no year to file under.</p>' : ''}
        <table>
          <thead><tr><th>${scopeColumnLabel(appDef.id, true)}</th><th>Sittings</th><th>Best</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="card picker">
      <label for="yearsChildSel">Previous years for:</label>
      <select id="yearsChildSel" onchange="selectYearsChild(this.value)">${childOptions}</select>
      <div class="row app-toggle">${appToggle}</div>
      <p class="muted" style="margin:10px 0 0">Each list's <strong>best ${esc(gradedLabel)}</strong> score, filed under the grade it was worked in. Practice and other sittings aren't counted here — they're on the Dashboard.</p>
    </div>
    ${sections || `<div class="card empty">No ${esc(gradedLabel.toLowerCase())} results yet for ${esc(child.name || 'this child')} in ${esc(appDef.label)}.</div>`}`;
}

// "K" sorts below 1; everything else is a number. Anything unrecognized sorts
// to the bottom rather than throwing off the order.
function gradeRank(grade) {
  if (grade === 'K') return 0;
  const n = parseInt(grade, 10);
  return Number.isFinite(n) ? n : -1;
}

// ---------- Assign (parent -> child, §15) ----------
//
// The one screen that writes rather than reads. Everything it offers comes
// from the tablet's own snapshot (§15.4) — its word lists, its focus areas,
// its category catalog — so this page never carries a second copy of either
// child app's data model and can't drift out of date with the installed
// version. Nothing here takes effect instantly: a command sits in the queue
// until the tablet next syncs, which the delivery status makes plain.

async function renderAssign() {
  const appEl = document.getElementById('app');
  appEl.innerHTML = '<div class="empty">Loading…</div>';
  try {
    await ensureChildren();
    if (!state.children.length) {
      appEl.innerHTML = `<div class="card empty">No children synced yet.<br><br>
        <button onclick="showView('devices')">Go to Devices to add one</button></div>`;
      return;
    }
    if (!state.children.some((c) => c.id === state.detailChildId)) state.detailChildId = state.children[0].id;

    const child = state.children.find((c) => c.id === state.detailChildId);
    const appDef = APPS.find((a) => a.id === state.detailApp) || APPS[0];
    const qs = childQuery(child) + '&app=' + encodeURIComponent(appDef.id);
    const [snap, cmds] = await Promise.all([api('/child-state?' + qs), api('/commands?' + qs)]);
    state.snapshots = snap.snapshots || [];
    state.commands = cmds.commands || [];
    // Fetched once and cached: the bundled catalog's full question text
    // rides on this static asset rather than in every child_state snapshot
    // (§15.4). Only the overlay — the parent's own, small by construction —
    // needs to travel with the snapshot in full.
    if (appDef.id === 'reading' && !state.readingCatalog) {
      try { state.readingCatalog = await fetch('./reading-catalog.json', { cache: 'no-store' }).then((r) => r.json()); }
      catch { state.readingCatalog = {}; }
    }
    paintAssign();
  } catch (err) {
    appEl.innerHTML = `<div class="card error">${esc(err.message)}</div>`;
  }
}

function selectAssignChild(id) { state.detailChildId = id; state.assignErr = ''; state.assignNote = ''; state.readingEditor = null; renderAssign(); }
function selectAssignApp(appId) { state.detailApp = appId; state.assignErr = ''; state.assignNote = ''; state.readingEditor = null; renderAssign(); }

function paintAssign() {
  const child = state.children.find((c) => c.id === state.detailChildId);
  const appDef = APPS.find((a) => a.id === state.detailApp) || APPS[0];
  // Freshest wins: two tablets can both report, and the server hands them back
  // newest-first.
  const snapshot = state.snapshots[0];

  const childOptions = state.children
    .map((c) => `<option value="${esc(c.id)}"${c.id === child.id ? ' selected' : ''}>${esc(c.name || 'Unnamed')}</option>`)
    .join('');
  const appToggle = APPS.map((a) => {
    const active = a.id === appDef.id ? ' active' : '';
    return `<button class="outline${active}" onclick="selectAssignApp('${a.id}')">${esc(a.label)}</button>`;
  }).join('');

  const body = !snapshot
    ? `<div class="card empty">${esc(child.name || 'This child')}'s tablet hasn't reported what it has for ${esc(appDef.label)} yet.
        <br><br><span class="muted">It reports on the next sync — opening the app on the tablet is enough. A tablet still on the older app version syncs results but can't be assigned to until it's updated.</span></div>`
    : appDef.id === 'reading'
      ? renderReadingAssign(child, snapshot)
      : appDef.id === 'spelling'
        ? renderSpellingAssign(child, snapshot)
        : renderMathAssign(child, snapshot);

  document.getElementById('app').innerHTML = `
    <div class="card picker">
      <label for="assignChildSel">Assign for:</label>
      <select id="assignChildSel" onchange="selectAssignChild(this.value)">${childOptions}</select>
      <div class="row app-toggle">${appToggle}</div>
      ${snapshot ? `<p class="muted" style="margin:10px 0 0">From ${esc(snapshot.deviceLabel || 'the tablet')}, ${fmtRelative(snapshot.updatedAt)}.</p>` : ''}
    </div>
    ${state.assignNote ? `<div class="card" style="background:var(--green-soft);border-color:var(--green)"><strong>${esc(state.assignNote)}</strong><div class="muted" style="margin-top:4px">It lands the next time the tablet syncs — on the next app open, or within a minute if it's already open.</div></div>` : ''}
    ${state.assignErr ? `<div class="card error">${esc(state.assignErr)}</div>` : ''}
    ${body}
    ${renderQueueCard()}`;
}

function renderSpellingAssign(child, snapshot) {
  const lists = snapshot.state.lists || [];
  const activeId = snapshot.state.activeListId;

  // The tablet reports which grades it offers, so this stays right if the app
  // ever changes the set (§15.4). Older clients send no `grades`; the field
  // then falls back to whatever grades their lists already use.
  const grades = snapshot.state.grades
    || [...new Set(lists.map((l) => l.grade).filter(Boolean))];
  const defaultGrade = snapshot.state.gradeLevel;

  // Also practiced alongside the assigned one (spelling v6.4). Older tablets
  // report no such field; an empty set then reads as "just the assigned list",
  // which is exactly what those builds do.
  const practiceIds = snapshot.state.practiceListIds || [];

  const rows = lists.map((l, i) => {
    const isActive = l.id === activeId;
    const counts = `${l.wordCount} word${l.wordCount === 1 ? '' : 's'}${l.bonusCount ? ` + ${l.bonusCount} bonus` : ''}`;
    // The full order with this one list moved by a step — the payload the
    // tablet expects (§15.3), composed against the order it last reported.
    const moved = (dir) => {
      const ids = lists.map((x) => x.id);
      const [id] = ids.splice(i, 1);
      ids.splice(i + dir, 0, id);
      return ids;
    };
    const orderBtn = (dir, glyph, label) => (
      (dir < 0 ? i === 0 : i === lists.length - 1)
        ? `<button disabled>${glyph}</button>`
        : `<button onclick="${esc(`sendCommand('reorder-lists', ${JSON.stringify({ order: moved(dir) })}, ${JSON.stringify('Moved “' + l.name + '” ' + label)})`)}">${glyph}</button>`);
    return `<tr>
      <td><strong>${esc(l.name)}</strong>${isActive ? '' : practiceIds.includes(l.id) ? ' <span class="badge tone-graded">also practiced</span>' : ''}<br><span class="muted">${l.grade ? 'Grade ' + esc(l.grade) : 'Ungraded'}${l.desc ? ' · ' + esc(l.desc) : ''}</span></td>
      <td class="muted">${counts}</td>
      <td style="white-space:nowrap">${orderBtn(-1, '&#9650;', 'up')} ${orderBtn(1, '&#9660;', 'down')}</td>
      <td>${isActive
        ? '<span class="badge ok">Assigned</span>'
        : `<button onclick="${esc(`sendCommand('set-active-list', ${JSON.stringify({ listId: l.id })}, ${JSON.stringify('Assigned “' + l.name + '”')})`)}">Assign</button>`}</td>
    </tr>`;
  }).join('');

  return `
    <div class="card">
      <h2>Lists on the tablet</h2>
      <p class="muted">The assigned list is the one ${esc(child.name || 'they')} is working this week. Others can be practised alongside it from the tablet, but a test is always on a single list and is recorded under that list's own title. Order decides which list counts as “the next one”: use ▲▼ to change it.</p>
      <table>
        <thead><tr><th>List</th><th>Size</th><th>Order</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" class="muted">No lists reported.</td></tr>'}</tbody>
      </table>
    </div>
    <div class="card">
      <h2>Send a new list</h2>
      <p class="muted">One word per line. To add a hint and an example sentence, write <code>word, hint, sentence</code> — the same format the tablet's CSV import takes. Sending a list whose name already exists replaces its words.</p>
      <label for="newListName">List name</label>
      <input type="text" id="newListName" placeholder="e.g. Week 12" maxlength="60">
      ${grades.length ? `
      <label for="newListGrade">Grade level</label>
      <select id="newListGrade">
        ${grades.map((g) => `<option value="${esc(g)}"${g === defaultGrade ? ' selected' : ''}>Grade ${esc(g)}</option>`).join('')}
      </select>` : ''}
      <label for="newListWords">Words</label>
      <textarea id="newListWords" rows="8" placeholder="because&#10;friend, tricky one, My friend is here.&#10;through"></textarea>
      <label for="newListBonus">Bonus words (optional)</label>
      <textarea id="newListBonus" rows="3" placeholder="rhythm&#10;conscience"></textarea>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text)">
        <input type="checkbox" id="newListActive" checked style="width:auto;margin:0"> Make it the assigned list
      </label>
      <button class="big" style="margin-top:12px" onclick="sendNewList()">Send to the tablet</button>
    </div>`;
}

function renderMathAssign(child, snapshot) {
  const areas = snapshot.state.focusAreas || [];
  const activeId = snapshot.state.activeFocusId;
  // The tablet's own CATS (§15.4). If an older app version reported no
  // catalog, the picker is hidden rather than guessed at.
  const catalog = snapshot.state.catalog || [];

  const rows = areas.map((f) => {
    const isActive = f.id === activeId;
    const labels = (f.categories || []).map((c) => {
      const meta = catalog.find((x) => x.id === c);
      return meta ? meta.label : c;
    }).join(', ');
    return `<tr>
      <td><strong>${esc(f.name)}</strong><br><span class="muted">${esc(labels)}</span></td>
      <td>${isActive
        ? '<span class="badge ok">Assigned</span>'
        : `<button onclick="${esc(`sendCommand('set-active-focus', ${JSON.stringify({ focusId: f.id })}, ${JSON.stringify('Assigned “' + f.name + '”')})`)}">Assign</button>`}</td>
    </tr>`;
  }).join('');

  const strands = [];
  const byStrand = {};
  for (const c of catalog) {
    const key = c.strand || 'Other';
    if (!byStrand[key]) { byStrand[key] = []; strands.push(key); }
    byStrand[key].push(c);
  }
  const picker = strands.map((strand) => `
    <div style="margin-bottom:10px">
      <div class="muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">${esc(strand)}</div>
      ${byStrand[strand].map((c) => `
        <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text);padding:2px 0">
          <input type="checkbox" class="newFocusCat" value="${esc(c.id)}" style="width:auto;margin:0">
          ${esc(c.label)} <span class="muted">${esc(c.band)}</span>
        </label>`).join('')}
    </div>`).join('');

  return `
    <div class="card">
      <h2>Focus areas on the tablet</h2>
      <p class="muted">The assigned one is what ${esc(child.name || 'they')} gets for practice and drills.</p>
      <table>
        <thead><tr><th>Focus area</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="2" class="muted">No focus areas reported.</td></tr>'}</tbody>
      </table>
    </div>
    ${catalog.length ? `
    <div class="card">
      <h2>Send a new focus area</h2>
      <p class="muted">Pick one category for a focused stretch, or several for a mixed session. Sending one whose name already exists replaces its categories.</p>
      <label for="newFocusName">Name</label>
      <input type="text" id="newFocusName" placeholder="e.g. Fractions week" maxlength="60">
      <label>Categories</label>
      ${picker}
      <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text)">
        <input type="checkbox" id="newFocusActive" checked style="width:auto;margin:0"> Make it the assigned focus area
      </label>
      <button class="big" style="margin-top:12px" onclick="sendNewFocus()">Send to the tablet</button>
    </div>` : ''}`;
}

// ---------- Reading's catalog editor (§4.3) ----------
// The bundled catalog is read-only, so an add/edit/delete lands as an
// assign-book / delete-book command that the tablet applies into its own
// data.catalogOverlay, keyed by book_key like the bundle itself (§4.1).
// state.readingEditor holds the book being composed, or null for the list
// view — text fields are read from the DOM only when a row is added/removed
// or the book is sent, the same "read at submit time" pattern the word-list
// and focus-area composers above already use.

function readingMergedCatalog(snapshot) {
  const bundled = state.readingCatalog || {};
  const overlay = (snapshot && snapshot.state && snapshot.state.catalogOverlay) || {};
  const keys = new Set([...Object.keys(bundled), ...Object.keys(overlay)]);
  return [...keys].map((key) => ({ key, ...(overlay[key] || bundled[key]), overridden: key in overlay }))
    .sort((a, b) => (a.series || '').localeCompare(b.series || '')
      || (a.seriesNumber || 0) - (b.seriesNumber || 0) || a.title.localeCompare(b.title));
}

function mintReadingId() { return 'p-' + crypto.randomUUID().slice(0, 8); }

// Reuses an existing series' key when the typed name matches one already in
// use (case-insensitively), so "Thoroughbred" from two different books lands
// on the same seriesKey rather than two — same identity argument as book_key
// (§4.1), applied to series.
function readingSeriesKeyFor(seriesName, merged) {
  if (!seriesName) return null;
  const known = merged.find((b) => b.series && b.series.toLowerCase() === seriesName.toLowerCase());
  if (known && known.seriesKey) return known.seriesKey;
  return String(seriesName).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'series';
}

function renderReadingAssign(child, snapshot) {
  if (state.readingEditor) return renderReadingEditor(child, snapshot);
  const merged = readingMergedCatalog(snapshot);
  const overlay = (snapshot.state && snapshot.state.catalogOverlay) || {};
  const rows = merged.map((b) => {
    const qCount = (b.questions || []).length;
    const sub = [b.author, b.series ? esc(b.series) + (b.seriesNumber ? ' #' + b.seriesNumber : '') : null].filter(Boolean).map((s) => esc(String(s))).join(' · ');
    return `<tr>
      <td><strong>${esc(b.title)}</strong>${sub ? `<br><span class="muted">${sub}</span>` : ''}</td>
      <td class="muted">${qCount} question${qCount === 1 ? '' : 's'}${b.overridden ? ' · <span class="badge warn">Edited</span>' : ''}</td>
      <td>
        <button class="small outline" onclick="${esc(`startEditReadingBook(${JSON.stringify(b.key)})`)}">Edit</button>
        ${b.key in overlay ? `<button class="link" style="color:var(--danger)" onclick="${esc(`deleteReadingBook(${JSON.stringify(b.key)}, ${JSON.stringify(b.title)})`)}">Delete</button>` : ''}
      </td>
    </tr>`;
  }).join('');

  return `
    ${renderReadingSupportCard(child, snapshot)}
    <div class="card">
      <h2>Book catalog on the tablet</h2>
      <p class="muted">${esc(child.name || 'They')} can start any of these and take its quiz. Editing a bundled book saves your change as an override on the tablet — a later app update won't undo it.</p>
      <table>
        <thead><tr><th>Book</th><th>Quiz</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="3" class="muted">No books reported.</td></tr>'}</tbody>
      </table>
      <button style="margin-top:12px" onclick="startNewReadingBook()">+ Add a book</button>
    </div>`;
}

// §7: a generic tier, not a diagnosis label — the hook for future point
// weighting (computePoints(), not built yet). Reported back in the tablet's
// own state snapshot (§15.4) the same way an assigned list/focus area is, so
// this card shows what's actually applied rather than guessing.
function renderReadingSupportCard(child, snapshot) {
  const current = snapshot.state && snapshot.state.readingSupportLevel;
  const currentLabel = (READING_SUPPORT_LEVELS.find((l) => l.v === current) || {}).label || 'Standard (not set)';
  const options = READING_SUPPORT_LEVELS.map((l) => `<option value="${l.v}" ${l.v === current ? 'selected' : ''}>${esc(l.label)}</option>`).join('');
  return `
    <div class="card">
      <h2>Reading support level</h2>
      <p class="muted">A general tier, not a diagnosis — it's a hook for future point weighting and doesn't change anything yet. Currently on the tablet: <strong>${esc(currentLabel)}</strong>.</p>
      <select id="readingSupportSel">${options}</select>
      <button onclick="sendReadingSupportLevel()">Set</button>
    </div>`;
}
function sendReadingSupportLevel() {
  const level = document.getElementById('readingSupportSel').value;
  const label = (READING_SUPPORT_LEVELS.find((l) => l.v === level) || {}).label || level;
  sendCommand('set-reading-support-level', { level }, `Set reading support level to “${label}”.`);
}

function startNewReadingBook() {
  state.readingEditor = {
    key: mintReadingId(), isNew: true, title: '', author: '', series: '', seriesNumber: '', gradeLevel: '',
    genre: [], questions: [],
  };
  state.assignErr = ''; state.assignNote = '';
  paintAssign();
}

function startEditReadingBook(key) {
  const b = readingMergedCatalog(state.snapshots[0]).find((x) => x.key === key);
  if (!b) return;
  state.readingEditor = {
    key: b.key, isNew: false, title: b.title, author: b.author || '',
    series: b.series || '', seriesNumber: b.seriesNumber || '', gradeLevel: b.gradeLevel || '',
    genre: [...(b.genre || [])],
    questions: (b.questions || []).map((q) => ({ id: q.id, q: q.q, correct: q.correct, wrong: [...(q.wrong || [])] })),
  };
  state.assignErr = ''; state.assignNote = '';
  paintAssign();
}

function cancelReadingEdit() { state.readingEditor = null; state.assignErr = ''; paintAssign(); }

function deleteReadingBook(key, title) {
  const revertsToBundled = !!(state.readingCatalog && state.readingCatalog[key]);
  const msg = revertsToBundled
    ? `Remove your changes to "${title}"? It reverts to the version that shipped with the app.`
    : `Delete "${title}" from the catalog? This can't be undone.`;
  if (!confirm(msg)) return;
  sendCommand('delete-book', { key }, `Removed “${title}”.`);
}

// Pulls current field values out of the DOM into the in-memory editor before
// a repaint (adding/removing a question row) would otherwise wipe them.
function syncReadingEditorFromDom() {
  const ed = state.readingEditor;
  if (!ed) return;
  const val = (id) => document.getElementById(id)?.value ?? '';
  ed.title = val('rbTitle').trim();
  ed.author = val('rbAuthor').trim();
  ed.series = val('rbSeries').trim();
  ed.seriesNumber = val('rbSeriesNum');
  ed.gradeLevel = val('rbGradeLevel').trim();
  ed.genre = [...document.querySelectorAll('.rbGenre:checked')].map((el) => el.value);
  ed.questions.forEach((q, i) => {
    q.q = val(`rbQ${i}text`).trim();
    q.correct = val(`rbQ${i}correct`).trim();
    q.wrong = [0, 1, 2].map((j) => val(`rbQ${i}wrong${j}`).trim());
  });
}

function addReadingQuestionRow() {
  syncReadingEditorFromDom();
  state.readingEditor.questions.push({ id: mintReadingId(), q: '', correct: '', wrong: ['', '', ''] });
  paintAssign();
}
function removeReadingQuestionRow(idx) {
  syncReadingEditorFromDom();
  state.readingEditor.questions.splice(idx, 1);
  paintAssign();
}

function renderReadingEditor(child, snapshot) {
  const ed = state.readingEditor;
  const merged = readingMergedCatalog(snapshot);
  const seriesNames = [...new Set(merged.map((b) => b.series).filter(Boolean))].sort();

  const genreBoxes = READING_GENRE_VOCAB.map((g) => `
    <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text);padding:2px 0">
      <input type="checkbox" class="rbGenre" value="${g}" ${ed.genre.includes(g) ? 'checked' : ''} style="width:auto;margin:0">
      ${g.replace(/-/g, ' ')}
    </label>`).join('');

  const qRows = ed.questions.map((q, i) => `
    <div class="card" style="background:var(--bg);margin-bottom:8px">
      <div class="row" style="justify-content:space-between;align-items:center">
        <strong>Question ${i + 1}</strong>
        <button class="link" style="color:var(--danger)" onclick="removeReadingQuestionRow(${i})">Remove</button>
      </div>
      <label for="rbQ${i}text">Question</label>
      <textarea id="rbQ${i}text" rows="2">${esc(q.q)}</textarea>
      <label for="rbQ${i}correct">Correct answer</label>
      <input type="text" id="rbQ${i}correct" value="${esc(q.correct)}">
      <label>Wrong answers</label>
      ${[0, 1, 2].map((j) => `<input type="text" id="rbQ${i}wrong${j}" value="${esc(q.wrong[j] || '')}" placeholder="Wrong answer ${j + 1}">`).join('')}
    </div>`).join('');

  return `
    <div class="card">
      <h2>${ed.isNew ? 'Add a book' : 'Edit book'}</h2>
      <label for="rbTitle">Title</label>
      <input type="text" id="rbTitle" value="${esc(ed.title)}" placeholder="Book title">
      <label for="rbAuthor">Author (optional)</label>
      <input type="text" id="rbAuthor" value="${esc(ed.author)}" placeholder="Author">
      <label for="rbSeries">Series (optional)</label>
      <input type="text" id="rbSeries" list="rbSeriesList" value="${esc(ed.series)}" placeholder="Series name, if any">
      <datalist id="rbSeriesList">${seriesNames.map((s) => `<option value="${esc(s)}">`).join('')}</datalist>
      <label for="rbSeriesNum">Book number in series (optional)</label>
      <input type="number" id="rbSeriesNum" min="1" value="${esc(String(ed.seriesNumber || ''))}">
      <label for="rbGradeLevel">Grade level band (optional, e.g. 4-6)</label>
      <input type="text" id="rbGradeLevel" value="${esc(ed.gradeLevel)}" placeholder="e.g. 4-6">
      <label>Genre (optional, pick any that fit)</label>
      ${genreBoxes}
      <div style="margin-top:14px">
        <div style="font-weight:700;margin-bottom:4px">Quiz questions (optional)</div>
        <p class="muted" style="margin-top:0">Editing a question's wording keeps it linked to any past results for it. To replace one so old results stop counting toward it, remove it and add a fresh one instead.</p>
        ${qRows}
        <button class="outline" onclick="addReadingQuestionRow()">+ Add a question</button>
      </div>
      <div class="row" style="margin-top:16px">
