        <button class="big green" onclick="saveReadingBook()">Send to the tablet</button>
        <button class="outline" onclick="cancelReadingEdit()">Cancel</button>
      </div>
    </div>`;
}

function saveReadingBook() {
  syncReadingEditorFromDom();
  const ed = state.readingEditor;
  if (!ed.title) return setAssignError('Give the book a title.');
  for (const q of ed.questions) {
    if (!q.q || !q.correct || q.wrong.some((w) => !w)) {
      return setAssignError("Each question needs its text, a correct answer, and three wrong answers — remove any you don't want.");
    }
  }
  const merged = readingMergedCatalog(state.snapshots[0]);
  const book = {
    key: ed.key, title: ed.title, author: ed.author,
    series: ed.series || null, seriesKey: readingSeriesKeyFor(ed.series, merged),
    seriesNumber: ed.seriesNumber ? Number(ed.seriesNumber) : null,
    gradeLevel: ed.gradeLevel || null, genre: ed.genre,
    questions: ed.questions.map((q) => ({ id: q.id, q: q.q, correct: q.correct, wrong: q.wrong })),
  };
  state.readingEditor = null;
  const qCount = book.questions.length;
  sendCommand('assign-book', { book }, `Sent “${book.title}”${qCount ? ` — ${qCount} question${qCount === 1 ? '' : 's'}` : ''}.`);
}

// Human-readable summary of a queued command, for the "Sent recently" card.
// Falls back to the raw kind so a command from a newer parent build still
// shows up as something rather than vanishing.
function describeCommand(cmd) {
  const p = cmd.payload || {};
  if (cmd.kind === 'assign-list') return `New list “${p.list?.name || '?'}” (${(p.list?.words || []).length} words)`;
  if (cmd.kind === 'set-active-list') return 'Switch the assigned list';
  if (cmd.kind === 'reorder-lists') return `Reorder lists (${(p.order || []).length})`;
  if (cmd.kind === 'assign-focus') return `New focus area “${p.focus?.name || '?'}”`;
  if (cmd.kind === 'set-active-focus') return 'Switch the assigned focus area';
  if (cmd.kind === 'delete-session') return `Delete ${(p.sessionIds || []).length} session${(p.sessionIds || []).length === 1 ? '' : 's'}`;
  if (cmd.kind === 'assign-book') return `Book “${p.book?.title || '?'}”${(p.book?.questions || []).length ? ` (${p.book.questions.length} question${p.book.questions.length === 1 ? '' : 's'})` : ''}`;
  if (cmd.kind === 'delete-book') return 'Remove a book from the catalog';
  if (cmd.kind === 'set-reading-support-level') return `Reading support level → “${(READING_SUPPORT_LEVELS.find((l) => l.v === p.level) || {}).label || p.level}”`;
  return cmd.kind;
}

function renderQueueCard() {
  // One command is queued per child id (§6.2), so a merged child produces
  // duplicates that are the same instruction. Collapse them by kind+time and
  // keep every id, so Cancel cancels the whole thing.
  const groups = new Map();
  for (const cmd of state.commands) {
    const key = cmd.kind + ':' + cmd.createdAt + ':' + JSON.stringify(cmd.payload);
    if (!groups.has(key)) groups.set(key, { ...cmd, ids: [] });
    const g = groups.get(key);
    g.ids.push(cmd.id);
    g.ackCount = Math.max(g.ackCount, cmd.ackCount);
    g.canceled = g.canceled && cmd.canceled;
  }

  const rows = [...groups.values()].slice(0, 12).map((cmd) => {
    const status = cmd.canceled
      ? '<span class="badge off">Canceled</span>'
      : cmd.ackCount
        ? `<span class="badge ok">Delivered ${fmtRelative(cmd.firstAppliedAt)}</span>`
        : '<span class="badge warn">Waiting for the tablet</span>';
    const action = !cmd.canceled && !cmd.ackCount
      ? `<button class="link" onclick="${esc(`cancelCommand(${JSON.stringify(cmd.ids)})`)}">Cancel</button>`
      : '';
    return `<tr>
      <td>${esc(describeCommand(cmd))}<br><span class="muted">${esc(fmtDateTime(new Date(cmd.createdAt).toISOString()))}</span></td>
      <td>${status}</td>
      <td>${action}</td>
    </tr>`;
  }).join('');

  return `
    <div class="card">
      <h2>Sent recently</h2>
      <p class="muted">Anything still waiting can be canceled — once a tablet has applied it, undoing means sending something new.</p>
      <table>
        <tbody>${rows || '<tr><td class="muted">Nothing sent yet.</td></tr>'}</tbody>
      </table>
    </div>`;
}

// Each line is `word` or `word, hint, sentence` — deliberately the same shape
// the tablet's own CSV import accepts, so a parent with a list in a spreadsheet
// can paste it straight in. The tablet fills the same defaults for a bare word
// that typing it into the parent area would.
function parseWordLines(text) {
  return String(text || '').split(/\r?\n/).map((line) => {
    const [word, hint, sentence] = line.split(',').map((s) => s.trim());
    return word ? { word, hint: hint || '', sentence: sentence || '' } : null;
  }).filter(Boolean);
}

async function sendNewList() {
  const name = document.getElementById('newListName').value.trim();
  const words = parseWordLines(document.getElementById('newListWords').value);
  const bonus = parseWordLines(document.getElementById('newListBonus').value);
  const grade = document.getElementById('newListGrade')?.value || undefined;
  if (!name) return setAssignError('Give the list a name.');
  if (!words.length && !bonus.length) return setAssignError('Add at least one word.');
  // Grade travels with the list because it is half of its identity on the
  // tablet: the app matches an incoming list on name *and* grade, so that
  // sending "Unit 1" for a new year adds a list rather than overwriting last
  // year's (§16).
  await sendCommand('assign-list', { list: { name, grade, words, bonus }, makeActive: document.getElementById('newListActive').checked },
    `Sent “${name}”${grade ? ` for Grade ${grade}` : ''} — ${words.length + bonus.length} word${words.length + bonus.length === 1 ? '' : 's'}.`);
}

async function sendNewFocus() {
  const name = document.getElementById('newFocusName').value.trim();
  const categories = [...document.querySelectorAll('.newFocusCat:checked')].map((el) => el.value);
  if (!name) return setAssignError('Give the focus area a name.');
  if (!categories.length) return setAssignError('Pick at least one category.');
  await sendCommand('assign-focus', { focus: { name, categories }, makeActive: document.getElementById('newFocusActive').checked },
    `Sent “${name}”.`);
}

function setAssignError(message) {
  state.assignErr = message;
  state.assignNote = '';
  paintAssign();
}

async function sendCommand(kind, payload, note) {
  const child = state.children.find((c) => c.id === state.detailChildId);
  const appDef = APPS.find((a) => a.id === state.detailApp) || APPS[0];
  if (!child) return;
  state.assignErr = '';
  try {
    await api('/commands', { method: 'POST', body: { app: appDef.id, childIds: child.ids, kind, payload } });
    state.assignNote = note || 'Sent.';
    await renderAssign();
  } catch (err) {
    setAssignError(err.message);
  }
}

async function cancelCommand(ids) {
  try {
    await api('/commands/cancel', { method: 'POST', body: { commandIds: ids } });
    state.assignNote = '';
    await renderAssign();
  } catch (err) {
    setAssignError(err.message);
  }
}

// ---------- Plan (targets and assignments, assignment-spec.md §4, §11) ----------
//
// The one screen that says how MUCH work is owed, as against Assign's what.
// The two are deliberately different questions: Assign points a child at a
// list, this counts sittings, and neither gates anything — every button in
// every app stays as live as it was (§8.2).
//
// Progress is never stored and never reported by a client (§3, §10.1). It is
// recounted here, from the same 90 days the Dashboard already downloaded,
// with the same evaluator the tablet will run. There is no progress field to
// get out of sync, and no reconciliation to get wrong.
//
// Only the three synced apps are offered (§11, §14): a target for an app the
// phone cannot verify would be a row that never fills in.

// A new item's id has to survive every later revision, because "she has missed
// her Friday test three weeks running" is a question about one item over time
// (§4.2). So it is opaque and random rather than derived from the label —
// derived identity is what docs/reading-star-spec-review.md catches going wrong
// three separate times, and renaming a target must not silently start a new
// history.
function newPlanItemId() {
  return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

async function renderPlan() {
  const appEl = document.getElementById('app');
  appEl.innerHTML = '<div class="empty">Loading…</div>';
  try {
    await ensureChildren();
    await ensureFamilySettings();
    if (!state.children.length) {
      appEl.innerHTML = `<div class="card empty">No children synced yet.<br><br>
        <button onclick="showView('devices')">Go to Devices to add one</button></div>`;
      return;
    }
    if (!state.children.some((c) => c.id === state.detailChildId)) state.detailChildId = state.children[0].id;
    const child = state.children.find((c) => c.id === state.detailChildId);

    // The plan and the history it is counted against. Snapshots come too, so
    // the editor's scope picker offers the lists and focus areas the tablet
    // actually reported rather than a second copy of either app's model.
    const [plan] = await Promise.all([
      api('/plan?' + childQuery(child)),
      loadSessions(),
      loadPlanSnapshots(child),
    ]);
    state.plan = plan;
    paintPlan();
  } catch (err) {
    appEl.innerHTML = `<div class="card error">${esc(err.message)}</div>`;
  }
}

// Spelling and Math only. Reading's sessions carry a bookId from the child's
// own shelf, while child_state reports the catalog — two different id spaces,
// so offering catalog keys as a scope would compose a target that matches
// nothing. §11 asks for "the lists and focus areas the tablet actually has",
// which is exactly the pair where the ids line up.
const SCOPED_APPS = ['spelling', 'math'];

async function loadPlanSnapshots(child) {
  state.planSnapshots = {};
  await Promise.all(SCOPED_APPS.map(async (appId) => {
    try {
      const res = await api('/child-state?' + childQuery(child) + '&app=' + appId);
      // Freshest wins: two tablets can both report, and the server hands them
      // back newest-first.
      state.planSnapshots[appId] = (res.snapshots || [])[0] || null;
    } catch {
      // A missing snapshot costs the scope picker for that app and nothing
      // else. The rest of the plan still edits and still counts.
      state.planSnapshots[appId] = null;
    }
  }));
}

function selectPlanChild(id) {
  state.detailChildId = id;
  state.planEditor = null; state.planErr = ''; state.planNote = '';
  renderPlan();
}

// What a scoped target can name, per app, straight from the tablet's own
// report (§15.4).
function planScopeOptions(appId) {
  const snapshot = state.planSnapshots[appId];
  if (!snapshot || !snapshot.state) return [];
  if (appId === 'spelling') return (snapshot.state.lists || []).map((l) => ({ id: l.id, name: l.name }));
  if (appId === 'math') return (snapshot.state.focusAreas || []).map((f) => ({ id: f.id, name: f.name }));
  return [];
}

function planScopeName(appId, scopeId) {
  const found = planScopeOptions(appId).find((o) => o.id === scopeId);
  return found ? found.name : scopeId;
}

// The item's match, in a sentence a parent reads rather than a shape they
// decode.
function planMatchLabel(item) {
  const match = item.match || {};
  const appLabel = match.app
    ? (APPS.find((a) => a.id === match.app) || { label: match.app }).label
    : 'Any app';
  const modes = (match.modes || []).map((m) => modeInfo(match.app, m).label);
  const modeLabel = modes.length ? modes.join(' or ') : 'Any sitting that counts as work';
  const scope = match.scopeId ? ' · ' + planScopeName(match.app, match.scopeId) : '';
  return appLabel + ' · ' + modeLabel + scope;
}

function planPeriodLabel(period) {
  if (period === 'day') return 'every day';
  if (period === 'week') return 'a week';
  if (period && period.from) return 'between ' + period.from + ' and ' + period.to;
  return '';
}

// Every session the evaluator needs, normalized to the shape it expects and
// flattened across apps — a cross-app target counts sittings from all three at
// once (§4).
//
// scopeId is derived here rather than returned by /api/sessions, which hands
// back the payload the client pushed. It has to mirror sessionScope() in
// functions/api/sync.js exactly, because that is what filled the scope_id
// column a future aggregate will match on (§4.1).
function planSessions(child) {
  const out = [];
  for (const a of APPS) {
    for (const s of state.sessionsByKey[child.id + ':' + a.id] || []) {
      out.push({
        id: s.id,
        deviceId: s.deviceId,
        at: Date.parse(s.date),
        localDate: s.localDate || null,
        app: a.id,
        mode: s.mode,
        scopeId: a.id === 'spelling' ? (s.listId || null)
          : a.id === 'math' ? (s.focusId || null)
            : (s.bookId || null),
      });
    }
  }
  return out;
}

function paintPlan() {
  const child = state.children.find((c) => c.id === state.detailChildId);
  const childOptions = state.children
    .map((c) => `<option value="${esc(c.id)}"${c.id === child.id ? ' selected' : ''}>${esc(c.name || 'Unnamed')}</option>`)
    .join('');

  const picker = `
    <div class="card picker">
      <label for="planChildSel">Plan for:</label>
      <select id="planChildSel" onchange="selectPlanChild(this.value)">${childOptions}</select>
      <p class="muted" style="margin:6px 0 0">Counted in ${state.family.timezone ? esc(state.family.timezone) : 'no timezone yet'},
        weeks starting ${state.family.weekStart === 1 ? 'Monday' : 'Sunday'}.
        <button class="link" onclick="showView('devices')">Change</button></p>
    </div>`;

  const notes = `
    ${state.planNote ? `<div class="card" style="background:var(--green-soft);border-color:var(--green)"><strong>${esc(state.planNote)}</strong><div class="muted" style="margin-top:4px">It reaches the tablet on its next sync — no tablet needs to be on right now.</div></div>` : ''}
    ${state.planErr ? `<div class="card error">${esc(state.planErr)}</div>` : ''}`;

  // §9, and the reason it is a hard stop rather than a warning: with no family
  // timezone, /api/sync hands down no plan document at all, no session is ever
  // stamped with a local date, and every bar here would read 0 of 3 forever
  // with nothing visibly wrong. Better to ask for the one setting that makes
  // all three work.
  if (!state.family.timezone) {
    document.getElementById('app').innerHTML = `${picker}
      <div class="card">
        <h2>Set the family's timezone first</h2>
        <p class="muted">A target counts sittings inside a day or a week, and those need a timezone
          to be days and weeks at all. Until one is set, tablets record the exact time of a sitting
          but not which day it belongs to.</p>
        <button class="big" onclick="showView('devices')">Open Devices to set it</button>
      </div>`;
    return;
  }

  if (state.planEditor) {
    document.getElementById('app').innerHTML = picker + notes + renderPlanEditor(child);
    return;
  }

  const items = (state.plan && state.plan.items) || [];
  const sessions = planSessions(child);
  const ctx = { timezone: state.family.timezone, weekStart: state.family.weekStart, now: Date.now() };

  const byApp = new Map();
  for (const item of items) {
    const key = (item.match && item.match.app) || '';
    if (!byApp.has(key)) byApp.set(key, []);
    byApp.get(key).push(item);
  }

  // Cross-app targets first — they are the frame the per-app ones sit inside.
  const groups = [...byApp.keys()].sort((a, b) => (a === '' ? -1 : b === '' ? 1 : a.localeCompare(b)));

  const body = items.length
    ? groups.map((appId) => `
        <div class="card">
          <h2>${appId ? esc((APPS.find((a) => a.id === appId) || { label: appId }).label) : 'Across every app'}</h2>
          ${byApp.get(appId).map((item) => renderPlanItem(item, sessions, ctx)).join('')}
        </div>`).join('')
    : `<div class="card empty">No targets for ${esc(child.name || 'this child')} yet.<br><br>
        <span class="muted">A target says how much work is owed — "3 spelling practices a week."
        It never blocks anything; it only shows what is done and what is left.</span></div>`;

  document.getElementById('app').innerHTML = `${picker}${notes}${body}
    <div class="card">
      <button class="big" onclick="startPlanItem()">Add a target</button>
      ${renderPlanCopy(child)}
    </div>`;
}

function renderPlanItem(item, sessions, ctx) {
  const result = evaluateItem(item, sessions, ctx);
  const pct = result.count ? Math.min(100, Math.round((result.done / result.count) * 100)) : 0;

  // §10.4: no judgment until the period closes. A red badge on Monday morning
  // for every weekly target is a badge everyone has learned to ignore by
  // Wednesday, so mid-period this shows the count and the time left and stops
  // there. "Met" is worth saying as soon as it is true — that is not a verdict
  // on a child, it is the good news.
  const status = result.met
    ? '<span class="badge ok">Met</span>'
    : result.closed
      ? '<span class="badge warn">Not met</span>'
      : `<span class="muted">${result.daysLeft === 0 ? 'last day' : result.daysLeft + ' day' + (result.daysLeft === 1 ? '' : 's') + ' left'}</span>`;

  return `<div class="plan-item">
    <div class="plan-item-head">
      <div>
        <strong>${esc(item.label)}</strong>
        <div class="muted">${esc(planMatchLabel(item))}</div>
      </div>
      <div style="white-space:nowrap">
        <button class="outline" onclick="${esc(`startPlanItem(${JSON.stringify(item.id)})`)}">Edit</button>
        <button class="link" style="color:var(--danger)" onclick="${esc(`removePlanItem(${JSON.stringify(item.id)}, ${JSON.stringify(item.label)})`)}">Remove</button>
      </div>
    </div>
    <div class="bar${result.met ? ' met' : ''}"><span style="width:${pct}%"></span></div>
    <div class="plan-item-foot">
      <span><strong>${result.done} of ${result.count}</strong> ${esc(planPeriodLabel(item.period))}</span>
      ${status}
    </div>
  </div>`;
}

// §11: most families want one plan with small per-child differences, and
// re-composing it by hand is the kind of chore that stops a feature being used.
function renderPlanCopy(child) {
  const siblings = state.children.filter((c) => c.id !== child.id);
  if (!siblings.length) return '';
  const options = siblings.map((c) => `<option value="${esc(c.id)}">${esc(c.name || 'Unnamed')}</option>`).join('');
  return `
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line)">
      <label for="planCopyFrom">Or copy every target from</label>
      <select id="planCopyFrom">${options}</select>
      <button class="outline" onclick="copyPlanFromSibling()">Copy${state.plan && state.plan.items.length ? ' (replaces what is here)' : ''}</button>
    </div>`;
}

// ---------- The item editor ----------

function startPlanItem(itemId) {
  const existing = ((state.plan && state.plan.items) || []).find((i) => i.id === itemId);
  state.planErr = ''; state.planNote = '';
  state.planEditor = existing
    ? {
      id: existing.id,
      isNew: false,
      label: existing.label,
      app: (existing.match && existing.match.app) || '',
      modes: (existing.match && existing.match.modes) || [],
      scopeId: (existing.match && existing.match.scopeId) || '',
      count: existing.count,
      // A dated period is composed in §17 step 5. One that already exists is
      // carried through an edit untouched rather than silently flattened to a
      // week — this editor can change an item's label and count without being
      // able to author its period kind.
      period: existing.period,
    }
    : { id: newPlanItemId(), isNew: true, label: '', app: 'spelling', modes: [], scopeId: '', count: 3, period: 'week' };
  paintPlan();
}

function cancelPlanItem() { state.planEditor = null; state.planErr = ''; paintPlan(); }

// Only the app picker repaints, and the restraint is load-bearing rather than
// an optimization. A repaint replaces the whole card, including the Save button
// — so a field that repaints on `change` destroys that button during the blur
// that tapping Save causes, and the tap lands on nothing. The parent taps Save,
// watches the count update, and has to tap it again.
//
// Changing the app is the one edit that has to repaint, because the mode
// checkboxes and the scope picker are both composed from it. It is also safe to:
// a <select> fires `change` on choosing, not on blur, so the tap that caused it
// is already finished.
function setPlanLabel(value) { if (state.planEditor) state.planEditor.label = value; }
function setPlanScope(value) { if (state.planEditor) state.planEditor.scopeId = value; }
function setPlanPeriod(value) { if (state.planEditor) state.planEditor.period = value; }

// Clamped, then written back to the field, because the alternative is a box
// reading 0 while the target it saves is 1.
function setPlanCount(el) {
  if (!state.planEditor) return;
  state.planEditor.count = Math.max(1, Math.min(50, Math.round(Number(el.value)) || 1));
  el.value = state.planEditor.count;
}

function setPlanApp(value) {
  const ed = state.planEditor;
  if (!ed) return;
  ed.app = value;
  // Modes and scopes belong to an app. Keeping them across a switch would
  // compose a target matching a mode the new app does not have.
  ed.modes = []; ed.scopeId = '';
  paintPlan();
}

function togglePlanMode(mode, on) {
  const ed = state.planEditor;
  if (!ed) return;
  ed.modes = on ? [...new Set([...ed.modes, mode])] : ed.modes.filter((m) => m !== mode);
  paintPlan();
}

function renderPlanEditor(child) {
  const ed = state.planEditor;
  const appOptions = [{ id: '', label: 'Any app' }, ...APPS]
    .map((a) => `<option value="${esc(a.id)}"${a.id === ed.app ? ' selected' : ''}>${esc(a.label)}</option>`)
    .join('');

  // Only the chosen app's modes, and only ones that count as work by default.
  // A play mode is still targetable — it just has to be asked for by name,
  // which is what §5's rule means in practice.
  const modeRows = ed.app
    ? Object.keys(MODES[ed.app] || {}).map((mode) => {
      const info = modeInfo(ed.app, mode);
      const on = ed.modes.includes(mode);
      return `<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text);padding:3px 0">
          <input type="checkbox" class="planMode" value="${esc(mode)}" ${on ? 'checked' : ''}
            onchange="togglePlanMode(${esc(JSON.stringify(mode))}, this.checked)" style="width:auto;margin:0">
          ${esc(info.label)} ${countsAsWork(ed.app, mode) ? '' : '<span class="badge tone-' + info.tone + '">not counted unless named</span>'}
        </label>`;
    }).join('')
    : '<p class="muted">Pick an app to choose particular sittings. Across every app, a target counts every sitting that counts as work.</p>';

  const scopes = ed.app ? planScopeOptions(ed.app) : [];
  // A scope the tablet no longer reports still gets an option of its own,
  // rather than being left out. Leaving it out would drop the <select> back to
  // "Any" while the item still carried the old id — the screen would say one
  // thing and the saved target would mean another.
  const orphan = ed.scopeId && !scopes.some((o) => o.id === ed.scopeId);
  const scopePicker = scopes.length ? `
    <label for="planScopeSel">${esc(scopeColumnLabel(ed.app, true))}</label>
    <select id="planScopeSel" onchange="setPlanScope(this.value)">
      <option value=""${ed.scopeId ? '' : ' selected'}>Any</option>
      ${scopes.map((o) => `<option value="${esc(o.id)}"${o.id === ed.scopeId ? ' selected' : ''}>${esc(o.name)}</option>`).join('')}
      ${orphan ? `<option value="${esc(ed.scopeId)}" selected>No longer on the tablet</option>` : ''}
    </select>
    <p class="muted" style="margin:-4px 0 12px">From ${esc(child.name || 'the child')}'s tablet, so this is what it actually has.</p>`
    : ed.app && SCOPED_APPS.includes(ed.app)
      ? `<p class="muted">${esc(child.name || 'This child')}'s tablet hasn't reported its ${esc(scopeColumnLabel(ed.app, true).toLowerCase())}s yet, so this target counts any of them.</p>`
      : '';

  const dated = ed.period && typeof ed.period === 'object';

  return `
    <div class="card">
      <h2>${ed.isNew ? 'Add a target' : 'Edit a target'}</h2>

      <label for="planLabelIn">What to call it</label>
      <input type="text" id="planLabelIn" maxlength="80" value="${esc(ed.label)}"
        placeholder="e.g. Spelling practice" oninput="setPlanLabel(this.value)">

      <label for="planAppSel">App</label>
      <select id="planAppSel" onchange="setPlanApp(this.value)">${appOptions}</select>

      <label>Which sittings ${ed.modes.length ? '' : '<span class="muted" style="font-weight:400">— none picked, so any that counts as work</span>'}</label>
      ${modeRows}

      ${scopePicker}

      <div class="row" style="margin-top:12px">
        <div class="col">
          <label for="planCountIn">How many</label>
          <input type="text" id="planCountIn" inputmode="numeric" value="${esc(ed.count)}"
            onchange="setPlanCount(this)">
        </div>
        <div class="col">
          <label for="planPeriodSel">Per</label>
          ${dated
            ? `<p style="margin:0 0 10px">${esc(planPeriodLabel(ed.period))}</p>`
            : `<select id="planPeriodSel" onchange="setPlanPeriod(this.value)">
                <option value="week"${ed.period === 'week' ? ' selected' : ''}>Week</option>
                <option value="day"${ed.period === 'day' ? ' selected' : ''}>Day</option>
              </select>`}
        </div>
      </div>

      <p class="muted">A target never blocks anything. ${esc(child.name || 'They')} can always do more, and
        is never locked out for having done less.</p>

      <div class="row" style="margin-top:8px">
        <button class="big" onclick="savePlanItem()"${state.planBusy ? ' disabled' : ''}>${state.planBusy ? 'Saving…' : 'Save'}</button>
        <button class="outline" onclick="cancelPlanItem()">Cancel</button>
      </div>
    </div>`;
}

// ---------- Writes ----------

function planItemFromEditor(ed) {
  return {
    id: ed.id,
    label: ed.label.trim(),
    match: {
      app: ed.app || null,
      modes: ed.modes.length ? ed.modes : null,
      scopeId: ed.scopeId || null,
    },
    count: ed.count,
    period: ed.period,
  };
}

async function savePlanItem() {
  const ed = state.planEditor;
  if (!ed) return;
  if (!ed.label.trim()) { state.planErr = 'Give the target a name.'; paintPlan(); return; }

  const items = [...((state.plan && state.plan.items) || [])];
  const item = planItemFromEditor(ed);
  const at = items.findIndex((i) => i.id === item.id);
  // Replaced in place, keeping its id and its position (§4.2): editing an
  // item's count is an edit to that item, not a new one that happens to read
  // the same.
  if (at === -1) items.push(item); else items[at] = item;

  await savePlan(items, ed.isNew ? `Added “${item.label}”` : `Updated “${item.label}”`);
}

async function removePlanItem(itemId, label) {
  if (!confirm(`Remove “${label}”? Nothing a child has already done is affected — this only stops counting it.`)) return;
  const items = ((state.plan && state.plan.items) || []).filter((i) => i.id !== itemId);
  await savePlan(items, `Removed “${label}”`);
}

async function copyPlanFromSibling() {
  const fromId = document.getElementById('planCopyFrom').value;
  const from = state.children.find((c) => c.id === fromId);
  if (!from) return;
  if (!confirm(`Copy every target from ${from.name || 'them'}? This replaces the targets on this screen.`)) return;

  state.planErr = ''; state.planNote = '';
  try {
    const theirs = await api('/plan?' + childQuery(from));
    if (!(theirs.items || []).length) { state.planErr = `${from.name || 'They'} have no targets to copy.`; paintPlan(); return; }

    // A list or focus area belongs to one child's tablet: two siblings can hold
    // the same built-in id and their own ids for everything they added since.
    // So a scope survives the copy only if this child's tablet has reported it,
    // and is otherwise widened to "any" rather than carried across — a target
    // scoped to a list this child does not have would never fill in, and would
    // look like the evaluator was broken rather than like the copy was.
    let loosened = 0;
    const items = (theirs.items || []).map((i) => {
      const match = { ...(i.match || {}) };
      if (match.scopeId && !planScopeOptions(match.app).some((o) => o.id === match.scopeId)) {
        match.scopeId = null;
        loosened += 1;
      }
      // Fresh ids: two children's targets are two separate histories, and
      // sharing an id would make "has she missed her Friday test three weeks
      // running" a question about both of them at once (§4.2).
      return { ...i, id: newPlanItemId(), match };
    });

    const note = `Copied ${items.length} target${items.length === 1 ? '' : 's'} from ${from.name || 'them'}`;
    await savePlan(items, loosened
      ? `${note}. ${loosened} of them counted any list or focus area, since this tablet has its own.`
      : note);
  } catch (err) {
    state.planErr = err.message;
    paintPlan();
  }
}

// One write path for every edit: the plan is a document revised in place, not
// a set of per-item operations (§6). The server allocates the revision, so two
// phones editing at once resolve to last-write-wins rather than to a silently
// lost edit.
async function savePlan(items, note) {
  const child = state.children.find((c) => c.id === state.detailChildId);
  if (!child) return;
  state.planBusy = true; state.planErr = '';
  paintPlan();
  try {
    const saved = await api('/plan', { method: 'PUT', body: { childIds: child.ids, items } });
    state.plan = { ...state.plan, revision: saved.revision, items: saved.items };
    state.planEditor = null;
    state.planNote = note;
  } catch (err) {
    state.planErr = err.message;
  } finally {
    state.planBusy = false;
  }
  paintPlan();
}

// ---------- Devices ----------
let pairingTimer = null;

async function renderDevices() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const [{ devices }, { children: synced }] = await Promise.all([
      api('/devices'), api('/children'), ensureFamilySettings(),
      state.migrations ? Promise.resolve() : loadMigrationStatus(),
    ]);
    const children = mergeChildren(synced);
    const rows = devices.map((d) => {
      const isSelf = d.id === state.sync.deviceId;
      const quiet = !d.revoked && d.last_seen && (Date.now() - d.last_seen) > 7 * 86400000;
      const status = d.revoked
        ? '<span class="badge off">Revoked</span>'
        : quiet ? '<span class="badge warn">Quiet 7+ days</span>' : '<span class="badge ok">Active</span>';
      return `<tr>
        <td>${esc(d.label || '(unnamed)')}${isSelf ? ' <span class="muted">(this phone)</span>' : ''}</td>
        <td>${d.role}</td>
        <td>${fmtRelative(d.last_seen)}</td>
        <td>${status}</td>
        <td>${d.revoked || isSelf ? '' : `<button class="danger" onclick="revokeDevice('${d.id}')">Revoke</button>`}</td>
      </tr>`;
    }).join('');

    app.innerHTML = `
      <div class="card">
        <h2>Add a device</h2>
        <p class="muted">Generates a 6-character code, valid ~10 minutes, single use.</p>
        <div class="row">
          <div class="col">
            <label for="roleSelect">Device type</label>
            <select id="roleSelect" onchange="onDeviceRoleChange()">
              <option value="child">Child's tablet</option>
              <option value="parent">Another parent phone</option>
            </select>
          </div>
        </div>
        <div class="row" id="childPickerRow">
          <div class="col">
            <label for="childSelect">Which child is this device for?</label>
            <select id="childSelect" onchange="onChildSelectChange()">
              ${children.map((c) => `<option value="${esc(c.id)}">${esc(c.name || '(unnamed)')}</option>`).join('')}
              <option value="__new__">New child…</option>
            </select>
            <input type="text" id="newChildNameIn" placeholder="Child's name" style="display:none;margin-top:6px">
          </div>
        </div>
        <button onclick="mintPairingCode()">Generate code</button>
        <div id="pairingCodeArea"></div>
        <p class="muted" style="margin-top:8px">On the child's tablet: open Spelling Star or Math Star → parent area → "Sync to my phone" → enter the code. On another parent phone: open this page and use "Add this phone."</p>
      </div>
      <div class="card">
        <h2>Devices</h2>
        <table>
          <thead><tr><th>Label</th><th>Role</th><th>Last active</th><th>Status</th><th></th></tr></thead>
          <tbody>${rows || '<tr><td colspan="5" class="muted">No devices yet.</td></tr>'}</tbody>
        </table>
      </div>
      ${familySettingsCardHtml()}
      ${migrationsCardHtml()}`;
    onChildSelectChange();
  } catch (err) {
    app.innerHTML = `<div class="card error">${esc(err.message)}</div>`;
  }
}

// The schema ships as numbered schema-phaseN.sql files, applied from here.
// Nothing to do in the D1 console and no wrangler command — the same move the
// Scheduling App made, for the same reason: a migration you have to remember
// to run from a terminal is a migration that gets run late, and this one goes
// wrong quietly (a tablet's /api/sync 500s, and §3 rule 1 hides that from the
// child).
function migrationsCardHtml() {
  const m = state.migrations;
  if (!m) {
    return `<div class="card">
      <h2>Database</h2>
      <p class="muted">Could not read the migration status.
      <button onclick="refreshMigrations()">Try again</button></p>
    </div>`;
  }
  const rows = m.migrations.map((row) => `<tr>
    <td>${esc(row.name)}</td>
    <td>${row.applied ? '<span class="badge ok">applied</span>' : '<span class="badge warn">pending</span>'}</td>
  </tr>`).join('');

  return `<div class="card">
    <h2>Database</h2>
    <p class="muted">${m.pending} pending of ${m.migrations.length}.
    Applying is safe to repeat — anything already in the database is reported as
    already present and left alone.</p>
    <table><tbody>${rows}</tbody></table>
    <button${state.migrationsBusy ? ' disabled' : ''} onclick="applyMigrations()">
      ${state.migrationsBusy ? 'Applying…' : 'Apply pending migrations'}
    </button>
    <div id="migrationsNote">${state.migrationsNote}</div>
    <p class="muted" style="margin-top:8px">If this page ever will not load, the same
    thing is at <code>/admin/migrations</code>, which runs no JavaScript and asks for
    the signup secret instead.</p>
  </div>`;
}

async function refreshMigrations() {
  await loadMigrationStatus();
  renderDevices();
}

// The note lives in state rather than being poked into the DOM afterwards:
// renderDevices() is async and repaints the whole view, so anything written to
// #migrationsNote before it settles is written to an element that does not
// exist yet — and anything written after is erased by the next repaint.
async function applyMigrations() {
  state.migrationsBusy = true;
  state.migrationsNote = '';
  await renderDevices();

  try {
    const result = await api('/migrations', { method: 'POST', body: {} });
    state.migrations = { migrations: result.migrations, pending: result.pending };
    if (result.failed) {
      // Named, not swallowed: a migration that stopped part-way is the one case
      // where someone has to look at the SQL, so show which statement it was.
      state.migrationsNote = `<p class="error">Stopped on ${esc(result.failed.name)}: ${esc(result.failed.error)}</p>
        <pre>${esc(result.failed.statement)}</pre>`;
    } else if (!result.ran.length) {
      state.migrationsNote = '<p class="muted">Nothing was pending.</p>';
    } else {
      state.migrationsNote = '<p class="muted">Applied: ' + result.ran.map((r) =>
        `${esc(r.name)} (${r.changed} run${r.skipped ? `, ${r.skipped} already present` : ''})`
      ).join('; ') + '</p>';
    }
  } catch (err) {
    state.migrationsNote = `<p class="error">${esc(err.message)}</p>`;
    await loadMigrationStatus();
  } finally {
    state.migrationsBusy = false;
  }
  await renderDevices();
}

// assignment-spec.md §9.3, §9.4. One family, one school day — a family that
// genuinely spans zones still gets one answer, which is the correct answer for
// a homeschool plan.
//
// A free-text field rather than a picker: the IANA list is ~400 entries, the
// phone already knows the right one, and "Use this phone's" covers the case
// that actually happens. A typo is rejected by the server rather than stored,
// because a zone that does not resolve would silently stop every tablet
// stamping (§9.3).
function familySettingsCardHtml() {
  const tz = state.family.timezone;
  const here = resolvedTimezone();
  const mismatch = tz && here && tz !== here;
  return `
    <div class="card">
      <h2>School week</h2>
      <p class="muted">Which timezone a school day is counted in, and which day a week starts on.
      Every child's history is bucketed by these, on every device.</p>
      ${tz ? '' : '<p class="error">No timezone set yet. Until one is, tablets record the exact time of a sitting but not which day it belongs to.</p>'}
      <div class="row">
        <div class="col">
          <label for="tzIn">Timezone</label>
          <input type="text" id="tzIn" placeholder="e.g. America/Chicago" value="${esc(tz || here || '')}">
          ${here ? `<button class="link" type="button" onclick="useThisPhonesTimezone()">Use this phone's (${esc(here)})</button>` : ''}
          ${mismatch ? `<p class="muted">This phone is in ${esc(here)}. The family's week is counted in ${esc(tz)} — leave it unless the family has actually moved.</p>` : ''}
        </div>
        <div class="col">
          <label for="weekStartIn">A week starts on</label>
          <select id="weekStartIn">
            <option value="0"${state.family.weekStart === 1 ? '' : ' selected'}>Sunday</option>
            <option value="1"${state.family.weekStart === 1 ? ' selected' : ''}>Monday</option>
          </select>
        </div>
      </div>
      <button onclick="saveFamilySettings()">Save</button>
      <div id="familySettingsNote"></div>
    </div>`;
}

// Reads the zone at click time rather than interpolating it into the handler:
// a value baked into an inline onclick is a value inside a JS string inside an
// HTML attribute, and getting the two layers of escaping right is not worth
// doing for something the browser can just hand us again.
function useThisPhonesTimezone() {
  const here = resolvedTimezone();
  if (here) document.getElementById('tzIn').value = here;
}

async function saveFamilySettings() {
  const note = document.getElementById('familySettingsNote');
  note.innerHTML = '';
  const timezone = document.getElementById('tzIn').value.trim();
  const weekStart = Number(document.getElementById('weekStartIn').value);
  if (!timezone) { note.innerHTML = '<p class="error">Enter a timezone.</p>'; return; }
  try {
    const saved = await api('/family/settings', { method: 'PUT', body: { timezone, weekStart } });
    state.family = { timezone: saved.timezone || null, weekStart: saved.weekStart ?? 0 };
    // Every already-loaded session was bucketed against the old zone, so the
    // cache is now wrong rather than merely stale. Dropping it is one line;
    // re-deriving each bucket in place is not.
    state.sessionsByKey = {};
    note.innerHTML = '<p class="muted">Saved. Tablets pick this up on their next sync.</p>';
  } catch (err) {
    note.innerHTML = `<p class="error">${esc(err.message)}</p>`;
  }
}

// §6.2: a child-role code is minted for a specific child, chosen here rather
// than left for the device to guess from a typed name — that's what lets a
// lost or replacement tablet re-pair onto the same history instead of
// splitting it.
function onDeviceRoleChange() {
  const role = document.getElementById('roleSelect').value;
  document.getElementById('childPickerRow').style.display = role === 'child' ? '' : 'none';
}
function onChildSelectChange() {
  const isNew = document.getElementById('childSelect').value === '__new__';
  document.getElementById('newChildNameIn').style.display = isNew ? '' : 'none';
}

async function mintPairingCode() {
  clearInterval(pairingTimer);
  const role = document.getElementById('roleSelect').value;
  const area = document.getElementById('pairingCodeArea');
  const body = { role };
  if (role === 'child') {
    const childSelect = document.getElementById('childSelect').value;
    if (childSelect === '__new__') {
      const name = document.getElementById('newChildNameIn').value.trim();
      if (!name) { area.innerHTML = '<p class="error">Enter the new child\'s name.</p>'; return; }
      body.childName = name;
    } else {
      body.childId = childSelect;
    }
  }
  area.innerHTML = '<p class="muted">Generating…</p>';
  try {
    const { code, expiresAt } = await api('/pairing-code', { method: 'POST', body });
    area.innerHTML = `<div class="code-display">${esc(code)}</div><p class="center muted" id="pairingCountdown"></p>`;
    const tick = () => {
      const left = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
      const el = document.getElementById('pairingCountdown');
      if (!el) { clearInterval(pairingTimer); return; }
      if (left <= 0) { el.textContent = 'Expired — generate a new one.'; clearInterval(pairingTimer); return; }
      el.textContent = `Expires in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    };
    tick();
    pairingTimer = setInterval(tick, 1000);
  } catch (err) {
    area.innerHTML = `<p class="error">${esc(err.message)}</p>`;
  }
}

async function revokeDevice(deviceId) {
  if (!confirm('Revoke this device? It will need to be re-paired with a new code to sync again.')) return;
  try {
    await api('/devices/revoke', { method: 'POST', body: { deviceId } });
    renderDevices();
  } catch (err) {
    alert(err.message);
  }
}

boot();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
