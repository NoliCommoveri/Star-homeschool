<!DOCTYPE html>
<!-- Geography Star v2.0 — Stage 4 (Profiles, difficulty tiers, mastery,
     region progression, CSV export). Map deck (modes 1-5) shipped in
     Stage 1. Capitals and Population shipped in Stage 2. Natural World
     (mode 9) shipped in Stage 3 — a handful of entries are flagged for a
     follow-up check (see geodata/build-notes.md). Famous People (mode 8)
     remains authored-but-not-inlined per the spec §9/§11 parent-review
     gate; it has no UI yet. This update adds per-child profiles with a
     parent PIN, difficulty tiers that gate which modes and how much of
     the map are unlocked, per-state-per-mode mastery tracking with
     review/resurfacing, region unlock progression, a parent settings +
     mastery dashboard, and CSV export — mirroring the pattern already
     shipped in Math Star and Spelling Star. See docs/geography-star-spec.md
     §6-§7, §11 for the full spec. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geography Star</title>
<style>
  :root {
    --bg: #FDF6EC; --text: #2A3A50; --card: #FFFFFF; --card-shadow: rgba(42,58,80,.10);
    --accent: #2A5D9F; --accent-soft: #E3EDF9; --green: #2E8B57; --green-soft: #DCEBDD; --green-dark: #2E6B45;
    --danger: #C4553B; --danger-soft: #F5DCD5; --gold: #E8A013; --gold-soft: #FBEBC8;
    --muted: #6B7686; --border: #C9CDD4; --line: #EDE4D3; --input-bg: #FFFDF8;
    --eyebrow: #B0763A; --body-text: #4A5568;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Lexend', 'Trebuchet MS', 'Comic Sans MS', sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--eyebrow); letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; }
  .card { background: var(--card); border-radius: 20px; padding: 24px; box-shadow: 0 2px 10px var(--card-shadow); margin-bottom: 16px; }
  button { font-family: inherit; font-weight: 600; font-size: 15px; padding: 10px 18px; border-radius: 14px; border: none; background: var(--accent); color: #fff; cursor: pointer; letter-spacing: .02em; }
  button.big { font-size: 20px; padding: 16px 28px; }
  button.outline { background: transparent; border: 2.5px solid var(--accent); color: var(--accent); }
  button.green { background: var(--green); }
  button.link { background: none; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px; }
  button:disabled { background: var(--border); color: #fff; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 14px; }
  .center { text-align: center; }
  label.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--body-text); cursor: pointer; }
  input[type=text] { font-family: inherit; font-size: 20px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--border); background: var(--input-bg); color: var(--text); text-align: center; letter-spacing: .08em; text-transform: uppercase; width: 140px; }
  input[type=text].wide-input, input[type=password].wide-input { width: 240px; text-transform: none; letter-spacing: normal; }
  input[type=password], input[type=number] { font-family: inherit; font-size: 16px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--border); background: var(--input-bg); color: var(--text); }
  .eyebrow.center { text-align: center; }

  /* ---- mode menu ---- */
  .mode-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .mode-card { display: flex; align-items: flex-start; gap: 14px; background: var(--card); border-radius: 18px; padding: 18px; box-shadow: 0 2px 10px var(--card-shadow); text-align: left; border: 1px solid var(--line); }
  .mode-card .icon { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .mode-card h3 { margin: 0 0 3px; font-size: 16px; font-weight: 800; color: var(--text); }
  .mode-card p { margin: 0; font-size: 13px; color: var(--muted); }
  .deck-label { font-size: 13px; font-weight: 700; color: var(--eyebrow); text-transform: uppercase; letter-spacing: .08em; margin: 22px 0 10px; }
  .deck-label:first-child { margin-top: 0; }

  /* ---- gameplay chrome ---- */
  .prompt { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 4px; }
  .prompt .hint-code { font-variant: small-caps; }
  .progress-line { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .feedback { min-height: 30px; text-align: center; font-size: 17px; font-weight: 700; margin-top: 12px; }
  .feedback.ok { color: var(--green-dark); }
  .feedback.bad { color: var(--danger); }
  .choice-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); max-width: 480px; margin: 18px auto 0; }
  .choice-grid button { background: var(--card); color: var(--text); border: 2.5px solid var(--border); font-size: 17px; padding: 14px 10px; }
  .choice-grid button:hover:not(:disabled) { border-color: var(--accent); }
  .choice-grid button.correct { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); }
  .choice-grid button.wrong { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .hint-panel { margin: 10px auto 0; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px 12px; text-align: left; }
  .hint-panel ul { margin: 6px 0 0; padding-left: 20px; }
  .hint-panel li { font-size: 14px; color: var(--body-text); margin: 2px 0; }
  .end-card { text-align: center; }
  .end-card .big-score { font-size: 44px; font-weight: 800; margin: 8px 0; }

  /* ---- map ---- */
  .map-shell { max-width: 720px; margin: 0 auto; }
  .map-svg-wrap { position: relative; }
  svg.us-map { width: 100%; height: auto; display: block; touch-action: manipulation; }
  path.state-path { fill: var(--card); stroke: var(--line); stroke-width: 1; cursor: pointer; transition: fill .12s ease; }
  path.state-path:hover, path.state-path:focus-visible { fill: var(--accent-soft); }
  path.state-path:focus { outline: none; }
  path.state-path:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2; }
  path.state-path.prompted { fill: var(--gold-soft); }
  path.state-path.correct { fill: var(--green-soft); stroke: var(--green); stroke-width: 1.5; }
  path.state-path.wrong { fill: var(--danger-soft); stroke: var(--danger); stroke-width: 1.5; }
  path.state-path.disabled { cursor: default; pointer-events: none; }
  circle.hit-target { fill: transparent; cursor: pointer; }
  circle.hit-target.disabled { cursor: default; pointer-events: none; }
  circle.hit-target:focus { outline: none; }
  circle.hit-target:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  circle.capital-dot { fill: var(--accent); stroke: #fff; stroke-width: 1.5; cursor: pointer; }
  circle.capital-dot:hover, circle.capital-dot:focus-visible { fill: var(--gold); }
  circle.capital-dot:focus { outline: none; }
  circle.capital-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  circle.capital-dot.correct { fill: var(--green); }
  circle.capital-dot.wrong { fill: var(--danger); }
  circle.capital-dot.disabled { cursor: default; pointer-events: none; }
  .map-label { font-size: 10px; font-weight: 700; fill: var(--text); pointer-events: none; }
  .map-label-line { stroke: var(--muted); stroke-width: .6; pointer-events: none; }
  .feedback-glyph { font-size: 18px; font-weight: 800; }
  .feedback-glyph.ok { color: var(--green-dark); }
  .feedback-glyph.bad { color: var(--danger); }
</style>
</head>
<body>

    <button class="outline" id="homeBtn" style="display:none" onclick="goHome()">Menu</button>
  </header>
  <div id="app"></div>
</div>

// ---------- small utilities ----------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sample(arr, n) { return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function distractorCodes(correct, pool, n) { return sample(pool.filter(c => c !== correct), n); }
function feedbackHtml(ok, text) {
  return `<span class="feedback-glyph ${ok ? "ok" : "bad"}">${ok ? "&#10003;" : "&#10007;"}</span> ${text}`;
}

// ---------- profiles / storage (mirrors Math Star & Spelling Star, spec §6) ----------
const STORAGE_PREFIX = "geostar-";
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function nameToKey(name) {
  const s = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return STORAGE_PREFIX + (s || "child");
}
function listProfiles() {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith(STORAGE_PREFIX)) continue;
    const bareName = k.slice(STORAGE_PREFIX.length) || "profile";
    try {
      const d = JSON.parse(localStorage.getItem(k));
      if (d && d.childName && d.pin) { out.push({ key: k, name: d.childName, corrupted: false }); continue; }
      // Parses fine but is missing required fields — surface it as damaged
      // rather than silently dropping it (and the child's data with it).
      out.push({ key: k, name: bareName, corrupted: true });
    } catch (e) {
      out.push({ key: k, name: bareName, corrupted: true });
    }
  }
  return out.sort((a, b) => a.name.localeCompare(b.name));
}
function freshData(childName, pin, tier) {

    childName, pin, tier: TIERS[tier] ? tier : "g35",
    allowChildFocusSwitch: false,
    activeRegionIndex: 0,
    unlockedRegionCount: 1,
    mastery: {}, graduated: {}, reviewFacts: {}, sessionsByMode: {},
    sessionLog: [],
    masteryStreakRequired: 3,
    resurfaceAfterSessions: 10,
    reviewBankPercent: 30,
  };
}
let KEY = null;
let data = null;
// Set by load() on failure so callers can tell "no profile at this key"
// apart from "data was there but unreadable" (real corruption).
let lastLoadError = null;
function load(key) {
  lastLoadError = null;
  const raw = localStorage.getItem(key);
  if (!raw) return null;
  let d;
  try { d = JSON.parse(raw); } catch (e) { lastLoadError = "corrupted"; return null; }
  if (!d || !d.childName || !d.pin) { lastLoadError = "corrupted"; return null; }
  KEY = key;
  if (!TIERS[d.tier]) d.tier = "g35";
  if (d.allowChildFocusSwitch === undefined) d.allowChildFocusSwitch = false;
  if (!d.activeRegionIndex) d.activeRegionIndex = 0;
  if (!d.unlockedRegionCount) d.unlockedRegionCount = 1;
  if (!d.mastery) d.mastery = {};
  if (!d.graduated) d.graduated = {};
  if (!d.reviewFacts) d.reviewFacts = {};
  if (!d.sessionsByMode) d.sessionsByMode = {};
  if (!d.sessionLog) d.sessionLog = [];
  // Reliability cap, matching Math Star/Spelling Star precedent: keep the
  // file snappy on old devices. CSV export is the long-term record.
  if (d.sessionLog.length > 500) d.sessionLog = d.sessionLog.slice(d.sessionLog.length - 500);
  if (!d.masteryStreakRequired) d.masteryStreakRequired = 3;
  if (!d.resurfaceAfterSessions) d.resurfaceAfterSessions = 10;
  if (!d.reviewBankPercent) d.reviewBankPercent = 30;
  return d;
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); return true; } catch (e) { return false; }
}
function applyIdentity() {

    ? `Hi, ${esc(data.childName)}! &#128506;&#65039;`

// ---------- region scope & mastery engine (spec §6, §7) ----------
function regionsInScope() {
  const tier = TIERS[data.tier] || TIERS.g35;
  if (tier.regionScope === "all") return REGION_ORDER.slice();
  const unlockedIdx = Math.max(0, Math.min(data.unlockedRegionCount, REGION_ORDER.length) - 1);
  if (tier.regionScope === "single") {
    const active = Math.max(0, Math.min(data.activeRegionIndex, unlockedIdx));
    return [REGION_ORDER[active]];
  }
  return REGION_ORDER.slice(0, unlockedIdx + 1);
}
function codesInScope(pool) {
  const regions = regionsInScope();
  const scoped = pool.filter((c) => regions.includes(STATE_REGION[c]));
  return scoped.length ? scoped : pool.slice();
}
// Builds a round's queue: states already graduated in this mode drop out of
// rotation, states flagged in reviewFacts (a recent miss) are weighted up to
// reviewBankPercent of the round, and everything is scoped to the child's
// unlocked region(s) first (spec §6, §7).
function buildQueue(modeId, pool, size) {
  const base = codesInScope(pool);
  const grad = data.graduated[modeId] || {};
  let activeCodes = base.filter((c) => grad[c] === undefined);
  if (!activeCodes.length) activeCodes = base.slice(); // everything graduated -> resurface a review round
  const n = Math.min(size, activeCodes.length);
  const review = data.reviewFacts[modeId] || {};
  const reviewCodes = activeCodes.filter((c) => review[c]);
  const freshCodes = activeCodes.filter((c) => !review[c]);
  const reviewCount = Math.min(Math.round((n * (data.reviewBankPercent || 30)) / 100), reviewCodes.length);
  const chosen = sample(reviewCodes, reviewCount);
  chosen.push(...sample(freshCodes, n - chosen.length));
  if (chosen.length < n) chosen.push(...sample(activeCodes.filter((c) => !chosen.includes(c)), n - chosen.length));
  return shuffle(chosen);
}
function recordAnswer(modeId, code, isCorrect) {
  if (!data) return;
  data.mastery[modeId] = data.mastery[modeId] || {};
  data.graduated[modeId] = data.graduated[modeId] || {};
  data.reviewFacts[modeId] = data.reviewFacts[modeId] || {};
  const req = data.masteryStreakRequired || 3;
  if (isCorrect) {
    const streak = (data.mastery[modeId][code] || 0) + 1;
    delete data.reviewFacts[modeId][code];
    if (streak >= req) {
      delete data.mastery[modeId][code];
      data.graduated[modeId][code] = data.sessionsByMode[modeId] || 0;
    } else {
      data.mastery[modeId][code] = streak;
    }
  } else {
    data.mastery[modeId][code] = 0;
    data.reviewFacts[modeId][code] = true;
    delete data.graduated[modeId][code]; // a miss resurfaces it immediately
  }
  persist();
}
// A region unlocks the next one once every state in it is graduated in
// "find" (the foundational map-recognition mode) — ties progression to
// something the child has actually demonstrated, spec §6.
function checkRegionProgression() {
  const tier = TIERS[data.tier] || TIERS.g35;
  if (tier.regionScope === "all") return;
  if (data.unlockedRegionCount >= REGION_ORDER.length) return;
  const region = REGION_ORDER[data.unlockedRegionCount - 1];
  const codes = ALL_CODES.filter((c) => STATE_REGION[c] === region);
  const grad = data.graduated["find"] || {};
  if (codes.length && codes.every((c) => grad[c] !== undefined)) {
    data.unlockedRegionCount++;
    if (tier.regionScope === "single") data.activeRegionIndex = data.unlockedRegionCount - 1;
  }
}
function recordSessionEnd(modeId, correct, total) {
  if (!data) return;
  data.sessionsByMode[modeId] = (data.sessionsByMode[modeId] || 0) + 1;
  const cur = data.sessionsByMode[modeId];
  const resurfaceAfter = data.resurfaceAfterSessions || 10;
  const grad = data.graduated[modeId] || {};
  Object.keys(grad).forEach((code) => {
    if (cur - grad[code] >= resurfaceAfter) delete grad[code];
  });
  data.sessionLog.push({ date: Date.now(), mode: modeId, region: regionsInScope().join(" + "), correct, total });
  if (data.sessionLog.length > 500) data.sessionLog = data.sessionLog.slice(data.sessionLog.length - 500);
  checkRegionProgression();
  persist();
}
function regionModeStats(region, modeId) {
  const pool = modeId === "capital" || modeId === "capitals" ? CAPITAL_CODES : modeId === "nickname" ? NICKNAME_CODES : ALL_CODES;
  const codes = pool.filter((c) => STATE_REGION[c] === region);
  const grad = data.graduated[modeId] || {};
  const done = codes.filter((c) => grad[c] !== undefined).length;
  return { done, total: codes.length };
}

const SVG_NS = "http://www.w3.org/2000/svg";
const SVG_TAGS = new Set(["svg", "path", "circle", "g", "text", "line"]);
function el(tag, attrs, text) {
  const e = SVG_TAGS.has(tag) ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}

function buildMap({ interactive = true, showHitCircles = true } = {}) {
  const svg = el("svg", { class: "us-map", viewBox: "0 0 975 610", "aria-label": "Map of the United States" });
  ALL_CODES.forEach((code) => {
    const p = el("path", {
      class: "state-path" + (interactive ? "" : " disabled"),
      d: STATE_PATHS[code], "data-code": code,
      tabindex: interactive ? "0" : "-1", role: "button", "aria-label": STATE_NAMES[code],
    });
    svg.appendChild(p);
  });
  if (showHitCircles) {
    SMALL_CODES.forEach((code) => {
      const [x, y] = SMALL_STATE_CENTROID[code];
      svg.appendChild(el("circle", {
        class: "hit-target" + (interactive ? "" : " disabled"),
        cx: x, cy: y, r: 11, "data-code": code, "aria-hidden": "true",
      }));
    });
  }
  return svg;
}

// Reading-order + label anchors come from live layout (getBBox), not baked
// data, so they stay correct if the map is ever restyled or rescaled.
function computeCenters(svg) {
  const centers = {};
  ALL_CODES.forEach((code) => {
    const p = svg.querySelector(`path[data-code="${code}"]`);
    try {
      const b = p.getBBox();
      centers[code] = { x: b.x + b.width / 2, y: b.y + b.height / 2 };
    } catch (e) { /* not laid out yet */ }
  });
  return centers;
}
function computeReadingOrder(centers) {
  const ROW = 40;
  return ALL_CODES.slice().sort((a, b) => {
    const ca = centers[a], cb = centers[b];
    if (!ca || !cb) return 0;
    const ra = Math.round(ca.y / ROW), rb = Math.round(cb.y / ROW);
    return ra !== rb ? ra - rb : ca.x - cb.x;
  });
}
function focusCode(svg, code) {
  const target = svg.querySelector(`path[data-code="${code}"]`);
  if (target) target.focus();
}
// Enter/Space activates any focused map control; arrow keys move between
// state paths in reading order (spec §10). readingOrder is optional --
// modes without an interactive map skip the arrow-key branch harmlessly.
function attachMapKeyboard(svg, readingOrder) {
  svg.addEventListener("keydown", (e) => {
    const target = e.target;
    if (!(target instanceof Element)) return;
    if (e.key === "Enter" || e.key === " ") {
      if (target.getAttribute("role") === "button") { e.preventDefault(); target.click(); }
      return;
    }
    if (!readingOrder || !target.classList.contains("state-path")) return;
    const idx = readingOrder.indexOf(target.getAttribute("data-code"));
    if (idx === -1) return;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") {
      e.preventDefault(); focusCode(svg, readingOrder[(idx + 1) % readingOrder.length]);
    } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
      e.preventDefault(); focusCode(svg, readingOrder[(idx - 1 + readingOrder.length) % readingOrder.length]);
    }
  });
}

// Northeast cluster is too cramped for on-shape labels, so those get a
// leader line out to a column on the right instead (spec §4).
const NORTHEAST_CLUSTER = ["VT", "NH", "MA", "RI", "CT", "NJ", "DE", "MD", "DC"];
function renderLabels(svg, centers) {
  removeLabels(svg);
  const g = el("g", { id: "labels-layer" });
  let row = 0;
  ALL_CODES.forEach((code) => {
    const c = centers[code];
    if (!c) return;
    if (NORTHEAST_CLUSTER.includes(code)) {
      const lx = 955, ly = 26 + row * 15;
      row++;
      g.appendChild(el("line", { class: "map-label-line", x1: c.x, y1: c.y, x2: lx - 6, y2: ly - 3 }));
      g.appendChild(el("text", { class: "map-label", x: lx, y: ly, "text-anchor": "start" }, code));
    } else {
      g.appendChild(el("text", { class: "map-label", x: c.x, y: c.y + 3, "text-anchor": "middle" }, code));
    }
  });
  svg.appendChild(g);
}
function removeLabels(svg) {
  const g = svg.querySelector("#labels-layer");
  if (g) g.remove();
}

function discardCorruptedProfile(key) {

      <div style="font-size:34px;margin-bottom:10px">&#128075;</div>

      <button class="big" id="setupNext">Continue &rarr;</button>`;
    app.appendChild(card);

    card.innerHTML = `

      </div>`;
    app.appendChild(card);
    ["k2", "g35", "g6"].forEach((t) => document.getElementById("tier-" + t).addEventListener("click", () => setupFinish(t)));
  }
}
function setupPin() {
  const v = document.getElementById("pinIn").value.trim();
  const v2 = document.getElementById("pinIn2").value.trim();
  const msg = document.getElementById("setupMsg");
  if (v.length < 4) { msg.textContent = "PIN must be at least 4 digits."; return; }
  if (v !== v2) { msg.textContent = "PINs don't match — try again."; return; }
  setup.pin = v; renderSetup(2);
}
function setupName() {
  const v = document.getElementById("nameIn").value.trim();
  const msg = document.getElementById("setupMsg");
  if (!v) { msg.textContent = "Please enter a name."; return; }
  setup.name = v; renderSetup(3);
}
function setupFinish(tier) {
  KEY = nameToKey(setup.name);
  const existing = localStorage.getItem(KEY);
  if (existing && !confirm(`This device already has saved data for a child named "${setup.name}". Continue and use that existing data?`)) return;
  if (existing) { data = load(KEY); }
  else { data = freshData(setup.name, setup.pin, tier); persist(); }
  applyIdentity();
  renderHome();
}

// ---------- parent gate ----------
let parentUnlocked = false;
function parentGate() {
  homeBtn.style.display = "";
  if (parentUnlocked) return renderParent("settings");
  app.innerHTML = "";
  const card = el("div", { class: "card center", style: "padding:36px;max-width:400px;margin:0 auto" });
  card.innerHTML = `
    <div style="font-size:34px;margin-bottom:10px">&#128274;</div>
    <div style="font-weight:700;font-size:18px;margin-bottom:6px">Parents only</div>
    <input type="password" id="pinIn" inputmode="numeric" maxlength="8" placeholder="Enter PIN" class="wide-input" style="text-align:center;font-size:22px;letter-spacing:.3em;text-transform:none">
    <div id="pinMsg" class="muted" style="min-height:20px;color:var(--danger)"></div>
    <button class="big" id="pinSubmitBtn">Unlock</button>`;
  app.appendChild(card);
  const pi = document.getElementById("pinIn");
  pi.focus();
  pi.addEventListener("keydown", (e) => { if (e.key === "Enter") pinSubmit(); });
  document.getElementById("pinSubmitBtn").addEventListener("click", pinSubmit);
}
function pinSubmit() {
  const v = document.getElementById("pinIn").value.trim();
  if (v === data.pin) { parentUnlocked = true; renderParent("settings"); }
  else { document.getElementById("pinMsg").textContent = "That's not the right PIN."; document.getElementById("pinIn").value = ""; }
}

// ---------- parent dashboard ----------
function renderParent(view) {
  if (!parentUnlocked) return parentGate();
  homeBtn.style.display = "";
  app.innerHTML = "";
  const tabRow = el("div", { class: "row", style: "margin-bottom:16px" });
  [["settings", "Settings"], ["mastery", "Mastery"]].forEach(([id, label]) => {
    const b = el("button", { class: view === id ? "" : "outline" }, label);
    b.addEventListener("click", () => renderParent(id));
    tabRow.appendChild(b);
  });
  const csvBtn = el("button", { class: "outline" }, "Export CSV");
  csvBtn.addEventListener("click", exportCSV);
  tabRow.appendChild(csvBtn);
  app.appendChild(tabRow);
  app.appendChild(view === "mastery" ? renderMasteryPanel() : renderSettingsPanel());
}

function setSetting(field, value, view) { data[field] = value; persist(); renderParent(view || "settings"); }
function setTier(tier) { data.tier = tier; persist(); renderParent("settings"); }
function renameChild() {
  const v = document.getElementById("renameIn").value.trim();
  if (!v) { alert("Name can't be empty."); return; }
  data.childName = v; persist(); applyIdentity(); renderParent("settings");
}
function changePin() {
  const cur = prompt("Enter current PIN:");
  if (cur === null) return;
  if (cur !== data.pin) { alert("Wrong PIN."); return; }
  const np = prompt("New PIN (at least 4 digits):");
  if (!np || np.trim().length < 4) { alert("PIN must be at least 4 digits."); return; }
  data.pin = np.trim(); persist(); alert("PIN updated.");
}
function resetProfile() {
  const kept = {
    childName: data.childName, pin: data.pin, tier: data.tier,
    allowChildFocusSwitch: data.allowChildFocusSwitch,
    masteryStreakRequired: data.masteryStreakRequired,
    resurfaceAfterSessions: data.resurfaceAfterSessions,
    reviewBankPercent: data.reviewBankPercent,
  };
  if (!confirm(`This clears ALL of ${kept.childName}'s progress — mastery, streaks, and region unlocks — back to zero. Name, PIN, tier, and settings are kept. This can't be undone. Continue?`)) return;
  data = Object.assign(freshData(kept.childName, kept.pin, kept.tier), kept);
  persist();
  applyIdentity();
  renderParent("settings");
}
function deleteProfile() {
  const name = data.childName;
  const enteredPin = prompt(`Type ${name}'s PIN to permanently delete this profile:`);
  if (enteredPin === null) return;
  if (enteredPin !== data.pin) { alert("Wrong PIN — nothing was deleted."); return; }
  if (!confirm(`This permanently deletes ${name}'s entire profile — progress, settings, and PIN. This can't be undone. Continue?`)) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  data = null; KEY = null; parentUnlocked = false;
  applyIdentity();
  if (listProfiles().length === 0) renderSetup(1); else renderPicker();
}
function exportCSV() {
  const rows = [["child", "date", "time", "mode", "region", "correct", "total", "percentage"]];
  data.sessionLog.forEach((s) => {
    const d = new Date(s.date);
    const pct = s.total ? Math.round((100 * s.correct) / s.total) : 0;
    rows.push([data.childName, d.toLocaleDateString(), d.toLocaleTimeString(), MODE_TITLES[s.mode] || s.mode, s.region, s.correct, s.total, `${pct}%`]);
  });
  const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${nameToKey(data.childName).replace(STORAGE_PREFIX, "")}-geography-results.csv`;
  a.click();
}

function startMode(id) {
  homeBtn.style.display = "inline-block";
  if (id === "find") playFind();
  else if (id === "name") playName();
  else if (id === "capital") playCapital();
  else if (id === "abbr") playAbbr();
  else if (id === "unabbr") playUnabbr();
  else if (id === "capitals") playCapitals();
  else if (id === "population") playPopulation();
  else if (id === "nature") playNature();
  else if (id === "nickname") playNickname();
}

function progressLine(i, total, correct) {
  return el("div", { class: "progress-line" }, `${i + 1} of ${total} · ${correct} correct so far`);
}
function nextButtonRow(isLast, onNext) {
  const row = el("div", { class: "row center", style: "justify-content:center;margin-top:16px" });
  const btn = el("button", { class: "big" }, isLast ? "See results" : "Next →");
  btn.addEventListener("click", onNext);
  row.appendChild(btn);
  return row;
}

const MODE_TITLES = {
  find: "Find the State", name: "Name the State", capital: "Click the Capital",
  abbr: "State → Abbreviation", unabbr: "Abbreviation → State",
  capitals: "Capitals", population: "Population", nature: "Natural World",
  nickname: "State Nicknames",
};
function renderEnd(modeId, correct, total, replayFn) {
  recordSessionEnd(modeId, correct, total);
  app.innerHTML = "";
  const card = el("div", { class: "card end-card" });
  card.appendChild(el("div", { class: "eyebrow" }, MODE_TITLES[modeId] || ""));
  card.appendChild(el("h2", {}, "Round complete!"));
  card.appendChild(el("div", { class: "big-score" }, `${correct} / ${total}`));
  card.appendChild(el(
    "p", { class: "muted" },
    correct === total ? "Perfect round!" : "Nice work — try again to beat your score."
  ));
  const row = el("div", { class: "row center", style: "justify-content:center;margin-top:14px" });
  const again = el("button", { class: "big" }, "Play again");
  again.addEventListener("click", replayFn);
  const menu = el("button", { class: "outline" }, "Back to menu");
  menu.addEventListener("click", goHome);
  row.appendChild(again); row.appendChild(menu);
  card.appendChild(row);
  app.appendChild(card);
}

// ---------- Mode 1: Find the State ----------
function playFind() {
  const queue = buildQueue("find", ALL_CODES, ROUND_SIZE);
  let i = 0, correct = 0, labelsOn = false;

  function renderQuestion() {
    app.innerHTML = "";
    const targetCode = queue[i], targetName = STATE_NAMES[targetCode];

    app.appendChild(el("div", { class: "prompt" }, `Where is ${targetName}?`));
    app.appendChild(progressLine(i, queue.length, correct));

    const toggleRow = el("div", { class: "row center", style: "justify-content:center;margin-bottom:10px" });
    const labelToggle = document.createElement("label");
    labelToggle.className = "toggle";
    labelToggle.innerHTML = `<input type="checkbox" id="labelsToggle"> Show state labels (hint)`;
    toggleRow.appendChild(labelToggle);
    app.appendChild(toggleRow);

    const mapShell = el("div", { class: "map-shell" });
    const svg = buildMap({ interactive: true });
    mapShell.appendChild(svg);
    app.appendChild(mapShell);

    const feedback = el("div", { class: "feedback" });
    app.appendChild(feedback);

    const centers = computeCenters(svg);
    const readingOrder = computeReadingOrder(centers);
    attachMapKeyboard(svg, readingOrder);

    const toggleInput = document.getElementById("labelsToggle");
    toggleInput.checked = labelsOn;
    toggleInput.addEventListener("change", (e) => {
      labelsOn = e.target.checked;
      if (labelsOn) renderLabels(svg, centers); else removeLabels(svg);
    });
    if (labelsOn) renderLabels(svg, centers);

    let answered = false;
    svg.addEventListener("click", (e) => {
      if (answered) return;
      const t = e.target.closest && e.target.closest("[data-code]");
      if (!t) return;
      const code = t.getAttribute("data-code");
      answered = true;
      svg.querySelectorAll(".state-path, .hit-target").forEach((x) => x.classList.add("disabled"));
      const targetPath = svg.querySelector(`path[data-code="${targetCode}"]`);
      targetPath.classList.add("correct");
      const isCorrect = code === targetCode;
      recordAnswer("find", targetCode, isCorrect);
      if (isCorrect) {
        correct++;
        feedback.className = "feedback ok";
        feedback.innerHTML = feedbackHtml(true, `That's ${targetName}!`);
      } else {
        const wrongPath = svg.querySelector(`path[data-code="${code}"]`);
        if (wrongPath) wrongPath.classList.add("wrong");
        feedback.className = "feedback bad";
        feedback.innerHTML = feedbackHtml(false, `That's ${STATE_NAMES[code]}. ${targetName} is highlighted in green.`);
      }
      app.appendChild(nextButtonRow(i + 1 >= queue.length, () => {
        i++;
        if (i < queue.length) renderQuestion(); else renderEnd("find", correct, queue.length, playFind);
      }));
    });
  }
  renderQuestion();
}

// ---------- Mode 2: Name the State ----------
function playName() {
  const queue = buildQueue("name", ALL_CODES, ROUND_SIZE);
  let i = 0, correct = 0;

  function renderQuestion() {
    app.innerHTML = "";
    const targetCode = queue[i], targetName = STATE_NAMES[targetCode];

    app.appendChild(el("div", { class: "prompt" }, "Which state is highlighted?"));
    app.appendChild(progressLine(i, queue.length, correct));

    const mapShell = el("div", { class: "map-shell" });
    const svg = buildMap({ interactive: false, showHitCircles: false });
    svg.querySelector(`path[data-code="${targetCode}"]`).classList.add("prompted");
    mapShell.appendChild(svg);
    app.appendChild(mapShell);

    const choiceGrid = el("div", { class: "choice-grid" });
    const choices = shuffle([targetCode, ...distractorCodes(targetCode, ALL_CODES, 3)]);
    const feedback = el("div", { class: "feedback" });

    let answered = false;
    choices.forEach((code) => {
      const btn = el("button", {}, STATE_NAMES[code]);
      btn.addEventListener("click", () => {
        if (answered) return;
        answered = true;
        choiceGrid.querySelectorAll("button").forEach((b) => (b.disabled = true));
        recordAnswer("name", targetCode, code === targetCode);
        if (code === targetCode) {
          correct++;
          btn.classList.add("correct");
          feedback.className = "feedback ok";
          feedback.innerHTML = feedbackHtml(true, `Yes — that's ${targetName}.`);
        } else {
          btn.classList.add("wrong");
          Array.from(choiceGrid.children).forEach((b) => { if (b.textContent === targetName) b.classList.add("correct"); });
          feedback.className = "feedback bad";
          feedback.innerHTML = feedbackHtml(false, `Not quite — the highlighted state is ${targetName}.`);
        }
        app.appendChild(nextButtonRow(i + 1 >= queue.length, () => {
          i++;
          if (i < queue.length) renderQuestion(); else renderEnd("name", correct, queue.length, playName);
        }));
      });
      choiceGrid.appendChild(btn);
    });
    app.appendChild(choiceGrid);
    app.appendChild(feedback);
  }
  renderQuestion();
}

// ---------- Mode 3: Click the Capital ----------
function playCapital() {
  const queue = buildQueue("capital", CAPITAL_CODES, ROUND_SIZE);
  let i = 0, correct = 0;

  function renderQuestion() {
    app.innerHTML = "";
    const targetCode = queue[i], targetName = STATE_NAMES[targetCode];

    app.appendChild(el("div", { class: "prompt" }, `Click the capital of ${targetName}`));
    app.appendChild(progressLine(i, queue.length, correct));

    const mapShell = el("div", { class: "map-shell" });
    const svg = buildMap({ interactive: false, showHitCircles: false });
    mapShell.appendChild(svg);
    app.appendChild(mapShell);

    // Capital markers, with an oversized invisible tap circle reused from
    // the small-state hit-target technique for the cramped Northeast (§4, §5).
    CAPITAL_CODES.forEach((code) => {
      const [, x, y] = CAPITALS[code];
      const dot = el("circle", {
        class: "capital-dot", cx: x, cy: y, r: 5, "data-code": code,
        tabindex: "0", role: "button", "aria-label": "Capital marker",
      });
      if (SMALL_CODES.includes(code)) {
        svg.appendChild(el("circle", { class: "hit-target", cx: x, cy: y, r: 11, "data-code": code, "aria-hidden": "true" }));
      }
      svg.appendChild(dot);
    });
    attachMapKeyboard(svg);

    const feedback = el("div", { class: "feedback" });
    app.appendChild(feedback);

    let answered = false;
    svg.addEventListener("click", (e) => {
      if (answered) return;
      const t = e.target.closest && e.target.closest(".capital-dot, .hit-target");
      if (!t) return;
      const code = t.getAttribute("data-code");
      answered = true;
      svg.querySelectorAll(".capital-dot, .hit-target").forEach((x) => x.classList.add("disabled"));
      const targetDot = svg.querySelector(`circle.capital-dot[data-code="${targetCode}"]`);
      targetDot.classList.add("correct");
      const capitalName = CAPITALS[targetCode][0];
      recordAnswer("capital", targetCode, code === targetCode);
      if (code === targetCode) {
        correct++;
        feedback.className = "feedback ok";
        feedback.innerHTML = feedbackHtml(true, `Yes — ${capitalName} is the capital of ${targetName}.`);
      } else {
        const wrongDot = svg.querySelector(`circle.capital-dot[data-code="${code}"]`);
        if (wrongDot) wrongDot.classList.add("wrong");
        feedback.className = "feedback bad";
        feedback.innerHTML = feedbackHtml(false, `Not quite — ${capitalName} (highlighted) is the capital of ${targetName}.`);
      }
      app.appendChild(nextButtonRow(i + 1 >= queue.length, () => {
        i++;
        if (i < queue.length) renderQuestion(); else renderEnd("capital", correct, queue.length, playCapital);
      }));
    });
  }
  renderQuestion();
}

// ---------- Modes 4 & 5: abbreviation flashcards (map-hidden by default) ----------
// cfg.answerType: "choice" (default, needs choicesFor + labelFor) or "text"
// (free-text entry, needs answerLength) -- see playAbbr vs playUnabbr below.
function playFlashcard(cfg) {
  const queue = cfg.queue;
  let i = 0, correct = 0, showMap = false;

  function renderQuestion() {
    app.innerHTML = "";
    const targetCode = queue[i];

    app.appendChild(el("div", { class: "prompt" }, cfg.promptFor(targetCode)));
    app.appendChild(progressLine(i, queue.length, correct));

    const toggleRow = el("div", { class: "row center", style: "justify-content:center;margin-bottom:10px" });
    const mapToggle = document.createElement("label");
    mapToggle.className = "toggle";
    mapToggle.innerHTML = `<input type="checkbox" id="mapToggle"> Show map`;
    toggleRow.appendChild(mapToggle);
    app.appendChild(toggleRow);

    if (showMap) {
      const mapShell = el("div", { class: "map-shell" });
      const svg = buildMap({ interactive: false, showHitCircles: false });
      svg.querySelector(`path[data-code="${targetCode}"]`).classList.add("prompted");
      mapShell.appendChild(svg);
      app.appendChild(mapShell);
    }

    const feedback = el("div", { class: "feedback" });
    let answered = false;

    function reveal(isCorrect) {
      recordAnswer(cfg.key, targetCode, isCorrect);
      if (isCorrect) correct++;
      feedback.className = "feedback " + (isCorrect ? "ok" : "bad");
      feedback.innerHTML = feedbackHtml(isCorrect, isCorrect ? cfg.correctPhrase(targetCode) : cfg.wrongPhrase(targetCode));
      app.appendChild(nextButtonRow(i + 1 >= queue.length, () => {
        i++;
        if (i < queue.length) renderQuestion(); else renderEnd(cfg.key, correct, queue.length, cfg.replayFn);
      }));
    }

    if (cfg.answerType === "text") {
      const form = el("form", { class: "row center", style: "justify-content:center;gap:10px;margin-top:18px" });
      const input = el("input", {
        type: "text", maxlength: String(cfg.answerLength || 2), autocomplete: "off",
        autocapitalize: "characters", spellcheck: "false", "aria-label": "Type your answer",
      });
      const submitBtn = el("button", { type: "submit" }, "Check");
      form.appendChild(input);
      form.appendChild(submitBtn);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (answered || !input.value.trim()) return;
        answered = true;
        input.disabled = true;
        submitBtn.disabled = true;
        reveal(input.value.trim().toUpperCase() === targetCode.toUpperCase());
      });
      app.appendChild(form);
      app.appendChild(feedback);
      setTimeout(() => input.focus(), 0);
    } else {
      const choiceGrid = el("div", { class: "choice-grid" });
      const choices = cfg.choicesFor(targetCode);
      const correctLabel = cfg.labelFor(targetCode);
      choices.forEach((code) => {
        const btn = el("button", {}, cfg.labelFor(code));
        btn.addEventListener("click", () => {
          if (answered) return;
          answered = true;
          choiceGrid.querySelectorAll("button").forEach((b) => (b.disabled = true));
          const isCorrect = code === targetCode;
          if (isCorrect) {
            btn.classList.add("correct");
          } else {
            btn.classList.add("wrong");
            Array.from(choiceGrid.children).forEach((b) => { if (b.textContent === correctLabel) b.classList.add("correct"); });
          }
          reveal(isCorrect);
        });
        choiceGrid.appendChild(btn);
      });
      app.appendChild(choiceGrid);
      app.appendChild(feedback);
    }

    const mapToggleInput = document.getElementById("mapToggle");
    mapToggleInput.checked = showMap;
    mapToggleInput.addEventListener("change", (e) => { showMap = e.target.checked; renderQuestion(); });
  }
  renderQuestion();
}

function playAbbr() {
  playFlashcard({
    key: "abbr",
    queue: buildQueue("abbr", ALL_CODES, ROUND_SIZE),
    promptFor: (code) => STATE_NAMES[code],
    answerType: "text",
    answerLength: 2,
    correctPhrase: (code) => `Yes — ${STATE_NAMES[code]} is abbreviated ${code}.`,
    wrongPhrase: (code) => `Not quite — ${STATE_NAMES[code]} is abbreviated ${code}.`,
    replayFn: playAbbr,
  });
}

// Picks wrong-answer codes that are easy to confuse with the target
// abbreviation, rather than pure random picks (spec: mode 5 should train
// the actual confusions kids make between similar-looking codes).
// Priority 1: same starting letter (MA vs MD/ME/MI/...).
// Priority 2: shares a letter with the target somewhere (ND vs SD).
// Falls back to random codes only if those two groups can't fill n slots.
function smartAbbrDistractors(targetCode, pool, n) {
  const remaining = pool.filter((c) => c !== targetCode);
  const sameFirstLetter = remaining.filter((c) => c[0] === targetCode[0]);
  const sharesLetter = remaining.filter(
    (c) => !sameFirstLetter.includes(c) && c.split("").some((ch) => targetCode.includes(ch))
  );
  const rest = remaining.filter((c) => !sameFirstLetter.includes(c) && !sharesLetter.includes(c));
  const prioritized = [...shuffle(sameFirstLetter), ...shuffle(sharesLetter), ...shuffle(rest)];
  return prioritized.slice(0, n);
}

function playUnabbr() {
  playFlashcard({
    key: "unabbr",
    queue: buildQueue("unabbr", ALL_CODES, ROUND_SIZE),
    promptFor: (code) => code,
    choicesFor: (code) => shuffle([code, ...smartAbbrDistractors(code, ALL_CODES, 3)]),
    labelFor: (code) => STATE_NAMES[code],
    correctPhrase: (code) => `Yes — ${code} is ${STATE_NAMES[code]}.`,
    wrongPhrase: (code) => `Not quite — ${code} is ${STATE_NAMES[code]}.`,
    replayFn: playUnabbr,
  });
}

// ---------- Mode 6: Capitals (state <-> capital, either direction) ----------
// Direction is randomized per question. State->capital asks for free-text
// entry (spelling the city); capital->state is multiple choice, matching
// the split already used for modes 4/5 (spec allows either format).
function normalizeCapitalAnswer(s) {
  return s.toLowerCase().trim().replace(/[.]/g, "").replace(/\s+/g, " ").replace(/\bsaint\b/g, "st");
}
function playCapitals() {
  const queue = buildQueue("capitals", CAPITAL_CODES, ROUND_SIZE).map((code) => ({
    code, dir: Math.random() < 0.5 ? "s2c" : "c2s",
  }));
  let i = 0, correct = 0;

  function renderQuestion() {
    app.innerHTML = "";
    const { code, dir } = queue[i];
    const stateName = STATE_NAMES[code];
    const capitalName = CAPITALS[code][0];

    const promptText = dir === "s2c"
      ? `What is the capital of ${stateName}?`
      : `${capitalName} is the capital of which state?`;
    app.appendChild(el("div", { class: "prompt" }, promptText));
    app.appendChild(progressLine(i, queue.length, correct));

    const feedback = el("div", { class: "feedback" });
    let answered = false;

    function reveal(isCorrect) {
      recordAnswer("capitals", code, isCorrect);
      if (isCorrect) correct++;
      feedback.className = "feedback " + (isCorrect ? "ok" : "bad");
      const phrase = isCorrect
        ? `Yes — ${capitalName} is the capital of ${stateName}.`
        : `Not quite — ${capitalName} is the capital of ${stateName}.`;
      feedback.innerHTML = feedbackHtml(isCorrect, phrase);
      app.appendChild(nextButtonRow(i + 1 >= queue.length, () => {
        i++;
        if (i < queue.length) renderQuestion(); else renderEnd("capitals", correct, queue.length, playCapitals);
      }));
    }

    if (dir === "s2c") {
      const form = el("form", { class: "row center", style: "justify-content:center;gap:10px;margin-top:18px" });
      const input = el("input", {
        type: "text", class: "wide-input", maxlength: "30", autocomplete: "off",
        spellcheck: "false", "aria-label": "Type the capital city",
      });
      const submitBtn = el("button", { type: "submit" }, "Check");
      form.appendChild(input);
      form.appendChild(submitBtn);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (answered || !input.value.trim()) return;
        answered = true;
        input.disabled = true;
        submitBtn.disabled = true;
        reveal(normalizeCapitalAnswer(input.value) === normalizeCapitalAnswer(capitalName));
      });
      app.appendChild(form);
      app.appendChild(feedback);
      setTimeout(() => input.focus(), 0);
    } else {
      const choiceGrid = el("div", { class: "choice-grid" });
      const choices = shuffle([code, ...distractorCodes(code, CAPITAL_CODES, 3)]);
      choices.forEach((c) => {
        const btn = el("button", {}, STATE_NAMES[c]);
        btn.addEventListener("click", () => {
          if (answered) return;
          answered = true;
          choiceGrid.querySelectorAll("button").forEach((b) => (b.disabled = true));
          const isCorrect = c === code;
          if (isCorrect) {
            btn.classList.add("correct");
          } else {
            btn.classList.add("wrong");
            Array.from(choiceGrid.children).forEach((b) => { if (b.textContent === stateName) b.classList.add("correct"); });
          }
          reveal(isCorrect);
        });
        choiceGrid.appendChild(btn);
      });
      app.appendChild(choiceGrid);
      app.appendChild(feedback);
    }
  }
  renderQuestion();
}

// ---------- Mode 7: Population (2020 Census, multiple choice) ----------
function formatPop(n) { return n.toLocaleString("en-US"); }
function round10k(n) { return Math.max(10000, Math.round(n / 10000) * 10000); }
function cityHintHtml(code, stateName) {
  const cities = CITY_HINTS[code];
  const items = cities.map(([city, pop]) => `<li>${city} — ${formatPop(pop)}</li>`).join("");
  const intro = cities.length > 1
    ? `${stateName}'s biggest cities (2020 Census), most populous first:`
    : `${stateName}'s most populous city (2020 Census):`;
  return `<div class="muted">${intro}</div><ul>${items}</ul>`;
}
// Near-miss distractors spread around the true value (rounded to the
// nearest 10,000, same as the displayed "correct" choice) so the answer
// isn't guessable by precision or by magnitude alone (spec §5, mode 7).
function popDistractors(trueVal, n) {
  const target = round10k(trueVal);
  const multipliers = shuffle([0.4, 0.55, 0.7, 0.82, 1.18, 1.35, 1.6, 2.1]);
  const out = [];
  for (const m of multipliers) {
    const v = round10k(trueVal * m);
    if (v !== target && !out.includes(v)) out.push(v);
    if (out.length >= n) break;
  }
  return out;
}
function playPopulation() {
  const queue = buildQueue("population", ALL_CODES, ROUND_SIZE);
  let i = 0, correct = 0;

  function renderQuestion() {
    app.innerHTML = "";
    const code = queue[i];
    const name = STATE_NAMES[code];
    const target = round10k(POPULATION_2020[code]);

    app.appendChild(el("div", { class: "eyebrow center" }, "2020 Census"));
    app.appendChild(el("div", { class: "prompt" }, `About how many people live in ${name}?`));
    app.appendChild(progressLine(i, queue.length, correct));

    const hintRow = el("div", { class: "row center", style: "justify-content:center;margin:0 0 4px" });
    const hintBtn = el("button", { class: "link" }, "Show city hint");
    const hintPanel = el("div", { class: "hint-panel" });
    hintPanel.style.display = "none";
    hintPanel.innerHTML = cityHintHtml(code, name);
    hintBtn.addEventListener("click", () => {
      const hidden = hintPanel.style.display === "none";
      hintPanel.style.display = hidden ? "block" : "none";
      hintBtn.textContent = hidden ? "Hide city hint" : "Show city hint";
    });
    hintRow.appendChild(hintBtn);
    app.appendChild(hintRow);
    app.appendChild(hintPanel);

    const feedback = el("div", { class: "feedback" });
    let answered = false;
    const choiceGrid = el("div", { class: "choice-grid" });
    const choices = shuffle([target, ...popDistractors(POPULATION_2020[code], 3)]);
    choices.forEach((v) => {
      const btn = el("button", {}, formatPop(v));
      btn.addEventListener("click", () => {
        if (answered) return;
        answered = true;
        choiceGrid.querySelectorAll("button").forEach((b) => (b.disabled = true));
        const isCorrect = v === target;
        recordAnswer("population", code, isCorrect);
        if (isCorrect) {
          btn.classList.add("correct");
          correct++;
        } else {
          btn.classList.add("wrong");
          Array.from(choiceGrid.children).forEach((b) => { if (b.textContent === formatPop(target)) b.classList.add("correct"); });
        }
        feedback.className = "feedback " + (isCorrect ? "ok" : "bad");
        feedback.innerHTML = feedbackHtml(isCorrect, `${name}'s 2020 Census population was about ${formatPop(target)}.`);
        app.appendChild(nextButtonRow(i + 1 >= queue.length, () => {
          i++;
          if (i < queue.length) renderQuestion(); else renderEnd("population", correct, queue.length, playPopulation);
        }));
      });
      choiceGrid.appendChild(btn);
    });
    app.appendChild(choiceGrid);
    app.appendChild(feedback);
  }
  renderQuestion();
}

// ---------- Mode 9: Natural World (bird/flower/tree/crop/animal, either direction) ----------
function natureOwnValues(code, cat) {
  if (cat === "animal") return NATURE[code].animals;
  if (cat === "crop") return NATURE[code].crops;
  return [NATURE[code][cat]];
}
function natureAvailableCategories(code) {
  const cats = ["bird", "flower", "tree"];
  if (NATURE[code].animals.length) cats.push("animal");
  if (NATURE[code].crops.length) cats.push("crop");
  return cats;
}
function natureForwardPrompt(cat, stateName) {
  return {
    bird: `What is ${stateName}'s state bird?`,
    flower: `What is ${stateName}'s state flower?`,
    tree: `What is ${stateName}'s state tree?`,
    animal: `Which of these animals is native to ${stateName}?`,
    crop: `Which of these is a well-known crop grown in ${stateName}?`,
  }[cat];
}
function natureReversePrompt(cat, value) {
  return {
    bird: `The ${value} is the state bird of which state?`,
    flower: `The ${value} is the state flower of which state?`,
    tree: `The ${value} is the state tree of which state?`,
    animal: `Which state is home to the ${value}?`,
    crop: `Which state is known for growing ${value}?`,
  }[cat];
}
function natureRevealPhrase(dir, cat, stateName, value) {
  if (dir === "forward") {
    return {
      bird: `${stateName}'s state bird is the ${value}.`,
      flower: `${stateName}'s state flower is the ${value}.`,
      tree: `${stateName}'s state tree is the ${value}.`,
      animal: `The ${value} is a native animal of ${stateName}.`,
      crop: `One of the well-known crops grown in ${stateName} is ${value}.`,
    }[cat];
  }
  return {
    bird: `The ${value} is the state bird of ${stateName}.`,
    flower: `The ${value} is the state flower of ${stateName}.`,
    tree: `The ${value} is the state tree of ${stateName}.`,
    animal: `The ${value} is native to ${stateName}.`,
    crop: `${stateName} is known for growing ${value}.`,
  }[cat];
}
function playNature() {
  const queue = buildQueue("nature", ALL_CODES, ROUND_SIZE).map((code) => {
    const cat = sample(natureAvailableCategories(code), 1)[0];
    const value = sample(natureOwnValues(code, cat), 1)[0];
    const dir = Math.random() < 0.5 ? "forward" : "reverse";
    return { code, cat, value, dir };
  });
  let i = 0, correct = 0;

  function renderQuestion() {
    app.innerHTML = "";
    const { code, cat, value, dir } = queue[i];
    const stateName = STATE_NAMES[code];

    app.appendChild(el(
      "div", { class: "prompt" },
      dir === "forward" ? natureForwardPrompt(cat, stateName) : natureReversePrompt(cat, value)
    ));
    app.appendChild(progressLine(i, queue.length, correct));

    const feedback = el("div", { class: "feedback" });
    let answered = false;
    const choiceGrid = el("div", { class: "choice-grid" });

    function reveal(isCorrect) {
      recordAnswer("nature", code, isCorrect);
      if (isCorrect) correct++;
      feedback.className = "feedback " + (isCorrect ? "ok" : "bad");
      feedback.innerHTML = feedbackHtml(isCorrect, natureRevealPhrase(dir, cat, stateName, value));
      app.appendChild(nextButtonRow(i + 1 >= queue.length, () => {
        i++;
        if (i < queue.length) renderQuestion(); else renderEnd("nature", correct, queue.length, playNature);
      }));
    }

    if (dir === "forward") {
      // Choices are values (bird/flower/tree/animal/crop names). Distractors
      // come from other states' values for the same category, excluding
      // anything that's also true for this state, so only one choice is
      // ever correct even when a state has more than one crop or animal.
      const ownSet = new Set(natureOwnValues(code, cat));
      const pool = [];
      ALL_CODES.forEach((c) => {
        if (c === code) return;
        natureOwnValues(c, cat).forEach((v) => { if (!ownSet.has(v) && !pool.includes(v)) pool.push(v); });
      });
      const choices = shuffle([value, ...sample(pool, 3)]);
      choices.forEach((v) => {
        const btn = el("button", {}, v);
        btn.addEventListener("click", () => {
          if (answered) return;
          answered = true;
          choiceGrid.querySelectorAll("button").forEach((b) => (b.disabled = true));
          const isCorrect = v === value;
          if (isCorrect) {
            btn.classList.add("correct");
          } else {
            btn.classList.add("wrong");
            Array.from(choiceGrid.children).forEach((b) => { if (b.textContent === value) b.classList.add("correct"); });
          }
          reveal(isCorrect);
        });
        choiceGrid.appendChild(btn);
      });
    } else {
      // Choices are state names. Distractors are states whose own values for
      // this category don't include the target value, so only one choice is
      // ever correct.
      const pool = ALL_CODES.filter((c) => {
        if (c === code) return false;
        const own = natureOwnValues(c, cat);
        return own.length > 0 && !own.includes(value);
      });
      const choices = shuffle([code, ...sample(pool, 3)]);
      choices.forEach((c) => {
        const btn = el("button", {}, STATE_NAMES[c]);
        btn.addEventListener("click", () => {
          if (answered) return;
          answered = true;
          choiceGrid.querySelectorAll("button").forEach((b) => (b.disabled = true));
          const isCorrect = c === code;
          if (isCorrect) {
            btn.classList.add("correct");
          } else {
            btn.classList.add("wrong");
            Array.from(choiceGrid.children).forEach((b) => { if (b.textContent === stateName) b.classList.add("correct"); });
          }
          reveal(isCorrect);
        });
        choiceGrid.appendChild(btn);
      });
    }
    app.appendChild(choiceGrid);
    app.appendChild(feedback);
  }
  renderQuestion();
}

if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
(function boot() {
  const profiles = listProfiles();
  if (profiles.length === 0) return renderSetup(1);
  if (profiles.length === 1 && !profiles[0].corrupted) {
    data = load(profiles[0].key);
    if (data) { applyIdentity(); return renderHome(); }
  }
  renderPicker();
})();
