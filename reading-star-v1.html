<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Star</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#2A5D9F">
<style>
  :root {
    --bg: #FDF6EC; --text: #2A3A50; --card: #FFFFFF; --card-shadow: rgba(42,58,80,.10);
    --accent: #2A5D9F; --accent-soft: #E3EDF9; --green: #2E8B57; --green-soft: #DCEBDD; --green-dark: #2E6B45;
    --danger: #C4553B; --gold: #E8A013; --gold-soft: #FBEBC8;
    --soft: #F2EBDD; --soft-text: #8A6A3B; --chip: #EDE4D3; --muted: #6B7686; --border: #C9CDD4;
    --line: #EDE4D3; --input-bg: #FFFDF8; --eyebrow: #B0763A; --body-text: #4A5568;
  }
  body[data-theme="mint"] {
    --bg: #EDF7F4; --text: #1F3D38; --card: #FFFFFF; --card-shadow: rgba(31,61,56,.10);
    --accent: #1F7A70; --accent-soft: #D8EFEA; --green: #2E8B57; --green-soft: #DCEBDD; --green-dark: #256B45;
    --danger: #C4553B; --gold: #D99114; --gold-soft: #FBEBC8;
    --soft: #DDEFE9; --soft-text: #2F6B5E; --chip: #D8EAE4; --muted: #5C7370; --border: #B9CFC9;
    --line: #DCEAE5; --input-bg: #FBFEFD; --eyebrow: #1F7A70; --body-text: #3D5A54;
  }
  body[data-theme="lavender"] {
    --bg: #F5F1FA; --text: #372B4E; --card: #FFFFFF; --card-shadow: rgba(55,43,78,.10);
    --accent: #6A4FA3; --accent-soft: #EAE3F6; --green: #2E8B57; --green-soft: #DCEBDD; --green-dark: #2E6B45;
    --danger: #C4553B; --gold: #D99114; --gold-soft: #F9EBC9;
    --soft: #ECE5F5; --soft-text: #5D4A85; --chip: #E6DEF2; --muted: #6E6482; --border: #C8BEDB;
    --line: #E6DFF1; --input-bg: #FDFCFE; --eyebrow: #6A4FA3; --body-text: #4C4163;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Lexend', 'Trebuchet MS', 'Comic Sans MS', sans-serif;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--eyebrow); letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; }
  h2 { margin: 0 0 6px; font-size: 20px; font-weight: 800; }
  .card { background: var(--card); border-radius: 20px; padding: 24px; box-shadow: 0 2px 10px var(--card-shadow); margin-bottom: 16px; }
  button { font-family: inherit; font-weight: 600; font-size: 15px; padding: 10px 18px; border-radius: 14px; border: none; background: var(--accent); color: #fff; cursor: pointer; letter-spacing: .02em; }
  button.big { font-size: 20px; padding: 16px 28px; }
  button.outline { background: transparent; border: 2.5px solid var(--accent); color: var(--accent); }
  button.green { background: var(--green); }
  button.gold { background: var(--gold); color: var(--text); }
  button.danger { background: var(--danger); }
  button.link { background: none; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px; }
  button:disabled { background: var(--border); color: #fff; cursor: default; border-color: var(--border); }
  button.small { font-size: 13px; padding: 7px 12px; border-radius: 10px; }
  input[type=text], input[type=password], input[type=number], input[type=date] {
    font-family: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border);
    width: 100%; margin-bottom: 8px; background: var(--input-bg); color: var(--text);
  }
  textarea { font-family: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border); width: 100%; margin-bottom: 8px; background: var(--input-bg); color: var(--text); resize: vertical; }
  select { font-family: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border); background: var(--input-bg); color: var(--text); width: 100%; margin-bottom: 8px; }
  label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin: 10px 0 2px; }
  .hint { background: var(--soft); border-radius: 14px; padding: 14px 18px; font-size: 15px; line-height: 1.5; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 14px; }
  .chip { background: var(--chip); border-radius: 10px; padding: 4px 12px; font-size: 13px; display: inline-block; margin: 3px 3px 3px 0; }
  .center { text-align: center; }
  details { padding: 8px 0; border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; font-size: 15px; }
  .book-card { border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; cursor: pointer; }
  .book-card:hover { border-color: var(--accent); }
  .book-title { font-weight: 800; font-size: 17px; }
  .book-author { color: var(--muted); font-size: 13px; margin-top: 1px; }
  .badge { display: inline-block; border-radius: 8px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
  .badge.reading { background: var(--accent-soft); color: var(--accent); }
  .badge.finished { background: var(--green-soft); color: var(--green-dark); }
  .badge.abandoned { background: var(--chip); color: var(--muted); }
  .rating-row { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
  button.rating-btn { background: var(--card); color: var(--text); border: 2.5px solid var(--border); font-size: 14px; padding: 12px 10px; flex: 1; }
  button.rating-btn.sel { border-color: var(--gold); background: var(--gold-soft); }
  button.quiz-choice { background: var(--card); color: var(--text); border: 3px solid var(--border); display: block; width: 100%; text-align: left; margin-bottom: 10px; padding: 14px 16px; font-size: 16px; }
  button.quiz-choice.ok { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }
  button.quiz-choice.bad { border-color: var(--danger); background: #FBEAE6; color: var(--danger); }
  button.quiz-choice:disabled { opacity: .85; }
  .search-result { border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
  .search-result:hover { border-color: var(--accent); }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid var(--line); }
  .tabs button { background: none; color: var(--muted); border-radius: 12px 12px 0 0; padding: 10px 16px; }
  .tabs button.active { color: var(--accent); background: var(--accent-soft); }
  .swatch { width: 84px; height: 56px; border-radius: 14px; border: 3px solid var(--border); cursor: pointer; display: inline-flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-size: 12px; font-weight: 700; }
  .swatch.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Reading Star</div>
      <h1 id="greeting">Welcome! &#128214;</h1>
    </div>
    <button class="outline" id="homeBtn" style="display:none" onclick="lockAndHome()">Home</button>
  </header>
  <div id="app"></div>
</div>

<script>
// ============================================================================
// Reading Star v1 — Phase 0a/0b of docs/reading-star-spec.md. No sync yet
// (Phase 1): this file is a complete, offline, single-device app on its own,
// same as any other app before its sync phase (§8). data.events is kept as
// the append-only log the future sync phase will push verbatim (§3.1/§3.2);
// data.books is maintained alongside it, action by action, as the derived
// view the UI actually reads.
// ============================================================================

// ---------- Storage keys / profiles ----------
function listProfiles() {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith("readingstar-")) continue;
    try {
      const d = JSON.parse(localStorage.getItem(k));
      if (d && d.childName && d.pin) { out.push({ key: k, name: d.childName, corrupted: false }); continue; }
      out.push({ key: k, name: k.replace(/^readingstar-/, "") || "profile", corrupted: true });
    } catch(e) {
      out.push({ key: k, name: k.replace(/^readingstar-/, "") || "profile", corrupted: true });
    }
  }
  return out.sort((a,b) => a.name.localeCompare(b.name));
}
// Same slugging as Spelling/Math (parent-sync-spec §3 rule 5) so the same
// child name lands on a compatible key pattern across apps.
function childSlug(name) {
  const s = String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return s || "child";
}
function nameToKey(name) { return "readingstar-" + childSlug(name); }
let KEY = null;
let data = null;

const GRADES = ["K","1","2","3","4","5","6","7"];
// The controlled genre vocabulary (§4.2) — must match
// wordlists/reading/build-catalog.js's GENRE_VOCAB exactly, since a custom
// book's genre has to mean the same thing as a catalog book's.
const GENRE_VOCAB = [
  "adventure", "animal-fiction", "biography-nonfiction", "fantasy",
  "historical-fiction", "humor", "mystery", "realistic-fiction",
  "science-fiction", "poetry",
];
const RATINGS = [
  { v: 1, label: "Not for me" }, { v: 2, label: "It was okay" },
  { v: 3, label: "Pretty good" }, { v: 4, label: "Really liked it" },
  { v: 5, label: "Loved it!" },
];
// §7: a generic tier a parent sets from the phone, never a diagnosis label —
// this is the hook for future point weighting, not used for anything yet
// ("designed now, built later"). Must match parent.html's
// READING_SUPPORT_LEVELS exactly.
const READING_SUPPORT_LEVELS = [
  { v: "standard", label: "Standard" },
  { v: "extra-support", label: "Extra support" },
  { v: "significant-support", label: "Significant support" },
];

function freshData(childName, pin, childGrade) {
  return {
    childName, pin,
    childGrade: childGrade || "2",
    theme: "classic",
    events: [],
    books: [],
    catalogOverlay: {},
    readingSupportLevel: null,
  };
}
let lastLoadError = null;
function load(key) {
  lastLoadError = null;
  const raw = localStorage.getItem(key);
  if (!raw) return null;
  let d;
  try { d = JSON.parse(raw); } catch(e) { lastLoadError = "corrupted"; return null; }
  try {
    KEY = key;
    if (!d.theme) d.theme = "classic";
    if (!d.events) d.events = [];
    if (!d.books) d.books = [];
    if (!d.catalogOverlay) d.catalogOverlay = {};
    if (d.readingSupportLevel === undefined) d.readingSupportLevel = null;
    if (d.childGrade === undefined) d.childGrade = "2";
    return d;
  } catch(e) { lastLoadError = "corrupted"; return null; }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
  catch(e) { return false; }
}
function saveFailedBannerHtml() {
  return `<div class="card" style="background:var(--gold-soft);border:2px solid var(--gold)">
    <div style="font-weight:700;margin-bottom:4px">&#9888;&#65039; This wasn't saved</div>
    <div class="muted" style="font-size:14px">The device may be low on storage. Freeing up some space and trying again should fix it.</div>
  </div>`;
}

// ---------- Catalog (§4) ----------
// Bundled, fetched once at boot, no build step at runtime (§4.2). Falls back
// to an empty catalog if the fetch fails (e.g. very first offline load before
// the service worker has precached it) — custom titles still work either way.
let CATALOG = {};
let catalogLoaded = false;
async function loadCatalog() {
  try {
    const res = await fetch("./reading-catalog.json");
    CATALOG = await res.json();
  } catch(e) { CATALOG = {}; }
  catalogLoaded = true;
}
// Parent-authored/overridden books (§4.3) win by key over the bundled
// catalog. Entry shape is identical in both, so search, the quiz runner,
// and the book detail screen never know which one a book came from.
function effectiveCatalog() {
  return Object.assign({}, CATALOG, data.catalogOverlay || {});
}
function catalogSearch(term) {
  const t = term.trim().toLowerCase();
  if (!t) return [];
  return Object.entries(effectiveCatalog())
    .filter(([key, b]) => b.title.toLowerCase().includes(t) || (b.author || "").toLowerCase().includes(t) || (b.series || "").toLowerCase().includes(t))
    .map(([key, b]) => ({ key, ...b }))
    .slice(0, 20);
}
function knownSeriesNames() {
  const names = new Set();
  Object.values(effectiveCatalog()).forEach(b => { if (b.series) names.add(b.series); });
  (data.books || []).forEach(b => { if (b.series) names.add(b.series); });
  return [...names].sort();
}

// ---------- Helpers ----------
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function todayISO() { return new Date().toISOString().slice(0,10); }
function fmtDate(iso) { if (!iso) return ""; const d = new Date(iso); return d.toLocaleDateString(); }
// A fresh id per event, even for two events minted in the same gesture/ms
// (§3.2's caution about Date.now()-only ids).
let _idSeq = 0;
function freshId() { return Date.now() + "-" + (_idSeq++); }

function applyTheme() {
  document.body.dataset.theme = data && data.theme !== "classic" ? data.theme : "";
  if (data) document.getElementById("greeting").innerHTML = `Hi, ${esc(data.childName)}! &#128214;`;
}

// ---------- Event log + book cache (§3.1/§3.2) ----------
// Appends one event and returns it. `dateISO` defaults to now but every call
// site accepts an override — every event is backdatable (§9), not just start.
function addEvent(mode, book, extra, dateISO) {
  const e = Object.assign({
    id: freshId(),
    date: dateISO || new Date().toISOString(),
    mode,
    bookId: book.id,
    bookTitle: book.title,
    childGrade: data.childGrade,
    catalogId: book.catalogId || null,
    seriesKey: book.seriesKey || null,
    seriesNumber: book.seriesNumber || null,
    seriesName: book.series || null,
    genre: book.genre || [],
    gradeLevel: book.gradeLevel || null,
    author: book.author || null,
    score: null, total: null,
  }, extra || {});
  data.events.push(e);
  return e;
}

function findBook(bookId) { return data.books.find(b => b.id === bookId); }
function currentlyReading() { return data.books.filter(b => b.status === "reading"); }
function pastBooks() { return data.books.filter(b => b.status !== "reading").slice().reverse(); }

function startBook({ title, author, catalogId, series, seriesKey, seriesNumber, gradeLevel, genre, dateISO }) {
  const book = {
    id: crypto.randomUUID(), catalogId: catalogId || null,
    title, author: author || null,
    series: series || null, seriesKey: seriesKey || null, seriesNumber: seriesNumber || null,
    gradeLevel: gradeLevel || null, genre: genre || [],
    status: "reading", startedAt: dateISO || new Date().toISOString(), endedAt: null,
    sessions: [], rating: null, quizzes: [],
  };
  data.books.push(book);
  addEvent("start", book, {}, dateISO);
  return book;
}
// Nested session/quiz records reuse their event's own id, rather than minting
// a second one, so a parent's delete-session command (which names the id
// /api/sessions handed back — i.e. the event id) can find and remove the
// matching nested record. See applyRemoteSessionDelete below.
function logSession(book, { minutes, pages, note, dateISO }) {
  const e = addEvent("log-session", book, { minutes: minutes || null, pages: pages || null, note: note || "" }, dateISO);
  book.sessions.push({ id: e.id, at: e.date, minutes: e.minutes, pages: e.pages, note: e.note });
}
function finishBook(book, { rating, dateISO }) {
  const e = addEvent("finish", book, { rating }, dateISO);
  book.status = "finished"; book.endedAt = e.date; book.rating = rating;
}
function abandonBook(book, { dateISO }) {
  const e = addEvent("abandon", book, {}, dateISO);
  book.status = "abandoned"; book.endedAt = e.date;
}
function recordQuiz(book, { score, total, missed, dateISO }) {
  const e = addEvent("quiz", book, { score, total, missed: missed || [] }, dateISO);
  book.quizzes.push({ id: e.id, score, total, answeredAt: e.date, missed: missed || [] });
}
// Reconciling a custom book with a catalog entry (§9): sets catalogId and
// backfills classification on the book going forward. Does not touch
// scope_id/bookId or any past event — only events written after this point
// carry the corrected classification. Local-only; no new event mode, since
// nothing here is pushed anywhere yet (Phase 0b has no sync).
function reconcileBook(book, catalogEntry) {
  book.catalogId = catalogEntry.key;
  book.series = catalogEntry.series || book.series;
  book.seriesKey = catalogEntry.seriesKey || book.seriesKey;
  book.seriesNumber = catalogEntry.seriesNumber != null ? catalogEntry.seriesNumber : book.seriesNumber;
  book.gradeLevel = catalogEntry.gradeLevel || book.gradeLevel;
  if (catalogEntry.genre && catalogEntry.genre.length) book.genre = catalogEntry.genre;
}

// ---------- Router / lock ----------
const app = document.getElementById("app");
let parentUnlocked = false;
function lockAndHome() { parentUnlocked = false; go("home"); }
// Read by the sync module (§15.5): a command is only safe to apply once the
// kid has navigated off whatever they were mid-way through.
let currentView = "home";
function go(view, arg) {
  Q = null; // cancel any in-progress quiz — a stale answerQuiz() must not fire post-navigation
  currentView = view;
  syncApplyPending();
  document.getElementById("homeBtn").style.display = view === "home" ? "none" : "";
  if (view === "home") return renderHome();
  if (view === "startBook") return renderStartBook();
  if (view === "book") return renderBookDetail(arg);
  if (view === "logSession") return renderLogSession(arg);
  if (view === "finishBook") return renderFinishBook(arg);
  if (view === "quiz") return startQuiz(arg);
  if (view === "history") return renderHistoryKid();
  if (view === "parent") return parentGate();
}

// ---------- First-launch setup wizard ----------
const setup = { pin: null, name: null, pairingCode: null };
function renderSetup(step) {
  document.getElementById("homeBtn").style.display = "none";
  document.getElementById("greeting").innerHTML = "Welcome! &#128214;";
  parentUnlocked = false;
  if (step === 1) {
    app.innerHTML = `
      <div class="card center" style="padding:36px;max-width:420px;margin:0 auto">
        <div style="font-size:34px;margin-bottom:10px">&#128274;</div>
        <div style="font-weight:700;font-size:18px;margin-bottom:6px">Step 1 of 3 &mdash; Set a parent PIN</div>
        <div class="muted" style="margin-bottom:14px">You'll need this PIN to open the parent area, where you see reading history and settings.</div>
        <input type="password" id="pinIn" inputmode="numeric" maxlength="8" placeholder="New PIN (at least 4 digits)" style="text-align:center;font-size:22px;letter-spacing:.3em">
        <input type="password" id="pinIn2" inputmode="numeric" maxlength="8" placeholder="Repeat PIN" style="text-align:center;font-size:22px;letter-spacing:.3em">
        <div id="setupMsg" class="muted" style="min-height:20px;color:var(--danger)"></div>
        <button class="big" onclick="setupPin()" style="margin-top:8px">Continue &rarr;</button>
      </div>`;
    document.getElementById("pinIn").focus();
  } else if (step === 2) {
    app.innerHTML = `
      <div class="card center" style="padding:36px;max-width:420px;margin:0 auto">
        <div style="font-size:34px;margin-bottom:10px">&#128075;</div>
        <div style="font-weight:700;font-size:18px;margin-bottom:6px">Step 2 of 3 &mdash; Who's reading?</div>
        <div class="muted" style="margin-bottom:14px">This name appears throughout the app and on exported history.</div>
        <input type="text" id="nameIn" placeholder="Child's first name" style="text-align:center;font-size:20px">
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
          <label for="pairCodeIn" class="muted" style="font-size:13px">Pairing code from your parent's phone (optional)</label>
          <input type="text" id="pairCodeIn" placeholder="6-character code" maxlength="6" style="text-transform:uppercase;text-align:center;font-size:18px;letter-spacing:.2em">
          <div class="muted" style="font-size:12px;margin-top:4px">Skip this if you don't have one yet — you can pair from the parent area later.</div>
        </div>
        <div id="setupMsg" class="muted" style="min-height:20px;color:var(--danger)"></div>
        <button class="big" onclick="setupName()" style="margin-top:8px">Continue &rarr;</button>
      </div>`;
    document.getElementById("nameIn").focus();
  } else {
    app.innerHTML = `
      <div class="card center" style="padding:36px;max-width:420px;margin:0 auto">
        <div style="font-size:34px;margin-bottom:10px">&#127891;</div>
        <div style="font-weight:700;font-size:18px;margin-bottom:6px">Step 3 of 3 &mdash; What grade level?</div>
        <div class="muted" style="margin-bottom:16px">Used to keep reading history grouped by school year. You can change this later.</div>
        <div class="row center" style="justify-content:center;max-width:320px;margin:0 auto">
          ${GRADES.map(g => `<button class="outline" style="width:60px" onclick="setupFinish('${g}')">${g}</button>`).join("")}
        </div>
      </div>`;
  }
}
function setupPin() {
  const v = document.getElementById("pinIn").value.trim();
  const v2 = document.getElementById("pinIn2").value.trim();
  const msg = document.getElementById("setupMsg");
  if (v.length < 4) { msg.textContent = "PIN must be at least 4 digits."; return; }
  if (v !== v2) { msg.textContent = "PINs don't match — try again."; return; }
  setup.pin = v; renderSetup(2);
}
function setupName() {
  const v = document.getElementById("nameIn").value.trim();
  const msg = document.getElementById("setupMsg");
  if (!v) { msg.textContent = "Please enter a name."; return; }
  setup.name = v;
  setup.pairingCode = document.getElementById("pairCodeIn").value.trim().toUpperCase();
  renderSetup(3);
}
async function setupFinish(gradeLevel) {
  KEY = nameToKey(setup.name);
  const existing = localStorage.getItem(KEY);
  if (existing && !confirm(`This device already has saved data for a child named "${setup.name}". Continue and use that existing data?`)) return;
  if (existing) { data = load(KEY); }
  else { data = freshData(setup.name, setup.pin, gradeLevel); persist(); }
  applyTheme();
  // §6.2: a code typed in at setup gets this profile onto its parent-assigned
  // childId from its very first save — no local id ever minted to reconcile
  // away later.
  if (setup.pairingCode) {
    try {
      data.sync = await redeemPairingCode(setup.pairingCode, "/api", crypto.randomUUID());
      persist();
    } catch (err) {
      alert("Couldn't connect with that pairing code (" + err.message + "). You can try again anytime from the parent area → Settings.");
    }
  }
  go("home");
}

// ---------- Quiz (§5, §4.2) ----------
let Q = null; // { bookId, questions: [{...shuffledChoices}], idx, missed: [] }
function startQuiz(bookId) {
  const b = findBook(bookId);
  const cat = effectiveCatalog()[b.catalogId];
  const questions = shuffle(cat.questions).map(q => ({
    id: q.id, q: q.q,
    choices: shuffle([q.correct, ...q.wrong]),
    correct: q.correct,
  }));
  Q = { bookId, questions, idx: 0, missed: [], answered: false };
  renderQuizQuestion();
}
function renderQuizQuestion() {
  const total = Q.questions.length;
  const item = Q.questions[Q.idx];
  app.innerHTML = `
    <div class="card">
      <div class="muted" style="margin-bottom:8px">Question ${Q.idx + 1} of ${total}</div>
      <h2>${esc(item.q)}</h2>
      <div style="margin-top:14px">
        ${item.choices.map((c, i) => `<button class="quiz-choice" id="choice-${i}" onclick="answerQuiz(${i})">${esc(c)}</button>`).join("")}
      </div>
    </div>`;
}
function answerQuiz(i) {
  if (Q.answered) return;
  Q.answered = true;
  const item = Q.questions[Q.idx];
  const chosen = item.choices[i];
  const ok = chosen === item.correct;
  if (!ok) Q.missed.push(item.id);
  item.choices.forEach((c, j) => {
    const btn = document.getElementById("choice-" + j);
    btn.disabled = true;
    if (c === item.correct) btn.classList.add("ok");
    else if (j === i) btn.classList.add("bad");
  });
  setTimeout(() => {
    Q.answered = false;
    if (Q.idx < Q.questions.length - 1) { Q.idx++; renderQuizQuestion(); }
    else finishQuiz();
  }, 900);
}
function finishQuiz() {
  const b = findBook(Q.bookId);
  const total = Q.questions.length;
  const score = total - Q.missed.length;
  recordQuiz(b, { score, total, missed: Q.missed });
  const saved = persist();
  syncPush();
  app.innerHTML = `
    <div class="card center">
      <div style="font-size:40px;margin-bottom:8px">${score === total ? "&#127881;" : "&#128214;"}</div>
      <h2>${score} out of ${total}</h2>
      ${!saved ? saveFailedBannerHtml() : ""}
      <button class="big" style="margin-top:12px" onclick="go('book','${b.id}')">Done</button>
    </div>`;
  Q = null;
}

function resetProfile() {
  // catalogOverlay is content a parent authored (§4.3), not reading history —
  // kept through a reset the same way Spelling keeps its word lists.
  const kept = { childName: data.childName, pin: data.pin, childGrade: data.childGrade, theme: data.theme, catalogOverlay: data.catalogOverlay };
  if (!confirm(`This clears ALL of ${kept.childName}'s reading history — every book, session, and quiz — back to zero. This can't be undone. Continue?`)) return;
  data = Object.assign(freshData(kept.childName, kept.pin, kept.childGrade), kept);

function deleteProfile() {
  const name = data.childName;
  const enteredPin = prompt(`Type ${name}'s PIN to permanently delete this profile:`);
  if (enteredPin === null) return;
  if (enteredPin !== data.pin) { alert("Wrong PIN — nothing was deleted."); return; }
  if (!confirm(`This permanently deletes ${name}'s entire reading profile. This can't be undone. Continue?`)) return;
  try { localStorage.removeItem(KEY); } catch(e) {}
  data = null; KEY = null;
  parentUnlocked = false;
  if (listProfiles().length === 0) renderSetup(1);
  else renderPicker();
}
function exportCSV() {
  const rows = [["child","status","title","author","series","seriesNumber","started","ended","sessions","minutesTotal","pagesTotal","rating","bestQuizScore","bestQuizTotal"]];
  data.books.forEach(b => {
    const minutesTotal = b.sessions.reduce((n,s) => n + (s.minutes||0), 0);
    const pagesTotal = b.sessions.reduce((n,s) => n + (s.pages||0), 0);
    const best = b.quizzes.length ? b.quizzes.reduce((m,q) => q.score/q.total > m.score/m.total ? q : m) : null;
    rows.push([
      data.childName, b.status, b.title, b.author||"", b.series||"", b.seriesNumber||"",
      fmtDate(b.startedAt), fmtDate(b.endedAt), b.sessions.length, minutesTotal, pagesTotal,
      b.rating||"", best?best.score:"", best?best.total:"",
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${childSlug(data.childName)}-reading-history.csv`;
  a.click();
}

// ---------- Sync (docs/parent-sync-spec.md §7, §8; reading-star-spec.md §3.3) ----------
// Transport (pairing, push-on-persist, ackedIds, retry) is pasted in from
// Spelling/Math unchanged (§3 rule 5) — only SYNC_APP and the syncState()/
// applyCommand() seam differ, per reading-star-spec.md §3.2. Fire-and-forget:
// nothing here blocks a render, and a sync failure is never visible to the
// child.
const SYNC_APP = "reading";

function syncReady() { return !!(data.sync && data.sync.enabled && data.sync.deviceToken); }
function syncEndpoint() { return (data.sync && data.sync.endpoint) || "/api"; }

async function syncApi(path, body) {
  const res = await fetch(syncEndpoint() + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + data.sync.deviceToken },
    cache: "no-store",
    body: JSON.stringify(body),
  });
  let json = null;
  try { json = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((json && json.error) || ("sync failed (" + res.status + ")"));
  return json;
}

// One child, one childId, across all apps (§6.2) — shared the same way
// Spelling/Math do, keyed by the profile's name slug.
function sharedChildIdKey() { return "starhomeschool-childid-" + childSlug(data.childName); }
function sharedChildId() {
  let id = null;
  try { id = localStorage.getItem(sharedChildIdKey()); } catch(e) {}
  if (id) return id;
  id = (data.sync && data.sync.childId) || crypto.randomUUID();
  try { localStorage.setItem(sharedChildIdKey(), id); } catch(e) {}
  return id;
}
function syncChildId() {
  if (!data.sync) return null;
  const shared = sharedChildId();
  if (data.sync.childId !== shared) {
    data.sync.childId = shared;
    data.sync.ackedIds = [];
    persist();
  }
  return data.sync.childId;
}

// Always calls /api/sync, even with nothing pending — the response is how a
// parent's command reaches this device (§15.2).
let syncLastPullAt = 0;
function syncPush() {
  if (!syncReady()) return;
  syncLastPullAt = Date.now();
  const childId = syncChildId();
  const acked = new Set(data.sync.ackedIds || []);
  const pending = data.events.filter(e => !acked.has(e.id));
  syncApi("/sync", {
    app: SYNC_APP, childId, childName: data.childName, sessions: pending,
    state: syncState(),
    applied: data.sync.appliedCommandIds || [],
  })
    .then(res => {
      if (!res) return;
      if (Array.isArray(res.accepted) && res.accepted.length) {
        const merged = new Set([...(data.sync.ackedIds || []), ...res.accepted]);
        data.sync.ackedIds = [...merged].slice(-1000);
      }
      data.sync.lastPushAt = Date.now();
      persist();
      if (Array.isArray(res.commands) && res.commands.length) syncQueueCommands(res.commands);
    })
    .catch(() => { /* best-effort — the next event or boot retries */ });
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (Date.now() - syncLastPullAt < 60000) return;
  syncPush();
});

function syncDelete(ids) {
  if (!syncReady() || !ids.length) return;
  syncApi("/delete", { app: SYNC_APP, childId: syncChildId(), sessionIds: ids }).catch(() => {});
}

// ---------- Parent -> child commands (§15) ----------
// syncState()/applyCommand() are the declared per-app seam (§3 rule 5);
// everything above is byte-identical to Spelling/Math.

// §15.4: what this tablet has right now, so the catalog-editor Assign tab
// (§4.3) can offer real edit-versus-create choices. The bundled catalog gets
// only a thin index — key, title, author, question count — since it can grow
// into a full quiz bank and the parent doesn't need the text until they open
// one book to edit it (the dashboard fetches reading-catalog.json itself for
// that). The overlay is the parent's own content, small by construction, so
// it rides along in full: that's what lets the editor prefill a book already
// being edited.
function syncState() {
  return {
    childGrade: data.childGrade,
    grades: GRADES,
    currentlyReading: currentlyReading().length,
    catalogIndex: Object.entries(CATALOG).map(([key, b]) => ({
      key, title: b.title, author: b.author || "", questionCount: (b.questions || []).length,
    })),
    catalogOverlay: data.catalogOverlay || {},
    readingSupportLevel: data.readingSupportLevel,
  };
}

// A command arrives from a network callback that can fire at any moment,
// including mid-quiz. Nothing is applied until the kid is somewhere safe
// (§15.5) — see syncSafeToApply and go()'s `Q = null`.
let syncPendingCommands = [];
function syncSafeToApply() { return Q === null; }

function syncQueueCommands(commands) {
  syncPendingCommands = syncPendingCommands.concat(commands);
  syncApplyPending(true);
}

function syncApplyPending(repaint) {
  if (!data || !data.sync || !syncPendingCommands.length || !syncSafeToApply()) return;
  const queue = syncPendingCommands;
  syncPendingCommands = [];
  const done = new Set(data.sync.appliedCommandIds || []);
  let changed = false;
  for (const cmd of queue) {
    if (!cmd || !cmd.id || done.has(cmd.id)) continue;
    try { if (applyCommand(cmd)) changed = true; } catch (e) {}
    done.add(cmd.id);
  }
  data.sync.appliedCommandIds = [...done].slice(-200);
  persist();
  if (changed && repaint && !parentUnlocked && currentView === "home") renderHome();
}

function applyCommand(cmd) {
  const p = cmd.payload || {};
  if (cmd.kind === "delete-session") return applyRemoteSessionDelete(p.sessionIds);
  if (cmd.kind === "assign-book") return applyAssignBook(p.book);
  if (cmd.kind === "delete-book") return applyDeleteBook(p.key);
  if (cmd.kind === "set-reading-support-level") return applySetReadingSupportLevel(p.level);
  return false;
}

// §7: stored for a future computePoints() to read — v1 has no formula yet,
// so applying this command only stores the value. The parent sets it from
// the phone; the kid never sees or sets it on the tablet.
function applySetReadingSupportLevel(level) {
  if (!READING_SUPPORT_LEVELS.some(l => l.v === level)) return false;
  data.readingSupportLevel = level;
  return true;
}

// §4.3: the bundled catalog is a static asset the app can't rewrite, so a
// parent's add/edit lands as an override in data.catalogOverlay, keyed by
// book_key like the bundle itself — editing a bundled book just means the
// overlay entry at that key now wins (effectiveCatalog()). Replaces by key,
// not by name, per §4.1/§4.3: identity is the authored key, so re-sending one
// is an edit, never a second book.
function applyAssignBook(book) {
  if (!book || !book.key || !book.title) return false;
  data.catalogOverlay[book.key] = {
    series: book.series || null, seriesKey: book.seriesKey || null, seriesNumber: book.seriesNumber || null,
    title: book.title, author: book.author || "", gradeLevel: book.gradeLevel || "",
    genre: Array.isArray(book.genre) ? book.genre : [],
    questions: Array.isArray(book.questions) ? book.questions : [],
  };
  return true;
}
// Removes only the overlay entry. A bundled book at the same key, if any,
// reappears rather than being tombstoned — there is no mechanism to hide a
// bundled entry, only to override it, and this is the inverse of an override.
function applyDeleteBook(key) {
  if (!key || !(key in data.catalogOverlay)) return false;
  delete data.catalogOverlay[key];
  return true;
}

// Reading-specific, not pasted in unchanged from Spelling (reading-star-spec
// §3.3 finding 4): the local model nests sessions/quizzes inside a book
// rather than keeping one flat data.sessions array, so this walks both.
// Nested records share their originating event's id (see logSession /
// recordQuiz / finishBook / abandonBook), which is what makes them findable
// here — the id a parent deletes is always the event id.
function applyRemoteSessionDelete(ids) {
  const wanted = new Set((Array.isArray(ids) ? ids : []).map(String));
  if (!wanted.size) return false;
  let changed = false;
  const beforeEvents = data.events.length;
  data.events = data.events.filter(e => !wanted.has(String(e.id)));
  if (data.events.length !== beforeEvents) changed = true;
  data.books.forEach(b => {
    const beforeS = b.sessions.length;
    b.sessions = b.sessions.filter(s => !wanted.has(String(s.id)));
    if (b.sessions.length !== beforeS) changed = true;
    const beforeQ = b.quizzes.length;
    b.quizzes = b.quizzes.filter(q => !wanted.has(String(q.id)));
    if (b.quizzes.length !== beforeQ) changed = true;
  });
  return changed;
}

// Redeems a pairing code and builds the resulting data.sync block. Shared by
// the Settings "Connect" button and the first-launch wizard.
async function redeemPairingCode(code, endpoint, deviceId) {
  const res = await fetch(endpoint + "/pair", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    cache: "no-store",
    body: JSON.stringify({ code, deviceId, role: "child", label: data.childName + "'s device" }),
  });
  let json = null;
  try { json = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((json && json.error) || "Could not connect — check the code and try again.");
  const childId = json.childId || sharedChildId();
  try { localStorage.setItem(sharedChildIdKey(), childId); } catch(e) {}
  return {
    enabled: true, endpoint,
    childId,
    deviceId, deviceToken: json.token, ackedIds: [], appliedCommandIds: [], lastPushAt: null,
  };
}

async function connectSync() {
  const code = document.getElementById("syncCodeIn").value.trim().toUpperCase();
  const endpointIn = document.getElementById("syncEndpointIn").value.trim();
  const msg = document.getElementById("syncMsg");
  if (!code) { msg.textContent = "Enter the code shown on your phone."; return; }
  msg.textContent = "Connecting…";
  const endpoint = endpointIn || "/api";
  const deviceId = (data.sync && data.sync.deviceId) || crypto.randomUUID();
  try {
    data.sync = await redeemPairingCode(code, endpoint, deviceId);
    persist();
    renderParent("settings");
    syncPush();
  } catch (err) {
    msg.textContent = err.message + " If it keeps failing, generate a fresh code on your phone and try again.";
  }
}
function disableSync() { if (!data.sync) return; data.sync.enabled = false; persist(); renderParent("settings"); }
function enableSync() { if (!data.sync) return; data.sync.enabled = true; persist(); renderParent("settings"); syncPush(); }
function resyncNow() {
  if (!data.sync || !data.sync.deviceToken) return;
  data.sync.ackedIds = []; // safe: /api/sync is an idempotent upsert
  persist();
  syncPush();
}

function syncSettingsHtml() {
  const s = data.sync;
  if (s && s.deviceToken) {
    return `
      <div class="muted">${s.enabled ? "Sending reading history to your phone, and picking up anything you send from it." : "Sync is paused on this device."}</div>
      <div class="muted" style="margin-bottom:10px">Last synced: ${s.lastPushAt ? new Date(s.lastPushAt).toLocaleString() : "not yet"}</div>
      <div class="row">
        ${s.enabled ? `<button class="outline" onclick="disableSync()">Pause sync</button>` : `<button onclick="enableSync()">Resume sync</button>`}
        <button class="outline" onclick="resyncNow()">Resync now</button>
      </div>
      <div class="muted" style="margin-top:8px">To stop this device permanently, revoke it from the parent dashboard on your phone (Devices tab).</div>`;
  }
  return `
    <p class="muted">On your phone, open the parent dashboard &rarr; Devices &rarr; "Add a device" &rarr; "Child's tablet," then type the code it shows here.</p>
    <label for="syncCodeIn">Pairing code</label>
    <input type="text" id="syncCodeIn" placeholder="6-character code" maxlength="6" style="text-transform:uppercase;text-align:center;font-size:22px;letter-spacing:.25em">
    <details style="margin:6px 0">
      <summary class="muted" style="cursor:pointer">Advanced: custom sync server</summary>
      <label for="syncEndpointIn" style="margin-top:6px">Sync server URL (leave blank for the default)</label>
      <input type="text" id="syncEndpointIn" placeholder="https://your-worker.workers.dev/api">
    </details>
    <button onclick="connectSync()">Connect</button>
    <div class="muted" id="syncMsg" style="color:var(--danger);min-height:16px"></div>`;
}

// ---------- Boot ----------
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
(async function boot() {
  await loadCatalog();
  const profiles = listProfiles();
  if (profiles.length === 0) renderSetup(1);
  else if (profiles.length === 1) pickProfile(profiles[0].key);
  else renderPicker();
})();
</script>
</body>
</html>
