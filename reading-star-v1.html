<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Star</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#2A5D9F">
<style>
  :root {
    --bg: #FDF6EC; --text: #2A3A50; --card: #FFFFFF; --card-shadow: rgba(42,58,80,.10);
    --accent: #2A5D9F; --accent-soft: #E3EDF9; --green: #2E8B57; --green-soft: #DCEBDD; --green-dark: #2E6B45;
    --danger: #C4553B; --gold: #E8A013; --gold-soft: #FBEBC8;
    --soft: #F2EBDD; --soft-text: #8A6A3B; --chip: #EDE4D3; --muted: #6B7686; --border: #C9CDD4;
    --line: #EDE4D3; --input-bg: #FFFDF8; --eyebrow: #B0763A; --body-text: #4A5568;
  }
  body[data-theme="mint"] {
    --bg: #EDF7F4; --text: #1F3D38; --card: #FFFFFF; --card-shadow: rgba(31,61,56,.10);
    --accent: #1F7A70; --accent-soft: #D8EFEA; --green: #2E8B57; --green-soft: #DCEBDD; --green-dark: #256B45;
    --danger: #C4553B; --gold: #D99114; --gold-soft: #FBEBC8;
    --soft: #DDEFE9; --soft-text: #2F6B5E; --chip: #D8EAE4; --muted: #5C7370; --border: #B9CFC9;
    --line: #DCEAE5; --input-bg: #FBFEFD; --eyebrow: #1F7A70; --body-text: #3D5A54;
  }
  body[data-theme="lavender"] {
    --bg: #F5F1FA; --text: #372B4E; --card: #FFFFFF; --card-shadow: rgba(55,43,78,.10);
    --accent: #6A4FA3; --accent-soft: #EAE3F6; --green: #2E8B57; --green-soft: #DCEBDD; --green-dark: #2E6B45;
    --danger: #C4553B; --gold: #D99114; --gold-soft: #F9EBC9;
    --soft: #ECE5F5; --soft-text: #5D4A85; --chip: #E6DEF2; --muted: #6E6482; --border: #C8BEDB;
    --line: #E6DFF1; --input-bg: #FDFCFE; --eyebrow: #6A4FA3; --body-text: #4C4163;
  }
  /* Stable: oat and hay for the page, saddle tan for the accent, pasture green
     kept in the same slot the other themes use for "good/finished" so the
     badges and buttons that key off --green keep meaning the same thing. */
  body[data-theme="horse"] {
    --bg: #F6EEE2; --text: #3B2A1C; --card: #FFFDF9; --card-shadow: rgba(59,42,28,.12);
    --accent: #8A5A2B; --accent-soft: #F0E2CE; --green: #5C7A45; --green-soft: #E1E9D6; --green-dark: #466034;
    --danger: #B04A32; --gold: #C98A1E; --gold-soft: #F7E6C4;
    --soft: #EFE2CF; --soft-text: #7A5326; --chip: #E9DAC3; --muted: #7C6A57; --border: #C9B394;
    --line: #E7D8C2; --input-bg: #FFFCF6; --eyebrow: #8A5A2B; --body-text: #4E3B29;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Lexend', 'Trebuchet MS', 'Comic Sans MS', sans-serif;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--eyebrow); letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; }
  h2 { margin: 0 0 6px; font-size: 20px; font-weight: 800; }
  .card { background: var(--card); border-radius: 20px; padding: 24px; box-shadow: 0 2px 10px var(--card-shadow); margin-bottom: 16px; }
  button { font-family: inherit; font-weight: 600; font-size: 15px; padding: 10px 18px; border-radius: 14px; border: none; background: var(--accent); color: #fff; cursor: pointer; letter-spacing: .02em; }
  button.big { font-size: 20px; padding: 16px 28px; }
  button.outline { background: transparent; border: 2.5px solid var(--accent); color: var(--accent); }
  button.green { background: var(--green); }
  button.gold { background: var(--gold); color: var(--text); }
  button.danger { background: var(--danger); }
  button.link { background: none; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px; }
  button:disabled { background: var(--border); color: #fff; cursor: default; border-color: var(--border); }
  button.small { font-size: 13px; padding: 7px 12px; border-radius: 10px; }
  input[type=text], input[type=password], input[type=number], input[type=date] {
    font-family: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border);
    width: 100%; margin-bottom: 8px; background: var(--input-bg); color: var(--text);
  }
  textarea { font-family: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border); width: 100%; margin-bottom: 8px; background: var(--input-bg); color: var(--text); resize: vertical; }
  select { font-family: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border); background: var(--input-bg); color: var(--text); width: 100%; margin-bottom: 8px; }
  label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin: 10px 0 2px; }
  .hint { background: var(--soft); border-radius: 14px; padding: 14px 18px; font-size: 15px; line-height: 1.5; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 14px; }
  .chip { background: var(--chip); border-radius: 10px; padding: 4px 12px; font-size: 13px; display: inline-block; margin: 3px 3px 3px 0; }
  .center { text-align: center; }
  details { padding: 8px 0; border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; font-size: 15px; }
  .book-card { border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; cursor: pointer; }
  .book-card:hover { border-color: var(--accent); }
  .book-title { font-weight: 800; font-size: 17px; }
  .book-author { color: var(--muted); font-size: 13px; margin-top: 1px; }
  .badge { display: inline-block; border-radius: 8px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
  .badge.reading { background: var(--accent-soft); color: var(--accent); }
  .badge.finished { background: var(--green-soft); color: var(--green-dark); }
  .badge.abandoned { background: var(--chip); color: var(--muted); }
  .rating-row { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
  button.rating-btn { background: var(--card); color: var(--text); border: 2.5px solid var(--border); font-size: 14px; padding: 12px 10px; flex: 1; }
  button.rating-btn.sel { border-color: var(--gold); background: var(--gold-soft); }
  button.quiz-choice { background: var(--card); color: var(--text); border: 3px solid var(--border); display: block; width: 100%; text-align: left; margin-bottom: 10px; padding: 14px 16px; font-size: 16px; }
  button.quiz-choice.ok { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }
  button.quiz-choice.bad { border-color: var(--danger); background: #FBEAE6; color: var(--danger); }
  button.quiz-choice:disabled { opacity: .85; }
  .search-result { border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
  .search-result:hover { border-color: var(--accent); }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid var(--line); }
  .tabs button { background: none; color: var(--muted); border-radius: 12px 12px 0 0; padding: 10px 16px; }
  .tabs button.active { color: var(--accent); background: var(--accent-soft); }
  .swatch { width: 84px; height: 56px; border-radius: 14px; border: 3px solid var(--border); cursor: pointer; display: inline-flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-size: 12px; font-weight: 700; }
  .swatch.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

  /* ---- Bookshelf ---- every spine here is derived from data.books at render
     time (see spineKeyFor); nothing below reads or writes persisted state. */
  .shelf-row { position: relative; margin-bottom: 2px; }
  .shelf-books { display: flex; align-items: flex-end; gap: 1px; padding: 0 2px; min-height: 24px; }
  .shelf-books.empty { justify-content: center; }
  .spine { flex: none; background-repeat: no-repeat; position: relative; }
  /* 5-star books get a small gold foil dot near the head of the spine. */
  .spine.loved::after {
    content: ""; position: absolute; left: 50%; top: 8%; width: 7px; height: 7px; margin-left: -3.5px;
    border-radius: 50%; background: #F2C230; box-shadow: 0 0 0 1.5px rgba(90,60,10,.55);
  }
  /* Only spines wide enough to hold a legible glyph column get a title (see
     SPINE_TITLE_MIN_W); narrower ones stay title-on-hover/tap as before. */
  .spine-title {
    position: absolute; top: 18%; bottom: 6%; left: 50%; transform: translateX(-50%);
    writing-mode: vertical-rl; text-orientation: mixed;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: rgba(255,255,255,.95); text-shadow: 0 0 2px rgba(0,0,0,.65), 0 1px 1px rgba(0,0,0,.5);
    font-weight: 700; letter-spacing: .2px; pointer-events: none;
  }
  .shelf-plank { height: 15px; background-image: url(./reading-shelf.png); background-size: 100% 100%; border-radius: 0 0 3px 3px; }
  .bookend { flex: none; align-self: flex-end; background-image: url(./reading-bookend.png); background-size: 100% 100%; }
  /* Sprite faces right; on the left end that points into the stack, so only
     the left bookend gets flipped — both ends should face away from the books. */
  .bookend.left { transform: scaleX(-1); }
  .shelf-caption { font-size: 13px; color: var(--muted); margin-top: 8px; }
  /* The new spine drops in and settles once, then stays put. */
  @keyframes shelve {
    0%   { transform: translateY(-46px) rotate(-9deg); opacity: 0; }
    55%  { transform: translateY(0) rotate(4deg); opacity: 1; }
    75%  { transform: translateY(0) rotate(-2deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  .spine.shelving { animation: shelve .85s cubic-bezier(.34,1.3,.64,1) both; transform-origin: 50% 100%; }
  @keyframes plank-settle { 0%,100% { transform: translateY(0); } 60% { transform: translateY(2px); } }
  .shelf-row.shelving .shelf-plank { animation: plank-settle .5s ease-out .42s; }
  @media (prefers-reduced-motion: reduce) {
    .spine.shelving, .shelf-row.shelving .shelf-plank { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Reading Star</div>
      <h1 id="greeting">Welcome! &#128214;</h1>
    </div>
    <button class="outline" id="homeBtn" style="display:none" onclick="lockAndHome()">Home</button>
  </header>
  <div id="app"></div>
</div>

<script>
// ============================================================================
// Reading Star v1 — Phase 0a/0b of docs/reading-star-spec.md. No sync yet
// (Phase 1): this file is a complete, offline, single-device app on its own,
// same as any other app before its sync phase (§8). data.events is kept as
// the append-only log the future sync phase will push verbatim (§3.1/§3.2);
// data.books is maintained alongside it, action by action, as the derived
// view the UI actually reads.
// ============================================================================

// ---------- Storage keys / profiles ----------
function listProfiles() {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith("readingstar-")) continue;
    try {
      const d = JSON.parse(localStorage.getItem(k));
      if (d && d.childName && d.pin) { out.push({ key: k, name: d.childName, corrupted: false }); continue; }
      out.push({ key: k, name: k.replace(/^readingstar-/, "") || "profile", corrupted: true });
    } catch(e) {
      out.push({ key: k, name: k.replace(/^readingstar-/, "") || "profile", corrupted: true });
    }
  }
  return out.sort((a,b) => a.name.localeCompare(b.name));
}
// Same slugging as Spelling/Math (parent-sync-spec §3 rule 5) so the same
// child name lands on a compatible key pattern across apps.
function childSlug(name) {
  const s = String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return s || "child";
}
function nameToKey(name) { return "readingstar-" + childSlug(name); }
let KEY = null;
let data = null;

const GRADES = ["K","1","2","3","4","5","6","7"];
// The controlled genre vocabulary (§4.2) — must match
// wordlists/reading/build-catalog.js's GENRE_VOCAB exactly, since a custom
// book's genre has to mean the same thing as a catalog book's.
const GENRE_VOCAB = [
  "adventure", "animal-fiction", "biography-nonfiction", "fantasy",
  "historical-fiction", "humor", "mystery", "realistic-fiction",
  "science-fiction", "poetry",
];
const RATINGS = [
  { v: 1, label: "Not for me" }, { v: 2, label: "It was okay" },
  { v: 3, label: "Pretty good" }, { v: 4, label: "Really liked it" },
  { v: 5, label: "Loved it!" },
];
// §7: a generic tier a parent sets from the phone, never a diagnosis label —
// this is the hook for future point weighting, not used for anything yet
// ("designed now, built later"). Must match parent.html's
// READING_SUPPORT_LEVELS exactly.
const READING_SUPPORT_LEVELS = [
  { v: "standard", label: "Standard" },
  { v: "extra-support", label: "Extra support" },
  { v: "significant-support", label: "Significant support" },
];

function freshData(childName, pin, childGrade) {
  return {
    childName, pin,
    childGrade: childGrade || "2",
    theme: "classic",
    events: [],
    books: [],
    catalogOverlay: {},
    readingSupportLevel: null,
  };
}
let lastLoadError = null;
function load(key) {
  lastLoadError = null;
  const raw = localStorage.getItem(key);
  if (!raw) return null;
  let d;
  try { d = JSON.parse(raw); } catch(e) { lastLoadError = "corrupted"; return null; }
  try {
    KEY = key;
    if (!d.theme) d.theme = "classic";
    if (!d.events) d.events = [];
    if (!d.books) d.books = [];
    if (!d.catalogOverlay) d.catalogOverlay = {};
    if (d.readingSupportLevel === undefined) d.readingSupportLevel = null;
    if (d.childGrade === undefined) d.childGrade = "2";
    return d;
  } catch(e) { lastLoadError = "corrupted"; return null; }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
  catch(e) { return false; }
}
function saveFailedBannerHtml() {
  return `<div class="card" style="background:var(--gold-soft);border:2px solid var(--gold)">
    <div style="font-weight:700;margin-bottom:4px">&#9888;&#65039; This wasn't saved</div>
    <div class="muted" style="font-size:14px">The device may be low on storage. Freeing up some space and trying again should fix it.</div>
  </div>`;
}

// ---------- Catalog (§4) ----------
// Bundled, fetched once at boot, no build step at runtime (§4.2). Falls back
// to an empty catalog if the fetch fails (e.g. very first offline load before
// the service worker has precached it) — custom titles still work either way.
let CATALOG = {};
let catalogLoaded = false;
async function loadCatalog() {
  try {
    const res = await fetch("./reading-catalog.json");
    CATALOG = await res.json();
  } catch(e) { CATALOG = {}; }
  catalogLoaded = true;
}
// Parent-authored/overridden books (§4.3) win by key over the bundled
// catalog. Entry shape is identical in both, so search, the quiz runner,
// and the book detail screen never know which one a book came from.
function effectiveCatalog() {
  return Object.assign({}, CATALOG, data.catalogOverlay || {});
}
function catalogSearch(term) {
  const t = term.trim().toLowerCase();
  if (!t) return [];
  return Object.entries(effectiveCatalog())
    .filter(([key, b]) => b.title.toLowerCase().includes(t) || (b.author || "").toLowerCase().includes(t) || (b.series || "").toLowerCase().includes(t))
    .map(([key, b]) => ({ key, ...b }))
    .slice(0, 20);
}
function knownSeriesNames() {
  const names = new Set();
  Object.values(effectiveCatalog()).forEach(b => { if (b.series) names.add(b.series); });
  (data.books || []).forEach(b => { if (b.series) names.add(b.series); });
  return [...names].sort();
}

// ---------- Helpers ----------
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function todayISO() { return new Date().toISOString().slice(0,10); }
function fmtDate(iso) { if (!iso) return ""; const d = new Date(iso); return d.toLocaleDateString(); }
// A fresh id per event, even for two events minted in the same gesture/ms
// (§3.2's caution about Date.now()-only ids).
let _idSeq = 0;
function freshId() { return Date.now() + "-" + (_idSeq++); }

function applyTheme() {
  document.body.dataset.theme = data && data.theme !== "classic" ? data.theme : "";
  if (data) document.getElementById("greeting").innerHTML = `Hi, ${esc(data.childName)}! &#128214;`;
}

// ---------- Event log + book cache (§3.1/§3.2) ----------
// Appends one event and returns it. `dateISO` defaults to now but every call
// site accepts an override — every event is backdatable (§9), not just start.
function addEvent(mode, book, extra, dateISO) {
  const e = Object.assign({
    id: freshId(),
    date: dateISO || new Date().toISOString(),
    mode,
    bookId: book.id,
    bookTitle: book.title,
    childGrade: data.childGrade,
    catalogId: book.catalogId || null,
    seriesKey: book.seriesKey || null,
    seriesNumber: book.seriesNumber || null,
    seriesName: book.series || null,
    genre: book.genre || [],
    gradeLevel: book.gradeLevel || null,
    author: book.author || null,
    score: null, total: null,
  }, extra || {});
  data.events.push(e);
  return e;
}

function findBook(bookId) { return data.books.find(b => b.id === bookId); }
function currentlyReading() { return data.books.filter(b => b.status === "reading"); }
function pastBooks() { return data.books.filter(b => b.status !== "reading").slice().reverse(); }

function startBook({ title, author, catalogId, series, seriesKey, seriesNumber, gradeLevel, genre, dateISO }) {
  const book = {
    id: crypto.randomUUID(), catalogId: catalogId || null,
    title, author: author || null,
    series: series || null, seriesKey: seriesKey || null, seriesNumber: seriesNumber || null,
    gradeLevel: gradeLevel || null, genre: genre || [],
    status: "reading", startedAt: dateISO || new Date().toISOString(), endedAt: null,
    sessions: [], rating: null, quizzes: [],
  };
  data.books.push(book);
  addEvent("start", book, {}, dateISO);
  return book;
}
// Nested session/quiz records reuse their event's own id, rather than minting
// a second one, so a parent's delete-session command (which names the id
// /api/sessions handed back — i.e. the event id) can find and remove the
// matching nested record. See applyRemoteSessionDelete below.
function logSession(book, { minutes, pages, note, dateISO }) {
  const e = addEvent("log-session", book, { minutes: minutes || null, pages: pages || null, note: note || "" }, dateISO);
  book.sessions.push({ id: e.id, at: e.date, minutes: e.minutes, pages: e.pages, note: e.note });
}
function finishBook(book, { rating, dateISO }) {
  const e = addEvent("finish", book, { rating }, dateISO);
  book.status = "finished"; book.endedAt = e.date; book.rating = rating;
}
function abandonBook(book, { dateISO }) {
  const e = addEvent("abandon", book, {}, dateISO);
  book.status = "abandoned"; book.endedAt = e.date;
}
function recordQuiz(book, { score, total, missed, dateISO }) {
  const e = addEvent("quiz", book, { score, total, missed: missed || [] }, dateISO);
  book.quizzes.push({ id: e.id, score, total, answeredAt: e.date, missed: missed || [] });
}
// Reconciling a custom book with a catalog entry (§9): sets catalogId and
// backfills classification on the book going forward. Does not touch
// scope_id/bookId or any past event — only events written after this point
// carry the corrected classification. Local-only; no new event mode, since
// nothing here is pushed anywhere yet (Phase 0b has no sync).
function reconcileBook(book, catalogEntry) {
  book.catalogId = catalogEntry.key;
  book.series = catalogEntry.series || book.series;
  book.seriesKey = catalogEntry.seriesKey || book.seriesKey;
  book.seriesNumber = catalogEntry.seriesNumber != null ? catalogEntry.seriesNumber : book.seriesNumber;
  book.gradeLevel = catalogEntry.gradeLevel || book.gradeLevel;
  if (catalogEntry.genre && catalogEntry.genre.length) book.genre = catalogEntry.genre;
}

// ---------- Router / lock ----------
const app = document.getElementById("app");
let parentUnlocked = false;
function lockAndHome() { parentUnlocked = false; go("home"); }
// Read by the sync module (§15.5): a command is only safe to apply once the
// kid has navigated off whatever they were mid-way through.
let currentView = "home";
function go(view, arg) {
  Q = null; // cancel any in-progress quiz — a stale answerQuiz() must not fire post-navigation
  currentView = view;
  syncApplyPending();
  document.getElementById("homeBtn").style.display = view === "home" ? "none" : "";
  if (view === "home") return renderHome();
  if (view === "startBook") return renderStartBook();
  if (view === "book") return renderBookDetail(arg);
  if (view === "logSession") return renderLogSession(arg);
  if (view === "finishBook") return renderFinishBook(arg);
  if (view === "shelved") return renderShelved(arg);
  if (view === "quiz") return startQuiz(arg);
  if (view === "history") return renderHistoryKid();
  if (view === "parent") return parentGate();
}
// The shelf packs itself against the measured width of #app, so a rotation or
// a resized window has to re-pack it. Only the two views that draw a shelf
// re-render, and "shelved" is deliberately excluded so the drop-in animation
// does not replay under the kid.
let shelfResizeTimer = null;
window.addEventListener("resize", () => {
  if (parentUnlocked || (currentView !== "home" && currentView !== "history")) return;
  clearTimeout(shelfResizeTimer);
  shelfResizeTimer = setTimeout(() => {
    if (currentView === "home") renderHome();
    else if (currentView === "history") renderHistoryKid();
  }, 150);
});

// ---------- First-launch setup wizard ----------
const setup = { pin: null, name: null, pairingCode: null };
function renderSetup(step) {
  document.getElementById("homeBtn").style.display = "none";
  document.getElementById("greeting").innerHTML = "Welcome! &#128214;";
  parentUnlocked = false;
  if (step === 1) {
    app.innerHTML = `
      <div class="card center" style="padding:36px;max-width:420px;margin:0 auto">
        <div style="font-size:34px;margin-bottom:10px">&#128274;</div>

function setupName() {

async function setupFinish(gradeLevel) {
  KEY = nameToKey(setup.name);
  const existing = localStorage.getItem(KEY);
  if (existing && !confirm(`This device already has saved data for a child named "${setup.name}". Continue and use that existing data?`)) return;
  if (existing) { data = load(KEY); }
  else { data = freshData(setup.name, setup.pin, gradeLevel); persist(); }
  applyTheme();
  // §6.2: a code typed in at setup gets this profile onto its parent-assigned
  // childId from its very first save — no local id ever minted to reconcile
  // away later.
  if (setup.pairingCode) {
    try {
      data.sync = await redeemPairingCode(setup.pairingCode, "/api", crypto.randomUUID());
      persist();
    } catch (err) {
      alert("Couldn't connect with that pairing code (" + err.message + "). You can try again anytime from the parent area → Settings.");

}

// ---------- Bookshelf ----------
// A finished book earns a spine. Everything here is derived from data.books at
// render time: no new fields, nothing persisted, nothing for the Phase 1 sync
// to carry. Genre picks the colour family and a hash of book.id pins which
// variant within that family, so a book keeps the same spine forever and on
// every device without us storing the choice anywhere.
const SPINE_SHEET = { w: 937, h: 202 };
const SPINES = {
  B00: { x: 0, w: 42, h: 188 },   C00: { x: 42, w: 42, h: 180 },  B11: { x: 84, w: 32, h: 154 },
  C13: { x: 116, w: 26, h: 128 }, B01: { x: 142, w: 42, h: 162 }, C01: { x: 184, w: 38, h: 172 },
  B02: { x: 222, w: 42, h: 184 }, C02: { x: 264, w: 41, h: 178 }, B03: { x: 305, w: 40, h: 168 },
  C03: { x: 345, w: 37, h: 154 }, B05: { x: 382, w: 42, h: 158 }, C07: { x: 424, w: 37, h: 90 },
  B12: { x: 461, w: 39, h: 150 }, C14: { x: 500, w: 24, h: 110 }, B04: { x: 524, w: 38, h: 168 },
  C05: { x: 562, w: 34, h: 154 }, B06: { x: 596, w: 50, h: 193 }, C08: { x: 646, w: 45, h: 202 },
  C09: { x: 691, w: 42, h: 192 }, C10: { x: 733, w: 40, h: 176 }, B09: { x: 773, w: 42, h: 183 },
  C11: { x: 815, w: 32, h: 171 }, B10: { x: 847, w: 58, h: 134 }, C12: { x: 905, w: 32, h: 138 },
};
// Keys are GENRE_VOCAB values (§4.2) plus "_none" for books with no genre —
// a custom book the parent has not classified yet gets a neutral grey spine.
const GENRE_SPINES = {
  "adventure":            ["B00", "C00", "B11", "C13"],
  "animal-fiction":       ["B01", "C01"],
  "biography-nonfiction": ["B02", "C02"],
  "fantasy":              ["B03", "C03"],
  "historical-fiction":   ["B05", "C07", "B12", "C14"],
  "humor":                ["B04", "C05"],
  "mystery":              ["B06", "C08"],
  "realistic-fiction":    ["C09"],
  "science-fiction":      ["C10"],
  "poetry":               ["B09", "C11"],
  "_none":                ["B10", "C12"],
};
const SPINE_GAP = 1;
const SPINE_TITLE_MIN_W = 15;    // scaled px a spine needs before title text fits legibly
const SHELF_SCALE = 0.44;        // tallest spine ≈ 89px
const SHELF_SCALE_FULL = 0.36;   // history view fits more per row
const BOOKEND_RATIO = 1.05;      // bookend height, as a multiple of the tallest spine

// Finished only. Abandoned books stay in history and off the shelf — quitting a
// book is blameless (§9) and the shelf is not the place to memorialise it.
function finishedBooks() {
  return data.books.filter(b => b.status === "finished")
    .sort((a, b) => String(a.endedAt || "").localeCompare(String(b.endedAt || "")));
}
// FNV-1a. Any stable string hash would do; this one is short and has no deps.
function hashId(s) {
  let h = 2166136261;
  for (let i = 0; i < String(s).length; i++) { h ^= String(s).charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function spineKeyFor(b) {
  const genre = (b.genre || []).find(g => GENRE_SPINES[g]) || "_none";
  const variants = GENRE_SPINES[genre];
  return variants[hashId(b.id) % variants.length];
}
function spineHtml(b, scale, shelving) {
  const s = SPINES[spineKeyFor(b)];
  const cls = ["spine", b.rating === 5 ? "loved" : "", shelving ? "shelving" : ""].filter(Boolean).join(" ");
  const tip = [b.title, b.author].filter(Boolean).join(" — ");
  const w = s.w * scale, h = s.h * scale;
  const titleFont = Math.max(5.5, Math.min(7.5, w - 11));
  const titleHtml = w >= SPINE_TITLE_MIN_W && b.title
    ? `<div class="spine-title" style="font-size:${titleFont.toFixed(1)}px">${esc(b.title)}</div>`
    : "";
  return `<div class="${cls}" title="${esc(tip)}" onclick="go('book','${b.id}')" style="`
    + `width:${w.toFixed(1)}px;height:${h.toFixed(1)}px;`
    + `background-image:url(./reading-spines.png);`
    + `background-size:${(SPINE_SHEET.w * scale).toFixed(1)}px ${(SPINE_SHEET.h * scale).toFixed(1)}px;`
    + `background-position:-${(s.x * scale).toFixed(1)}px -${((SPINE_SHEET.h - s.h) * scale).toFixed(1)}px">${titleHtml}</div>`;
}
// Width available inside a .card, measured off the live #app so the shelf packs
// correctly on a phone as well as a desktop. Falls back to a sane guess if the
// element has not been laid out yet.
function shelfWidth() {
  const w = (app && app.clientWidth) || 0;
  return Math.max(220, (w || 632) - 52);
}
function chunkShelf(books, scale, avail) {
  const rows = []; let row = [], used = 0;
  for (const b of books) {
    const bw = SPINES[spineKeyFor(b)].w * scale + SPINE_GAP;
    if (row.length && used + bw > avail) { rows.push(row); row = []; used = 0; }
    row.push(b); used += bw;
  }
  if (row.length) rows.push(row);
  return rows;
}
// bookend: "right" holds up a part-filled row the way a real one does — books
// pushed left, the horse propping the loose end, sliding along as the shelf
// fills. "both" is only for the empty shelf, where there is nothing to prop.
function shelfRowHtml(books, scale, opts) {
  const endH = (SPINE_SHEET.h * scale * BOOKEND_RATIO).toFixed(1);
  const end = side => `<div class="bookend ${side}" style="width:${endH}px;height:${endH}px"></div>`;
  const shelving = opts.shelvingId;
  return `<div class="shelf-row${shelving && books.some(b => b.id === shelving) ? " shelving" : ""}">
      <div class="shelf-books${books.length ? "" : " empty"}">
        ${opts.bookend === "both" ? end("left") : ""}
        ${books.map(b => spineHtml(b, scale, b.id === shelving)).join("")}
        ${opts.bookend ? end("right") : ""}
      </div>
      <div class="shelf-plank"></div>
    </div>`;
}
// opts: { scale, bookend, shelvingId, oneRow }
function shelfHtml(books, opts) {
  opts = opts || {};
  const scale = opts.scale || SHELF_SCALE;
  let avail = shelfWidth();
  if (opts.bookend) avail -= SPINE_SHEET.h * scale * BOOKEND_RATIO;
  if (books.length === 0) {
    return shelfRowHtml([], scale, { bookend: "both" })
      + `<div class="shelf-caption">Your shelf is empty — finish a book and it lands here.</div>`;
  }
  let rows = chunkShelf(books, scale, Math.max(80, avail));
  let shown = books.length;
  if (opts.oneRow && rows.length > 1) {
    // Home shows the newest books that fit on one plank; the full shelf lives
    // in history. Take from the end so the most recent finish is always there.
    const last = rows[rows.length - 1];
    const fill = chunkShelf(books.slice().reverse(), scale, Math.max(80, avail))[0] || last;
    rows = [fill.slice().reverse()];
    shown = rows[0].length;
  }
  const caption = books.length === 1
    ? `1 book on your shelf`
    : `${books.length} books on your shelf${shown < books.length ? ` — showing the newest ${shown}` : ""}`;
  return rows.map(r => shelfRowHtml(r, scale, opts)).join("")
    + `<div class="shelf-caption">${caption}</div>`;
}

let Q = null; // { bookId, questions: [{...shuffledChoices}], idx, missed: [] }
function startQuiz(bookId) {
  const b = findBook(bookId);
  const cat = effectiveCatalog()[b.catalogId];
  const questions = shuffle(cat.questions).map(q => ({
    id: q.id, q: q.q,
    choices: shuffle([q.correct, ...q.wrong]),
    correct: q.correct,
  }));
  Q = { bookId, questions, idx: 0, missed: [], answered: false };
  renderQuizQuestion();
}
function renderQuizQuestion() {
  const total = Q.questions.length;
  const item = Q.questions[Q.idx];
  app.innerHTML = `
    <div class="card">
      <div class="muted" style="margin-bottom:8px">Question ${Q.idx + 1} of ${total}</div>
      <h2>${esc(item.q)}</h2>
      <div style="margin-top:14px">
        ${item.choices.map((c, i) => `<button class="quiz-choice" id="choice-${i}" onclick="answerQuiz(${i})">${esc(c)}</button>`).join("")}
      </div>
    </div>`;
}
function answerQuiz(i) {
  if (Q.answered) return;
  Q.answered = true;
  const item = Q.questions[Q.idx];
  const chosen = item.choices[i];
  const ok = chosen === item.correct;
  if (!ok) Q.missed.push(item.id);
  item.choices.forEach((c, j) => {
    const btn = document.getElementById("choice-" + j);
    btn.disabled = true;
    if (c === item.correct) btn.classList.add("ok");
    else if (j === i) btn.classList.add("bad");
  });
  setTimeout(() => {
    Q.answered = false;
    if (Q.idx < Q.questions.length - 1) { Q.idx++; renderQuizQuestion(); }
    else finishQuiz();
  }, 900);
}
function finishQuiz() {
  const b = findBook(Q.bookId);
  const total = Q.questions.length;
  const score = total - Q.missed.length;
  recordQuiz(b, { score, total, missed: Q.missed });
  const saved = persist();
  syncPush();
  app.innerHTML = `
    <div class="card center">
      <div style="font-size:40px;margin-bottom:8px">${score === total ? "&#127881;" : "&#128214;"}</div>
      <h2>${score} out of ${total}</h2>
      ${!saved ? saveFailedBannerHtml() : ""}

    </div>`;
  Q = null;
}

// ---------- Sync (docs/parent-sync-spec.md §7, §8; reading-star-spec.md §3.3) ----------
// Transport (pairing, push-on-persist, ackedIds, retry) is pasted in from
// Spelling/Math unchanged (§3 rule 5) — only SYNC_APP and the syncState()/
// applyCommand() seam differ, per reading-star-spec.md §3.2. Fire-and-forget:
// nothing here blocks a render, and a sync failure is never visible to the
// child.
const SYNC_APP = "reading";

function syncReady() { return !!(data.sync && data.sync.enabled && data.sync.deviceToken); }
function syncEndpoint() { return (data.sync && data.sync.endpoint) || "/api"; }

async function syncApi(path, body) {
  const res = await fetch(syncEndpoint() + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + data.sync.deviceToken },
    cache: "no-store",
    body: JSON.stringify(body),
  });
  let json = null;
  try { json = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((json && json.error) || ("sync failed (" + res.status + ")"));
  return json;
}

// One child, one childId, across all apps (§6.2) — shared the same way
// Spelling/Math do, keyed by the profile's name slug.
function sharedChildIdKey() { return "starhomeschool-childid-" + childSlug(data.childName); }
function sharedChildId() {
  let id = null;
  try { id = localStorage.getItem(sharedChildIdKey()); } catch(e) {}
  if (id) return id;
  id = (data.sync && data.sync.childId) || crypto.randomUUID();
  try { localStorage.setItem(sharedChildIdKey(), id); } catch(e) {}
  return id;
}
function syncChildId() {
  if (!data.sync) return null;
  const shared = sharedChildId();
  if (data.sync.childId !== shared) {
    data.sync.childId = shared;
    data.sync.ackedIds = [];
    persist();
  }
  return data.sync.childId;
}

// Always calls /api/sync, even with nothing pending — the response is how a
// parent's command reaches this device (§15.2).
let syncLastPullAt = 0;
function syncPush() {
  if (!syncReady()) return;
  syncLastPullAt = Date.now();
  const childId = syncChildId();
  const acked = new Set(data.sync.ackedIds || []);
  const pending = data.events.filter(e => !acked.has(e.id));
  syncApi("/sync", {
    app: SYNC_APP, childId, childName: data.childName,
    // §9.3 — stamped on the way out, so a sitting recorded while the tablet
    // was offline and plan-less still carries the right calendar day.
    sessions: withLocalDates(pending),
    state: syncState(),
    applied: data.sync.appliedCommandIds || [],
    // Not an ack (§6.1) — just what this device is holding, so the parent's
    // Plan tab can show delivery without any bookkeeping on this side.
    planRevision: (planRead() || {}).revision,
  })
    .then(res => {
      if (!res) return;
      if (Array.isArray(res.accepted) && res.accepted.length) {
        const merged = new Set([...(data.sync.ackedIds || []), ...res.accepted]);
        data.sync.ackedIds = [...merged].slice(-1000);
      }
      data.sync.lastPushAt = Date.now();
      persist();
      if (Array.isArray(res.commands) && res.commands.length) syncQueueCommands(res.commands);
      // Stored before anything reads it, and stored whole (§7.1). Nothing in
      // this app renders another app's items — filtering is a read-time
      // concern — so a plan naming apps this one has never heard of is
      // written through untouched.
      //
      // A plan that arrives while the child is sitting on the home screen
      // shows up there without a reload, the same way an assigned list
      // already does — and nowhere else: no other screen is worth yanking
      // out from under them mid-sitting.
      if (res.plan && planStore(res.plan) && !parentUnlocked && currentView === "home") renderHome();
    })
    .catch(() => { /* best-effort — the next event or boot retries */ });
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (Date.now() - syncLastPullAt < 60000) return;
  syncPush();
});

function syncDelete(ids) {
  if (!syncReady() || !ids.length) return;
  syncApi("/delete", { app: SYNC_APP, childId: syncChildId(), sessionIds: ids }).catch(() => {});
}

// ---------- The plan document (docs/assignment-spec.md §7, §9) ----------
// Byte-identical in all three synced apps (§3 rule 5), like the transport
// above it. The drift test in tests/ compares these three copies.
//
// The document is delivered inside /api/sync's response, beside commands[],
// and is written here to ONE key shared by all five apps. Not this app's own
// slice of it — the whole thing, verbatim. That is what lets a plan reach an
// app that is not itself synced: Reading Star's items land on the device
// because Spelling Star wrote them, even with Reading Star's sync switched
// off. The synced apps are the delivery mechanism for a plan they do not own.
function planKey() { return "starplan-" + childSlug(data.childName); }

function planRead() {
  try { return JSON.parse(localStorage.getItem(planKey())); } catch(e) { return null; }
}

// §7.1's writer protocol, in full, because one shared key across five apps
// breaks the "each app owns its own keys" convention:
//   1. Highest revision wins — two apps receiving the same plan write once
//      between them, and two tablets racing is harmless.
//   2. Stored verbatim — an app that rewrote the document to hold only its own
//      items would destroy the others' the moment it synced first.
//   3. A malformed value is overwritten, not repaired — the server is the
//      authority and this key is a cache.
// Filtering to this app's own items happens at read time, never here.
//
// Returns whether the stored document actually changed, so a caller can
// repaint a screen that is showing it without repainting on every sync that
// re-delivers the revision this device already holds — which is most of them.
function planStore(plan) {
  if (!plan || typeof plan !== "object" || typeof plan.revision !== "number") return false;
  const held = planRead();
  if (held && typeof held.revision === "number" && held.revision >= plan.revision) return false;
  try { localStorage.setItem(planKey(), JSON.stringify(plan)); } catch(e) { return false; }
  return true;
}

// The family timezone (§9.3), or null when no plan has ever arrived. Null is a
// supported state and not a failure: a tablet with no plan has no target to
// bucket, so it stamps nothing and the phone backfills what it displays (§9.6).
function planTimezone() {
  const plan = planRead();
  return (plan && typeof plan.timezone === "string" && plan.timezone) || null;
}

// §9.3. 'en-CA' formats as YYYY-MM-DD. This runs on the client for one reason:
// the conversion needs the full IANA timezone database, which a browser has
// and D1 does not (§9.2) — so a local calendar day cannot be derived at query
// time, and has to be stamped at write time instead. Doing it here also gets
// DST right by construction, including the 23- and 25-hour days.
function localDate(instant, tz) {
  try { return new Intl.DateTimeFormat("en-CA", { timeZone: tz }).format(instant); }
  catch(e) { return null; }
}

// Attaches localDate to each session on its way up, rather than freezing it
// into the stored session record. localDate() is a pure function of the
// instant and the zone, so the answer is the same whenever it is computed —
// which means a sitting recorded before the family timezone ever arrived is
// still stamped correctly the first time it is actually pushed.
function withLocalDates(sessions) {
  const tz = planTimezone();
  if (!tz) return sessions;
  return sessions.map(s => {
    const at = Date.parse(s.date);
    if (!Number.isFinite(at)) return s;
    const stamp = localDate(new Date(at), tz);
    return stamp ? Object.assign({}, s, { localDate: stamp }) : s;
  });
}

// ---------- The mode registry and evaluator (docs/assignment-spec.md §5, §10) ----------
// Everything from here to the end of evaluateItem() is shared source, copied
// byte-for-byte into today.html and into the three synced apps, which is what
// §17 step 4 asked for. tests/shared-code.test.mjs compares all five copies,
// the way it already compares the plan document block.
//
// Drift here is the silent-wrongness the suites exist to catch: nothing throws
// and no screen breaks, the phone and the tablet simply start counting the
// same week differently and neither can be shown to be the wrong one.
//
// It depends on exactly one thing outside itself — localDate(instant, tz),
// which is already hand-duplicated across parent.html and the three apps under
// the same rule. Nothing else from any host file may be referenced here, or the
// block stops being copyable, which is the only property that makes it safe.
//
// What kind of sitting a session was. A pretest, a test and a practice all
// arrive as a row with a score, and "2 sessions, averaging 100%" flattened
// them into something a parent can't read: the diagnostic before the list and
// the test after it look identical to two practice runs. Labels and ordering
// follow the child apps' own screens (Spelling Star's Pretest / Test /
// Practice, Math Star's Drill / Practice) so the dashboard names a session the
// same way the child saw it.
//
// §5 promotes this from a badge-labelling table to the registry both sides
// evaluate against, which is why `tone` now decides what counts as work and
// not just what colour a badge is.
const MODES = {
  spelling: {
    pretest:  { label: 'Pretest',  tone: 'diagnostic' },
    test:     { label: 'Test',     tone: 'graded' },
    practice: { label: 'Practice', tone: 'practice' },
    repeat:   { label: 'Repeat',   tone: 'practice' },
    spotit:   { label: 'Spot it',  tone: 'play' },
    missing:  { label: 'Missing Letters', tone: 'play' },
    crossword:{ label: 'Crossword', tone: 'play' },
  },
  math: {
    drill:    { label: 'Drill',    tone: 'graded' },
    practice: { label: 'Practice', tone: 'practice' },
  },
  // reading-star-spec.md §6: quiz is the graded sitting, the same way Test is
  // for Spelling and Drill is for Math. `log-session` is the sitting that
  // actually is reading, so it reads as practice.
  //
  // The other three are `lifecycle` (assignment-spec.md §5): Reading Star
  // writes a session row when a book is *started*, and again when it is
  // finished or abandoned. Those are transitions of a book, not sittings at
  // one — counting them would make "5 reading sessions a week" satisfiable by
  // opening five books and reading none of them.
  reading: {
    start:        { label: 'Started',        tone: 'lifecycle' },
    'log-session':{ label: 'Reading session', tone: 'practice' },
    finish:       { label: 'Finished',       tone: 'lifecycle' },
    abandon:      { label: 'Quit',           tone: 'lifecycle' },
    quiz:         { label: 'Quiz',           tone: 'graded' },
  },
  // §5, §14. Neither app syncs yet, so nothing here is reachable from the
  // dashboard or the Plan tab's editor — the phone cannot verify a session it
  // never receives, which is why §11 keeps them out of the editor. They are
  // written down now so that the model that ships is already the model those
  // apps slot into, rather than one that has to be reshaped to admit them:
  // when §14 lands, an app id becomes selectable and nothing else moves.
  //
  // Nine Geography modes and four Logic ones collapse to one countable unit
  // each. A round is a round; whether it was capitals or rivers is a question
  // the dashboard answers, not one a target should have to.
  geography: {
    round:  { label: 'Round',  tone: 'practice' },
  },
  logic: {
    puzzle: { label: 'Puzzle', tone: 'practice' },
  },
};

// Unknown modes still render — a future app screen shows its raw mode rather
// than vanishing from the dashboard.
function modeInfo(appId, mode) {
  return (MODES[appId] || {})[mode] || { label: mode || 'Session', tone: 'play' };
}

// assignment-spec.md §5. Two rules rather than an enumeration, because an
// enumeration goes stale: Spelling Star shipped `spotit`, then `missing`, and
// docs/spelling-star-games.md is a backlog of more. Each arrives as a mode with
// tone 'play' and should land in the plan already knowing it is not homework,
// without anyone remembering to come back here.
//
// A parent who wants to encourage games can still target one by naming its
// mode explicitly — this governs only what a broad match sweeps up.
const UNCOUNTED_TONES = ['play', 'lifecycle'];

// An unrecognized mode falls to modeInfo's 'play' default and therefore does
// not count, which is the direction worth failing in: a target that undercounts
// shows "2 of 3" for a child who did three, and a parent goes and looks. One
// that overcounts shows "3 of 3" for a child who did two, and nobody does.
function countsAsWork(appId, mode) {
  return !UNCOUNTED_TONES.includes(modeInfo(appId, mode).tone);
}

// Date arithmetic on a YYYY-MM-DD string, with no timezone involved anywhere.
// That is the whole payoff of §9.3 stamping local_date at write time: once a
// session carries the calendar day it belongs to, every bucket downstream is
// string comparison and day counting, and the IANA database is needed exactly
// once — to ask what today is.
//
// The arithmetic goes through UTC deliberately. A local Date would put these
// on a clock that has 23- and 25-hour days, and "seven days after" would
// occasionally land on the wrong one.
function shiftDate(date, days) {
  const at = Date.parse(date + 'T00:00:00Z');
  if (!Number.isFinite(at)) return date;
  return new Date(at + days * 86400000).toISOString().slice(0, 10);
}
function daysBetween(from, to) {
  const a = Date.parse(from + 'T00:00:00Z');
  const b = Date.parse(to + 'T00:00:00Z');
  if (!Number.isFinite(a) || !Number.isFinite(b)) return 0;
  return Math.round((b - a) / 86400000);
}

// §9.4: the most recent weekStart weekday on or before this date. 0 = Sunday,
// matching data.schedule's existing indexing, so a family that has set its week
// to start on Monday gets the same answer from both.
function weekBucketStart(date, weekStart) {
  const at = Date.parse(date + 'T00:00:00Z');
  if (!Number.isFinite(at)) return date;
  const shift = (new Date(at).getUTCDay() - (weekStart === 1 ? 1 : 0) + 7) % 7;
  return shiftDate(date, -shift);
}

// The local-date window an item is being counted over right now, plus whether
// that window has closed. §4.3's three period kinds, and nothing else: there is
// deliberately no Mon–Fri "schoolweek", because whether a week includes
// Saturday is a question about the family's week and weekStart answers it.
//
// `closed` can only ever be true for a dated period. A day or a week bucket is
// derived from today and therefore always contains it — which is what §10.4
// needs: mid-period neither surface renders a judgment, so a target that has
// not closed has no verdict to show, only a count and the days left.
function periodWindow(item, { timezone, weekStart, now }) {
  const today = localDate(new Date(now), timezone);
  if (!today) return null;

  const period = item && item.period;
  if (period === 'day') return { from: today, to: today, closed: false };
  if (period === 'week') {
    const from = weekBucketStart(today, weekStart);
    return { from, to: shiftDate(from, 6), closed: false };
  }
  if (period && typeof period === 'object' && period.from && period.to) {
    return { from: period.from, to: period.to, closed: today > period.to };
  }
  return null;
}

// §10.2. One pure function, evaluated identically on the phone, on the hub and
// in the apps, so no client ever has to report "I have done 2 of 3" — both
// sides count the same sessions with the same rules and arrive at the same
// number on their own. There is no progress field to get out of sync.
//
// `sessions` are normalized to { at, localDate, app, mode, scopeId, deviceId,
// id }. `now` is a parameter rather than Date.now() so a past period is
// answerable retroactively (§10.1) — which is the point of plan revisions
// carrying an effective date.
function evaluateItem(item, sessions, { timezone, weekStart, now }) {
  const window = periodWindow(item, { timezone, weekStart, now });
  const count = (item && item.count) || 0;
  if (!window) return { done: 0, count, met: false, from: null, to: null, closed: false, daysLeft: 0 };

  const match = (item && item.match) || {};

  // Deduplicated on (deviceId, sessionId) before counting, which is not
  // optional: a merged child holds the same sitting under more than one childId
  // (§6.2), and an app re-pushes its history when it adopts the shared one.
  // /api/summary carries an inner DISTINCT for exactly this reason. Without it
  // a re-push inflates every count and a child appears to have met a target
  // they did not.
  //
  // today.html has no deviceId — everything it reads is by definition from the
  // one device — so the key collapses to the session id there, on its own. That
  // is the same line of code doing the right thing in both places rather than a
  // branch, which is what lets this stay byte-identical.
  const seen = new Set();
  let done = 0;

  for (const s of sessions || []) {
    // A session with no local_date cannot be placed in a calendar day at all
    // (§9.6): it was recorded before plans existed, or on a tablet that has
    // never received one. Excluded rather than guessed at — the phone
    // backfills what it can before this ever runs.
    if (!s || !s.localDate) continue;
    if (s.localDate < window.from || s.localDate > window.to) continue;

    if (match.app && s.app !== match.app) continue;
    if (match.scopeId && s.scopeId !== match.scopeId) continue;

    if (match.modes && match.modes.length) {
      // Naming a mode explicitly targets it whatever its tone, so a parent who
      // wants to encourage a game can. Only a broad match defers to §5's rule.
      if (!match.modes.includes(s.mode)) continue;
    } else if (!countsAsWork(s.app, s.mode)) {
      continue;
    }

    const key = (s.deviceId || '') + ':' + (s.id || '');
    if (seen.has(key)) continue;
    seen.add(key);
    done += 1;
  }

  const today = localDate(new Date(now), timezone);
  return {
    done,
    count,
    met: done >= count,
    from: window.from,
    to: window.to,
    closed: window.closed,
    // Inclusive of today: on the last day of a week this reads 0, which the
    // surfaces render as "last day" rather than "0 days left".
    daysLeft: today && today <= window.to ? daysBetween(today, window.to) : 0,
  };
}
// ---------- end of the shared registry and evaluator ----------

// ---------- The plan panel (docs/assignment-spec.md §8, §17 step 4) ----------
// What this child owes in THIS app, read from the plan document the last sync
// delivered (§6.2) and evaluated right here (§10.2) — no client ever reports
// "2 of 3" upward or downward. Both sides count the same sittings with the
// same rules and arrive at the same number on their own, which is the whole
// reason the evaluator above is copied rather than called.
//
// Shared source, byte-identical in all three synced apps and compared by
// tests/shared-code.test.mjs, like the plan document block. It depends on the
// evaluator above it, on planRead() / planTimezone() / localDate() from that
// block, on esc(), on SYNC_APP — the app id these sittings are already pushed
// under — and on planSessions(), the one per-app hook, defined immediately
// below it. Nothing else from any host file may be referenced here, or the
// block stops being copyable, which is the only property that makes it safe.

// §9.5: the tablet's clock for plan purposes comes from the plan document and
// nowhere else — deliberately no fallback to the device's own zone, unlike
// today.html. A tablet holding no plan has no item to place in a calendar day
// anyway, so periodWindow() returning null on a null zone is what hides this
// panel entirely (§9.6), rather than showing a bar that reads 0 of 3 forever
// with nothing visibly wrong.
function planContext(plan) {
  return { timezone: planTimezone(), weekStart: plan && plan.weekStart === 1 ? 1 : 0, now: Date.now() };
}

// §7.1: an app filters the plan to its own items at read time, and only at
// read time — the document itself is stored whole, because it is also how the
// other apps' items reach this device.
//
// A cross-app item — a match with no `app` (§4) — is deliberately NOT shown
// here. Counting one needs sittings from apps whose keys this app does not
// read, so the only number it could print is too low, and §5 is explicit about
// which direction of wrong is the bad one: a bar that undercounts sends a
// child back to work they have already done. today.html holds all five apps'
// history and is the surface that can count it, so the panel points there.
function planOwnItems(plan, ctx) {
  return ((plan && plan.items) || []).filter(item => {
    if (!item || !item.id || !item.match || item.match.app !== SYNC_APP) return false;
    // §4.3: a dated item leaves the child's view once its window has closed.
    // It stays in the parent's history, where "not done, and the window
    // closed" is the whole point — but a child does not need yesterday's
    // deadline on today's list. An item whose period this version cannot place
    // drops out the same way: there is nothing honest to show for it.
    const window = periodWindow(item, ctx);
    return !!window && !window.closed;
  });
}

// §8.2, and it is the reason this is a panel and not a gate: it displays, it
// never blocks. Every button under it stays exactly as live as it was, a child
// who wants a fourth practice is not stopped, and a child who has finished is
// not locked out. data.schedule remains the only thing that gates, because
// schedule is what is available today and the plan is what is owed this week.
function planPanelHtml() {
  const plan = planRead();
  const ctx = planContext(plan);
  const items = planOwnItems(plan, ctx);
  if (!items.length) return "";
  const sessions = planSessions(ctx.timezone);
  const met = items.every(item => evaluateItem(item, sessions, ctx).met);
  // Only ever true when the parent has targeted an app this one is not, so the
  // line is silent on a plan that is entirely this app's — which is most of
  // them.
  const elsewhere = ((plan && plan.items) || []).length > items.length;
  return `<div class="card" style="padding:20px">
    <div style="font-weight:700;font-size:18px;margin-bottom:4px">${met ? "&#11088; All done here!" : "&#128203; What I owe"}</div>
    <div class="muted" style="margin-bottom:10px">${met ? "Anything else today is because you felt like it." : "Nothing here locks anything &mdash; you can always do more."}</div>
    ${items.map(item => planRowHtml(item, sessions, ctx)).join("")}
    ${elsewhere ? `<div class="muted" style="margin-top:12px;font-size:14px">Other work is on the <a href="./today.html" style="color:var(--accent);font-weight:700;text-decoration:none">Today page &rarr;</a></div>` : ""}
  </div>`;
}

// §8.3: a count and a bar, never a percentage and never a grade — the same
// resolution math-star-spec.md §1 and reading-star-spec.md §4.2 reached
// independently. The bar's width is a percentage internally, which is fine:
// nothing reads it out.
function planRowHtml(item, sessions, ctx) {
  const r = evaluateItem(item, sessions, ctx);
  const pct = r.count ? Math.min(100, Math.round((r.done / r.count) * 100)) : 0;
  // §10.4: no judgment mid-period. Every item rendering here has an open
  // window — a closed one was filtered out — so the right-hand side is either
  // the good news or the time left, never a verdict. "Done" replaces the time
  // left rather than sitting beside it: a child who has finished does not need
  // to know how long they had.
  const right = r.met
    ? `<span style="color:var(--green-dark);font-weight:700">Done &#10003;</span>`
    : item.period === "day" ? "today"
    : r.daysLeft === 0 ? "last day"
    : r.daysLeft + (r.daysLeft === 1 ? " day left" : " days left");
  // The deadline goes in the label line rather than in the status slot on the
  // right: a dated assignment that has been finished still has a due date, and
  // a row reading only "Done" does not say which piece of work it was for.
  const when = item.period === "day" ? "every day"
    : item.period === "week" ? "this week"
    : "by " + planReadableDate(r.to);
  return `<div style="padding:10px 0;border-top:1px solid var(--line)">
    <div style="display:flex;align-items:baseline;gap:10px">
      <strong style="font-size:16px">${esc(item.label || "Work")}</strong>
      <span class="muted" style="margin-left:auto">${r.done} of ${r.count}</span>
    </div>
    <div style="height:10px;border-radius:6px;background:var(--chip);overflow:hidden;margin:8px 0 6px">
      <span style="display:block;height:100%;width:${pct}%;background:${r.met ? "var(--green)" : "var(--accent)"}"></span>
    </div>
    <div class="muted" style="display:flex;gap:10px;font-size:14px"><span>${esc(when)}</span><span style="margin-left:auto">${right}</span></div>
  </div>`;
}

// A YYYY-MM-DD local date read back as "Sep 4". Parsed as UTC on purpose: the
// string is already a calendar day, and re-reading it in the device's own zone
// is how a date becomes the day before.
function planReadableDate(date) {
  const at = Date.parse(date + "T00:00:00Z");
  if (!Number.isFinite(at)) return date;
  return new Date(at).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
}

// ---------- end of the shared plan panel ----------
// The one hook it needs, and the only part of any of this that is not shared:
// how to read this app's own history into the shape evaluateItem() expects.
// The app id it filters on is SYNC_APP, already declared above — the same
// identifier these sittings are pushed under, which is what §4.1 means by a
// match referencing envelope columns and nothing else.

// Named fields, never a spread. today.html states that rule for a stronger
// reason — the object it reads holds a PIN — but it holds here too: the shape
// the evaluator reads is a contract, and a field that leaks into it by
// accident becomes load-bearing without anyone deciding it should be.
//
// The flat event log, never the nested copies in books[] (§8.6): a nested copy
// carries its event's own id, so reading both would count every sitting twice
// — or, with the evaluator's dedupe, silently depend on it. `deviceId` is
// absent for the reason it is absent on the hub: everything here was recorded
// on this device.
function planSessions(tz) {
  const rows = [];
  for (const e of data.events || []) {
    if (!e) continue;
    const at = Date.parse(e.date);
    if (!Number.isFinite(at)) continue;
    rows.push({ id: e.id, at, localDate: localDate(new Date(at), tz), app: SYNC_APP, mode: e.mode, scopeId: e.bookId || null });
  }
  return rows;
}


// ---------- Parent -> child commands (§15) ----------
// syncState()/applyCommand() are the declared per-app seam (§3 rule 5);
// everything above is byte-identical to Spelling/Math.

// §15.4: what this tablet has right now, so the catalog-editor Assign tab
// (§4.3) can offer real edit-versus-create choices. The bundled catalog gets
// only a thin index — key, title, author, question count — since it can grow
// into a full quiz bank and the parent doesn't need the text until they open
// one book to edit it (the dashboard fetches reading-catalog.json itself for
// that). The overlay is the parent's own content, small by construction, so
// it rides along in full: that's what lets the editor prefill a book already
// being edited.
function syncState() {
  return {
    childGrade: data.childGrade,
    grades: GRADES,
    currentlyReading: currentlyReading().length,
    catalogIndex: Object.entries(CATALOG).map(([key, b]) => ({
      key, title: b.title, author: b.author || "", questionCount: (b.questions || []).length,
    })),
    catalogOverlay: data.catalogOverlay || {},
    readingSupportLevel: data.readingSupportLevel,
  };
}

// A command arrives from a network callback that can fire at any moment,
// including mid-quiz. Nothing is applied until the kid is somewhere safe
// (§15.5) — see syncSafeToApply and go()'s `Q = null`.
let syncPendingCommands = [];
function syncSafeToApply() { return Q === null; }

function syncQueueCommands(commands) {
  syncPendingCommands = syncPendingCommands.concat(commands);
  syncApplyPending(true);
}

function syncApplyPending(repaint) {
  if (!data || !data.sync || !syncPendingCommands.length || !syncSafeToApply()) return;
  const queue = syncPendingCommands;
  syncPendingCommands = [];
  const done = new Set(data.sync.appliedCommandIds || []);
  let changed = false;
  for (const cmd of queue) {
    if (!cmd || !cmd.id || done.has(cmd.id)) continue;
    try { if (applyCommand(cmd)) changed = true; } catch (e) {}
    done.add(cmd.id);
  }
  data.sync.appliedCommandIds = [...done].slice(-200);
  persist();
  if (changed && repaint && !parentUnlocked && currentView === "home") renderHome();
}

function applyCommand(cmd) {
  const p = cmd.payload || {};
  if (cmd.kind === "delete-session") return applyRemoteSessionDelete(p.sessionIds);
  if (cmd.kind === "assign-book") return applyAssignBook(p.book);
  if (cmd.kind === "delete-book") return applyDeleteBook(p.key);
  if (cmd.kind === "set-reading-support-level") return applySetReadingSupportLevel(p.level);
  return false;
}

// §7: stored for a future computePoints() to read — v1 has no formula yet,
// so applying this command only stores the value. The parent sets it from
// the phone; the kid never sees or sets it on the tablet.
function applySetReadingSupportLevel(level) {
  if (!READING_SUPPORT_LEVELS.some(l => l.v === level)) return false;
  data.readingSupportLevel = level;
  return true;
}

// §4.3: the bundled catalog is a static asset the app can't rewrite, so a
// parent's add/edit lands as an override in data.catalogOverlay, keyed by
// book_key like the bundle itself — editing a bundled book just means the
// overlay entry at that key now wins (effectiveCatalog()). Replaces by key,
// not by name, per §4.1/§4.3: identity is the authored key, so re-sending one
// is an edit, never a second book.
function applyAssignBook(book) {
  if (!book || !book.key || !book.title) return false;
  data.catalogOverlay[book.key] = {
    series: book.series || null, seriesKey: book.seriesKey || null, seriesNumber: book.seriesNumber || null,
    title: book.title, author: book.author || "", gradeLevel: book.gradeLevel || "",
    genre: Array.isArray(book.genre) ? book.genre : [],
    questions: Array.isArray(book.questions) ? book.questions : [],
  };
  return true;
}
// Removes only the overlay entry. A bundled book at the same key, if any,
// reappears rather than being tombstoned — there is no mechanism to hide a
// bundled entry, only to override it, and this is the inverse of an override.
function applyDeleteBook(key) {
  if (!key || !(key in data.catalogOverlay)) return false;
  delete data.catalogOverlay[key];
  return true;
}

// Reading-specific, not pasted in unchanged from Spelling (reading-star-spec
// §3.3 finding 4): the local model nests sessions/quizzes inside a book
// rather than keeping one flat data.sessions array, so this walks both.
// Nested records share their originating event's id (see logSession /
// recordQuiz / finishBook / abandonBook), which is what makes them findable
// here — the id a parent deletes is always the event id.
function applyRemoteSessionDelete(ids) {
  const wanted = new Set((Array.isArray(ids) ? ids : []).map(String));
  if (!wanted.size) return false;
  let changed = false;
  const beforeEvents = data.events.length;
  data.events = data.events.filter(e => !wanted.has(String(e.id)));
  if (data.events.length !== beforeEvents) changed = true;
  data.books.forEach(b => {
    const beforeS = b.sessions.length;
    b.sessions = b.sessions.filter(s => !wanted.has(String(s.id)));
    if (b.sessions.length !== beforeS) changed = true;
    const beforeQ = b.quizzes.length;
    b.quizzes = b.quizzes.filter(q => !wanted.has(String(q.id)));
    if (b.quizzes.length !== beforeQ) changed = true;
  });
  return changed;
}

// Redeems a pairing code and builds the resulting data.sync block. Shared by
// the Settings "Connect" button and the first-launch wizard.
async function redeemPairingCode(code, endpoint, deviceId) {
  const res = await fetch(endpoint + "/pair", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    cache: "no-store",
    body: JSON.stringify({ code, deviceId, role: "child", label: data.childName + "'s device" }),
  });
  let json = null;
  try { json = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((json && json.error) || "Could not connect — check the code and try again.");
  const childId = json.childId || sharedChildId();
  try { localStorage.setItem(sharedChildIdKey(), childId); } catch(e) {}
  return {
    enabled: true, endpoint,
    childId,
    deviceId, deviceToken: json.token, ackedIds: [], appliedCommandIds: [], lastPushAt: null,
  };
}

async function connectSync() {
  const code = document.getElementById("syncCodeIn").value.trim().toUpperCase();
  const endpointIn = document.getElementById("syncEndpointIn").value.trim();
  const msg = document.getElementById("syncMsg");
  if (!code) { msg.textContent = "Enter the code shown on your phone."; return; }
  msg.textContent = "Connecting…";
  const endpoint = endpointIn || "/api";
  const deviceId = (data.sync && data.sync.deviceId) || crypto.randomUUID();
  try {
    data.sync = await redeemPairingCode(code, endpoint, deviceId);
    persist();
    renderParent("settings");
    syncPush();
  } catch (err) {
    msg.textContent = err.message + " If it keeps failing, generate a fresh code on your phone and try again.";
  }
}
function disableSync() { if (!data.sync) return; data.sync.enabled = false; persist(); renderParent("settings"); }
function enableSync() { if (!data.sync) return; data.sync.enabled = true; persist(); renderParent("settings"); syncPush(); }
function resyncNow() {
  if (!data.sync || !data.sync.deviceToken) return;
  data.sync.ackedIds = []; // safe: /api/sync is an idempotent upsert
  persist();
  syncPush();
}

function syncSettingsHtml() {
  const s = data.sync;
  if (s && s.deviceToken) {
    return `
      <div class="muted">${s.enabled ? "Sending reading history to your phone, and picking up anything you send from it." : "Sync is paused on this device."}</div>
      <div class="muted" style="margin-bottom:10px">Last synced: ${s.lastPushAt ? new Date(s.lastPushAt).toLocaleString() : "not yet"}</div>
      <div class="row">
        ${s.enabled ? `<button class="outline" onclick="disableSync()">Pause sync</button>` : `<button onclick="enableSync()">Resume sync</button>`}
        <button class="outline" onclick="resyncNow()">Resync now</button>
      </div>
      <div class="muted" style="margin-top:8px">To stop this device permanently, revoke it from the parent dashboard on your phone (Devices tab).</div>`;
  }
  return `
    <p class="muted">On your phone, open the parent dashboard &rarr; Devices &rarr; "Add a device" &rarr; "Child's tablet," then type the code it shows here.</p>
    <label for="syncCodeIn">Pairing code</label>
    <input type="text" id="syncCodeIn" placeholder="6-character code" maxlength="6" style="text-transform:uppercase;text-align:center;font-size:22px;letter-spacing:.25em">
    <details style="margin:6px 0">
      <summary class="muted" style="cursor:pointer">Advanced: custom sync server</summary>
      <label for="syncEndpointIn" style="margin-top:6px">Sync server URL (leave blank for the default)</label>
      <input type="text" id="syncEndpointIn" placeholder="https://your-worker.workers.dev/api">
    </details>
    <button onclick="connectSync()">Connect</button>
    <div class="muted" id="syncMsg" style="color:var(--danger);min-height:16px"></div>`;
}

// ---------- Boot ----------
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
(async function boot() {
  await loadCatalog();
  const profiles = listProfiles();
  if (profiles.length === 0) renderSetup(1);
  else if (profiles.length === 1) pickProfile(profiles[0].key);
  else renderPicker();
})();
</script>
</body>
</html>
